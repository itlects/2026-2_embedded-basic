<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#17283a"><text x="30" y="45" font-size="28" fill="#17283a">DC pump + relay • confirmed active-LOW input</text><rect x="35" y="100" width="220" height="160" rx="8" fill="#d7f1ed" stroke="#31475d" stroke-width="2"/><text x="50" y="132" font-size="24" fill="#17283a">ESP32</text><text x="50" y="168" font-size="18" fill="#17283a">GPIO23 / S3 GPIO17</text><text x="50" y="218" font-size="18" fill="#17283a">GND</text><rect x="330" y="100" width="260" height="215" rx="8" fill="#fff" stroke="#31475d" stroke-width="2"/><text x="345" y="133" font-size="24" fill="#17283a">NPN 2N2222</text><text x="345" y="170" font-size="18" fill="#17283a">B ← 2.2kΩ from GPIO</text><text x="345" y="205" font-size="18" fill="#17283a">E → common GND</text><text x="345" y="239" font-size="18" fill="#17283a">C → relay IN</text><text x="345" y="274" font-size="18" fill="#17283a">10kΩ B to GND</text><path d="M255,160 H292.5 V160 H330" fill="none" stroke="#1976d2" stroke-width="4"/><path d="M255,218 H292.5 V218 H330" fill="none" stroke="#263238" stroke-width="4"/><rect x="665" y="95" width="490" height="225" rx="8" fill="#fdf1dc" stroke="#31475d" stroke-width="2"/><text x="680" y="132" font-size="23" fill="#17283a">5V relay module (active LOW)</text><text x="680" y="165" font-size="18" fill="#17283a">VCC → regulated 5V; GND → common GND</text><text x="680" y="202" font-size="18" fill="#17283a">IN ← NPN collector</text><text x="680" y="243" font-size="18" fill="#17283a">COM / NO = dry contacts (isolated from coil)</text><path d="M590,239 H627.5 V202 H665" fill="none" stroke="#9057b8" stroke-width="4"/><rect x="35" y="385" width="310" height="120" rx="8" fill="#fbe3e3" stroke="#31475d" stroke-width="2"/><text x="50" y="420" font-size="21" fill="#17283a">Pump-rated DC supply</text><text x="50" y="455" font-size="18" fill="#17283a">+ → fuse → COM</text><text x="50" y="482" font-size="18" fill="#17283a">− → pump −</text><rect x="440" y="385" width="260" height="120" rx="8" fill="#fff" stroke="#31475d" stroke-width="2"/><text x="455" y="420" font-size="21" fill="#17283a">Relay contacts</text><text x="455" y="455" font-size="18" fill="#17283a">COM → NO when ON</text><path d="M345,450 H392.5 V450 H440" fill="none" stroke="#e33e39" stroke-width="4"/><rect x="795" y="385" width="350" height="120" rx="8" fill="#dbeafe" stroke="#31475d" stroke-width="2"/><text x="810" y="420" font-size="21" fill="#17283a">DC pump</text><text x="810" y="455" font-size="18" fill="#17283a">NO → pump +</text><text x="810" y="482" font-size="18" fill="#17283a">pump − → supply −</text><path d="M700,450 H747.5 V450 H795" fill="none" stroke="#e33e39" stroke-width="4"/><path d="M985 505 V560 H180 V505" fill="none" stroke="#263238" stroke-width="4"/><text x="35" y="603" font-size="20" fill="#17283a">Flyback diode across pump: stripe/cathode → pump +; anode → pump −.</text><text x="35" y="642" font-size="20" fill="#b42318">Verify actual rated voltage/current and relay trigger with pump disconnected.</text><text x="35" y="682" font-size="20" fill="#b42318">Never use GPIO or ESP32 3V3 as pump power; no mains voltage.</text></g></svg>