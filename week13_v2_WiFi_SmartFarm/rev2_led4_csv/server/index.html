<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Farm</title><style>body{font:16px system-ui;background:#eff6f2;color:#173e2e;margin:24px}main{max-width:1000px;margin:auto}header{background:#145c42;color:white;padding:20px;border-radius:14px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.card{padding:16px;background:white;border-radius:12px}.big{font-size:26px;font-weight:bold}table{width:100%;border-collapse:collapse;background:white}td,th{padding:8px;border-bottom:1px solid #d5e2da;text-align:left}.on{color:#00864e}.off{color:#767676}.scroll{overflow:auto}a{color:#00744b}</style><main><header><h1>Wi-Fi Smart Farm</h1><p>ESP32 → PC CSV → Web dashboard</p></header><p>팀: <select id="team"></select> · <a href="/data.csv">CSV 다운로드</a> · <span id="status">대기 중</span></p><section id="cards"></section><h2>최근 측정 (최대 20건)</h2><div class="scroll"><table><thead><tr><th>시간</th><th>온도</th><th>습도</th><th>토양</th><th>LED</th><th>버튼</th><th>펌프</th><th>모드</th></tr></thead><tbody id="history"></tbody></table></div></main><script>
const $=x=>document.getElementById(x);
const bits=x=>Array.from({length:4},(_,i)=>((Number(x)>>i)&1)?"●":"○").join(" ");
const soil=x=>Number(x)<0?"미측정":x+"%";
function card(name,value){const a=document.createElement("div");a.className="card";const b=document.createElement("div");b.textContent=name;const c=document.createElement("div");c.className="big";c.textContent=value;a.append(b,c);return a}
async function refresh(){try{const r=await fetch("/api/history");if(!r.ok)throw Error();const all=await r.json();const prev=$("team").value;const teams=[...new Set(all.map(x=>x.device))];$("team").replaceChildren(...teams.map(t=>new Option(t,t)));if(teams.includes(prev))$("team").value=prev;const rows=all.filter(x=>x.device===$("team").value);const last=rows.at(-1);$("cards").replaceChildren();$("history").replaceChildren();if(!last){$("status").textContent="데이터 대기";return}const age=(Date.now()-Date.parse(last.timestamp))/1000;$("status").textContent=age>15?"연결 지연 · 마지막 기록":"수신 중";$("cards").append(card("온도",last.temperature+" °C"),card("습도",last.humidity+" %"),card("토양",soil(last.soil)),card("LED 1~4",bits(last.leds)),card("버튼 1~4",bits(last.buttons)),card("펌프",last.pump==="1"?"ON":"OFF"),card("모드",last.mode==="1"?"AUTO":"MANUAL"));for(const x of rows.slice(-20).reverse()){let tr=document.createElement("tr");for(const y of [new Date(x.timestamp).toLocaleTimeString(),x.temperature,x.humidity,soil(x.soil),bits(x.leds),bits(x.buttons),x.pump==="1"?"ON":"OFF",x.mode==="1"?"AUTO":"MANUAL"]){let td=document.createElement("td");td.textContent=y;tr.append(td)}$("history").append(tr)}}catch(e){$("status").textContent="서버 연결 오류"}}
$("team").onchange=refresh;refresh();setInterval(refresh,3000);
</script></html>
