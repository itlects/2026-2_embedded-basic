<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="620" viewBox="0 0 1250 620">
<rect width="1250" height="620" fill="#fafcff"/>
<text x="52" y="58" font-family="Arial" font-weight="bold" font-size="33" fill="#112642">ESP32-DevKitC V4 — microSD SPI connection</text>
<text x="52" y="96" font-family="Arial" font-size="20" fill="#42546a">Diagram labels are GPIO numbers. Match pin silk screen on the physical board.</text>
<rect x="75" y="155" width="410" height="397" rx="18" fill="#1b3855"/>
<text x="113" y="201" font-family="Arial" font-size="26" fill="#ffffff">ESP32 DevKitC V4</text>
