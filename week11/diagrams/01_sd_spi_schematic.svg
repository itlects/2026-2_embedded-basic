<text x="815" y="201" font-family="Arial" font-size="26" fill="#453275">microSD SPI module</text>
<text x="118" y="262" font-family="Arial" font-size="23" fill="white">3V3</text><text x="805" y="262" font-family="Arial" font-size="23" fill="#392958">VCC 3.3V</text>
<path d="M 450 255 L 775 255" stroke="#d64444" stroke-width="6" fill="none"/>
<text x="118" y="312" font-family="Arial" font-size="23" fill="white">GND</text><text x="805" y="312" font-family="Arial" font-size="23" fill="#392958">GND</text>
<path d="M 450 305 L 775 305" stroke="#20252d" stroke-width="6" fill="none"/>
<text x="118" y="362" font-family="Arial" font-size="23" fill="white">GPIO18</text><text x="805" y="362" font-family="Arial" font-size="23" fill="#392958">CLK / SCK</text>
<path d="M 450 355 L 775 355" stroke="#cc7a00" stroke-width="6" fill="none"/>
<text x="118" y="412" font-family="Arial" font-size="23" fill="white">GPIO19</text><text x="805" y="412" font-family="Arial" font-size="23" fill="#392958">DO / MISO</text>
