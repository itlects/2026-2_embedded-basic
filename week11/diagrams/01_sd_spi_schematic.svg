<text x="118" y="512" font-family="Arial" font-size="23" fill="white">GPIO5</text><text x="805" y="512" font-family="Arial" font-size="23" fill="#392958">CS</text>
<path d="M 450 505 L 775 505" stroke="#814cb6" stroke-width="6" fill="none"/>
<text x="54" y="592" font-family="Arial" font-size="19" fill="#a53a45">3.3 V-compatible modules only. All GND lines common. Power off before rewiring.</text></svg>