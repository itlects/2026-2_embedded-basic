<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="white"/><g font-family="Arial,'Noto Sans CJK KR',sans-serif"><text x="45" y="48" font-size="29" font-weight="bold">Arduino UNO: WS2812 8LED + 12LED + 버튼 3개 완성 연결 개략도</text><text x="45" y="82" font-size="18">핀 번호는 실습 코드와 동일 / 배선은 전원을 끄고 작업 / 모듈의 DIN, +5V, GND 실크 인쇄 확인</text><rect x="45" y="125" width="250" height="580" rx="15" fill="#e7f1ff" stroke="#164a81" stroke-width="3"/><text x="75" y="160" font-size="25">Arduino UNO</text><circle cx="295" cy="218" r="5"/><text x="77" y="225" font-size="23">D6</text><circle cx="295" cy="316" r="5"/><text x="77" y="323" font-size="23">D7</text><circle cx="295" cy="430" r="5"/><text x="77" y="437" font-size="23">D2</text><circle cx="295" cy="517" r="5"/><text x="77" y="524" font-size="23">D3</text><circle cx="295" cy="604" r="5"/><text x="77" y="611" font-size="23">D4</text><text x="78" y="676" font-size="23">GND</text><circle cx="295" cy="668" r="5"/><path d="M295 668 H340 V762 H1300" fill="none" stroke="#333" stroke-width="5"/><text x="1098" y="788" font-size="20">공통 GND (-)</text><rect x="1040" y="130" width="290" height="95" rx="8" fill="#fff3da" stroke="#b47400" stroke-width="3"/><text x="1065" y="162" font-size="22">별도 안정된 DC 5V</text><text x="1065" y="193" font-size="19">+5V / GND, 정격 ≥2A</text><path d="M1180 225 V265 H990" stroke="#c22" stroke-width="5" fill="none"/><text x="1014" y="254" font-size="20" fill="#c22">+5V (+)</text><path d="M1250 225 V762" stroke="#333" stroke-width="5"/><circle cx="1250" cy="762" r="7"/><rect x="1025" y="283" width="255" height="83" rx="8" fill="#fff" stroke="#1184ac" stroke-width="3"/><text x="1043" y="316" font-size="22">WS2812 일자형 8LED</text><text x="1043" y="345" font-size="18">DIN  /  +5V  /  GND</text><rect x="1025" y="386" width="255" height="83" rx="8" fill="#fff" stroke="#11875d" stroke-width="3"/><text x="1043" y="419" font-size="22">WS2812 원형 12LED</text><text x="1043" y="448" font-size="18">DIN  /  +5V  /  GND</text><path d="M295 218 H765 M295 316 H765" stroke="#1762b6" stroke-width="4" fill="none"/><rect x="765" y="204" width="100" height="28" rx="4" fill="#fff4c7" stroke="#bf7700" stroke-width="2"/><text x="777" y="224" font-size="17">330Ω</text><path d="M865 218 H995 V325 H1025" stroke="#1762b6" stroke-width="4" fill="none"/><text x="976" y="313" font-size="17" fill="#1762b6">DIN</text><rect x="765" y="302" width="100" height="28" rx="4" fill="#fff4c7" stroke="#bf7700" stroke-width="2"/><text x="777" y="322" font-size="17">330Ω</text><path d="M865 316 H915 V429 H1025" stroke="#23834d" stroke-width="4" fill="none"/><text x="969" y="415" font-size="17" fill="#23834d">DIN</text><path d="M990 265 H1345 V345 H1280 M1345 447 H1280" stroke="#c22" stroke-width="4" fill="none"/><path d="M1290 345 H1280 M1290 448 H1280" stroke="#c22" stroke-width="3"/><path d="M1290 354 V762 M1310 458 V762" stroke="#333" stroke-width="3" fill="none"/><circle cx="1290" cy="762" r="5"/><circle cx="1310" cy="762" r="5"/><text x="1040" y="496" font-size="17">두 모듈의 +5V와 GND는 각각 전원 레일로 연결</text><path d="M295 430 H590" stroke="#9d4a28" stroke-width="4"/><circle cx="590" cy="430" r="5"/><path d="M590 430 l51 -22" stroke="#333" stroke-width="4"/><circle cx="660" cy="430" r="5"/><path d="M660 430 H735 V762" stroke="#333" stroke-width="3" fill="none"/><circle cx="735" cy="762" r="5"/><text x="750" y="421" font-size="19">버튼 A: 증가</text><path d="M295 517 H590" stroke="#9d4a28" stroke-width="4"/><circle cx="590" cy="517" r="5"/><path d="M590 517 l51 -22" stroke="#333" stroke-width="4"/><circle cx="660" cy="517" r="5"/><path d="M660 517 H735 V762" stroke="#333" stroke-width="3" fill="none"/><circle cx="735" cy="762" r="5"/><text x="750" y="508" font-size="19">버튼 B: 초기화</text><path d="M295 604 H590" stroke="#9d4a28" stroke-width="4"/><circle cx="590" cy="604" r="5"/><path d="M590 604 l51 -22" stroke="#333" stroke-width="4"/><circle cx="660" cy="604" r="5"/><path d="M660 604 H735 V762" stroke="#333" stroke-width="3" fill="none"/><circle cx="735" cy="762" r="5"/><text x="750" y="595" font-size="19">버튼 C: 정지/재개</text><text x="42" y="828" font-size="19">주의: 스위치의 반대쪽 접점 사용 / INPUT_PULLUP / ESP32는 5V를 GPIO에 인가하지 않음 / LED의 DOUT은 본 실습에서 연결하지 않음</text><text x="42" y="862" font-size="18">전원 콘덴서: 외부 5V(+)와 GND(-) 사이에 470~1000µF, 극성 확인. 회로 개략도이며 실제 보드 핀 위치를 나타내지 않습니다.</text></g></svg>