0 776" stroke="#c26a00" stroke-width="4" fill="none" stroke-linejoin="round"/><circle cx="1050" cy="746" r="30" fill="#2f2f2f" stroke="#111" stroke-width="2"/><circle cx="1050" cy="746" r="8" fill="#555"/><text x="1050" y="704" font-size="16" font-weight="bold" fill="#1d2433" text-anchor="middle">수동 피에조 부저</text><text x="1032" y="796" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="end">+</text><text x="1094" y="776" font-size="18" font-weight="bold" fill="#1f3d7a" text-anchor="start">−</text><path d="M1080 746 L1120 746 L1120 900" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="60" y="857" font-size="19" font-weight="bold" fill="#1d2433" text-anchor="start">GND</text><circle cx="280" cy="850" r="5" fill="#222"/><path d="M280 850 L300 850 L300 900 L1120 900" stroke="#333" stroke-width="4" fill="none" stroke-linejoin="round"/><circle cx="300" cy="900" r="5" fill="#222"/><circle cx="600" cy="900" r="5" fill="#222"/><circle cx="960" cy="900" r="5" fill="#222"/><circle cx="1120" cy="900" r="5" fill="#222"/><text x="700" y="928" font-size="16" font-weight="bold" fill="#1d2433" text-anchor="middle">공통 GND</text><rect x="700" y="100" width="470" height="150" rx="10" fill="#fff2e4" stroke="#d58a36" stroke-width="2"/><text x="720" y="134" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">부저: D6 → 피에조 (+), 피에조 (−) → GND</text><text x="720" y="164" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">저전류 수동(passive) 피에조만 직접 구동</text><text x="720" y="192" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">자기식 부저는 트랜지스터 드라이버 필요</text><text x="720" y="220" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">LED: 긴 다리(+) 저항 쪽, 짧은 다리(−) GND 쪽</text><text x="40" y="964" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">반원(⌒)으로 넘어가는 선은 연결되지 않음 · 점(●)은 연결점. 버튼 INPUT_PULLUP, LED마다 개별 저항, 모든 GND 공통. UNO PCINT2 그룹이 D2~D5를 감시.</text></g></svg>