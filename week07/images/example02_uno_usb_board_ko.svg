<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="680" viewBox="0 0 1210 680"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a4556"/></marker></defs><rect width="1210" height="680" fill="#ffffff"/><g font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fill="#1d2433"><text x="38" y="50" font-size="25" font-weight="bold" fill="#1d2433" text-anchor="start">예제 2 · 2B 실물 연결도 — Arduino UNO + USB 케이블 (외부 부품 없음)</text><rect x="80" y="110" width="360" height="250" rx="14" fill="#2b6aa8" stroke="#14324f" stroke-width="3"/><rect x="60" y="150" width="70" height="60" rx="4" fill="#c0c6cc" stroke="#555" stroke-width="2"/><text x="95" y="100" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">USB-B 포트</text><rect x="180" y="200" width="150" height="40" rx="4" fill="#1b1b1b"/><text x="255" y="226" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ATmega328P</text><rect x="200" y="122" width="220" height="16" fill="#111"/><rect x="230" y="332" width="190" height="16" fill="#111"/><text x="260" y="300" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Arduino UNO</text><path d="M60 180 C 20 360, 420 520, 640 450" stroke="#333" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="640" y="140" width="460" height="290" rx="12" fill="#2e3440" stroke="#111" stroke-width="3"/><rect x="660" y="160" width="420" height="250" fill="#111a24"/><text x="675" y="190" font-size="15" font-weight="bold" fill="#cfd8e3" text-anchor="start">Arduino IDE · 시리얼 모니터 (115200 baud)</text><text x="680" y="230" font-size="18" font-weight="normal" fill="#9fe3a6" text-anchor="start">TIME 00:00:01</text><text x="680" y="262" font-size="18" font-weight="normal" fill="#9fe3a6" text-anchor="start">TIME 00:00:02</text><text x="680" y="294" font-size="18" font-weight="normal" fill="#9fe3a6" text-anchor="start">TIME 00:00:03</text><text x="680" y="326" font-size="18" font-weight="normal" fill="#9fe3a6" text-anchor="start">TIME 00:00:04</text><path d="M600 430 L1140 430 L1170 470 L570 470 Z" fill="#4c566a" stroke="#111" stroke-width="2"/><rect x="40" y="520" width="1130" height="140" rx="10" fill="#f7f7f7" stroke="#9aa5b5" stroke-width="2"/><text x="60" y="552" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">1. USB-B 케이블로 UNO와 PC를 연결한다.</text><text x="60" y="582" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">2. Arduino IDE: 도구 → 보드 → Arduino Uno, 도구 → 포트에서 새로 나타난 COM 포트 선택.</text><text x="60" y="612" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">3. 예제 2(millis 시계) 또는 예제 2B(타이머 인터럽트 시계)를 업로드하고 시리얼 모니터를 115200 baud로 연다.</text><text x="60" y="642" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="start">4. 예제 1의 버튼은 꽂혀 있어도 되지만 사용하지 않는다. 다른 부품 연결은 필요 없다.</text></g></svg>