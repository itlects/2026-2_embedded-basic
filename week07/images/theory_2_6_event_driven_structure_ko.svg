B · bit2 C</text><rect x="440" y="265" width="240" height="100" rx="12" fill="#eef0ff" stroke="#5560aa" stroke-width="2"/><text x="560" y="305" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">tickFlag · isrSeconds</text><text x="560" y="335" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="middle">volatile 공유 변수</text><path d="M345 195 L436 195" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="390" y="185" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="middle">기록</text><path d="M345 315 L436 315" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="390" y="305" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="middle">기록</text><rect x="760" y="90" width="410" height="470" rx="14" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="965" y="122" font-size="19" font-weight="bold" fill="#1d2433" text-anchor="middle">loop() (메인 프로그램)</text><rect x="785" y="145" width="360" height="76" rx="10" fill="#ffffff" stroke="#8aa3c7" stroke-width="2"/><text x="800" y="173" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">1. 임계구역에서 복사 후 0으로</text><text x="800" y="199" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">noInterrupts / portENTER_CRITICAL</text><rect x="785" y="229" width="360" height="76" rx="10" fill="#ffffff" stroke="#8aa3c7" stroke-width="2"/><text x="800" y="257" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">2. tickFlag → printClock()</text><text x="800" y="283" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">TIME hh:mm:ss 출력</text><rect x="785" y="313" width="360" height="76" rx="10" fill="#ffffff" stroke="#8aa3c7" stroke-width="2"/><text x="800" y="341" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">3. 에지 비트 → 30ms 디바운스</text><text x="800" y="367" font-size="15" font-weight="norma