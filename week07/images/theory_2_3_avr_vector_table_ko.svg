<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="716" viewBox="0 0 1210 716"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a4556"/></marker></defs><rect width="1210" height="716" fill="#ffffff"/><g font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fill="#1d2433"><text x="38" y="52" font-size="28" font-weight="bold" fill="#1d2433" text-anchor="start">2.3 ATmega328P(UNO) 인터럽트 벡터 테이블 — 이번 주 사용 항목</text><text x="38" y="86" font-size="18" font-weight="normal" fill="#3a4556" text-anchor="start">플래시 메모리 0번지부터 벡터마다 JMP 명령 1개(4바이트). 주소가 낮을수록 우선순위가 높다.</text><rect x="50" y="115" width="1040" height="44" rx="6" fill="#24476f" stroke="#24476f" stroke-width="2"/><text x="60" y="145" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">벡터 번호</text><text x="190" y="145" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">바이트 주소</text><text x="340" y="145" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">소스(avr-libc 이름)</text><text x="650" y="145" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">용도 / 이번 주 사용 코드</text><rect x="50" y="159" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="185" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0</text><text x="190" y="185" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0000</text><text x="340" y="185" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">RESET</text><text x="650" y="185" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">전원 인가·리셋 → 초기화 후 setup()</text><rect x="50" y="197" width="1040" height="38" fill="#fff0de" stroke="#d5dbe5"/><text x="60" y="223" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">1</text><text x="190" y="223" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0004</text><text x="340" y="223" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">INT0_vect (D2)</text><text x="650" y="223" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">외부 인터럽트 0 → 예제1 attachInterrupt(D2)</text><rect x="50" y="235" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="261" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">2</text><text x="190" y="261" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0008</text><text x="340" y="261" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">INT1_vect (D3)</text><text x="650" y="261" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">외부 인터럽트 1</text><rect x="50" y="273" width="1040" height="38" fill="#ffffff" stroke="#d5dbe5"/><text x="60" y="299" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">3</text><text x="190" y="299" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x000C</text><text x="340" y="299" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">PCINT0_vect (D8~D13)</text><text x="650" y="299" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">핀 변경 인터럽트 그룹 0</text><rect x="50" y="311" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="337" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">4</text><text x="190" y="337" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0010</text><text x="340" y="337" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">PCINT1_vect (A0~A5)</text><text x="650" y="337" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">핀 변경 인터럽트 그룹 1</text><rect x="50" y="349" width="1040" height="38" fill="#fff0de" stroke="#d5dbe5"/><text x="60" y="375" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">5</text><text x="190" y="375" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0014</text><text x="340" y="375" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">PCINT2_vect (D0~D7)</text><text x="650" y="375" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">핀 변경 그룹 2 → 예제3 버튼 D2·D3·D4</text><rect x="50" y="387" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="413" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">·</text><text x="190" y="413" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">·</text><text x="340" y="413" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">· · ·</text><text x="650" y="413" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">(중간 벡터 생략)</text><rect x="50" y="425" width="1040" height="38" fill="#e8f7ee" stroke="#d5dbe5"/><text x="60" y="451" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">11</text><text x="190" y="451" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x002C</text><text x="340" y="451" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">TIMER1_COMPA_vect</text><text x="650" y="451" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">Timer1 비교일치 A → 예제2B·예제3 1초 시계</text><rect x="50" y="463" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="489" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">·</text><text x="190" y="489" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">·</text><text x="340" y="489" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">· · ·</text><text x="650" y="489" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">(중간 벡터 생략)</text><rect x="50" y="501" width="1040" height="38" fill="#eef0ff" stroke="#d5dbe5"/><text x="60" y="527" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">16</text><text x="190" y="527" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0040</text><text x="340" y="527" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">TIMER0_OVF_vect</text><text x="650" y="527" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">Timer0 오버플로 → Arduino 코어의 millis()</text><rect x="50" y="539" width="1040" height="38" fill="#f6f8fb" stroke="#d5dbe5"/><text x="60" y="565" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">18</text><text x="190" y="565" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">0x0048</text><text x="340" y="565" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">USART_RX_vect</text><text x="650" y="565" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">시리얼 수신 → Serial 라이브러리</text><text x="1145" y="145" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">우선순위</text><text x="1145" y="165" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">높음</text><path d="M1145 175 L1145 547" stroke="#c0392b" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1145" y="569" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">낮음</text><text x="50" y="601" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">※ 바이트 주소 = 벡터 번호 × 4. 데이터시트 표는 워드 주소(× 2: INT0 = 0x0002)로 표기한다.</text><text x="50" y="637" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">ISR(PCINT2_vect){…} 처럼 벡터 이름으로 함수를 정의하면 링커가 해당 벡터 주소에 그 함수로의 JMP를 배치한다.</text><text x="50" y="665" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">attachInterrupt()는 코어가 미리 만든 INT0/INT1 ISR 안에서 사용자 함수 포인터를 호출하는 방식이다.</text><text x="50" y="693" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">ESP32는 벡터 번호 대신 인터럽트 매트릭스로 주변장치 소스를 CPU 인터럽트에 연결하며, 우선순위 레벨(1~7)을 사용한다.</text></g></svg>