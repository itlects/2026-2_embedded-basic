<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="745" viewBox="0 0 1210 745"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a4556"/></marker></defs><rect width="1210" height="745" fill="#ffffff"/><g font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fill="#1d2433"><text x="38" y="52" font-size="28" font-weight="bold" fill="#1d2433" text-anchor="start">2.5 타이머 인터럽트로 만드는 1초 시계 (UNO Timer1 CTC 모드)</text><rect x="40" y="90" width="170" height="84" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="125.0" y="129" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">16 MHz 클럭</text><path d="M210 132 L236 132" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="240" y="90" width="170" height="84" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="325.0" y="129" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">분주기 ÷256</text><path d="M410 132 L436 132" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="440" y="90" width="220" height="84" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="550.0" y="112" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">TCNT1 카운터</text><text x="550.0" y="138" font-size="18" font-weight="normal" fill="#1d2433" text-anchor="middle">62.5 kHz (16 µs/카운트)</text><path d="M660 132 L686 132" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="690" y="90" width="220" height="84" rx="12" fill="#fff0de" stroke="#4070aa" stroke-width="2"/><text x="800.0" y="112" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">비교기</text><text x="800.0" y="138" font-size="18" font-weight="normal" fill="#1d2433" text-anchor="middle">TCNT1 == OCR1A ?</text><path d="M910 132 L936 132" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="940" y="90" width="220" height="84" rx="12" fill="#e8f7ee" stroke="#4070aa" stroke-width="2"/><text x="1050.0" y="112" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="middle">COMPA 인터럽트</text><text x="1050.0" y="138" font-size="18" font-weight="normal" fill="#1d2433" text-anchor="middle">ISR: seconds++</text><path d="M110 470 L1050 470" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M110 470 L110 230" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="100" y="224" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="end">TCNT1</text><text x="1050" y="496" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="end">시간</text><path d="M110 270 L1010 270" stroke="#c0392b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="100" y="276" font-size="16" font-weight="normal" fill="#c0392b" text-anchor="end">62499</text><text x="100" y="476" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="end">0</text><path d="M110 470 L390 270" stroke="#1762b3" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M390 270 L390 470" stroke="#1762b3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="390" cy="270" r="6" fill="#c0392b"/><path d="M390 484 L390 530" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="390" y="552" font-size="16" font-weight="bold" fill="#208657" text-anchor="middle">ISR → 1초</text><path d="M390 470 L670 270" stroke="#1762b3" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M670 270 L670 470" stroke="#1762b3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="670" cy="270" r="6" fill="#c0392b"/><path d="M670 484 L670 530" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="670" y="552" font-size="16" font-weight="bold" fill="#208657" text-anchor="middle">ISR → 2초</text><path d="M670 470 L950 270" stroke="#1762b3" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M950 270 L950 470" stroke="#1762b3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="950" cy="270" r="6" fill="#c0392b"/><path d="M950 484 L950 530" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="950" y="552" font-size="16" font-weight="bold" fill="#208657" text-anchor="middle">ISR → 3초</text><path d="M110 580 L390 580" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M390 580 L110 580" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="250.0" y="572" font-size="16" font-weight="normal" fill="#1d2433" text-anchor="middle">62,500카운트 × 16 µs = 1.000 s</text><rect x="40" y="610" width="1130" height="118" rx="10" fill="#f7f7f7" stroke="#9aa5b5" stroke-width="2"/><text x="60" y="640" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">일치 순간 하드웨어가 TCNT1을 0으로 되돌리므로(CTC) 소프트웨어 지연과 무관하게 주기가 일정하다.</text><text x="60" y="668" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">loop()가 Serial 출력 등으로 늦어져도 초 카운트는 ISR이 유지 → millis() 폴링 시계(예제 2)와 비교해 본다.</text><text x="60" y="696" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">ESP32: timerBegin(1000000)으로 1 MHz 타이머, timerAlarm(timer, 1000000, true, 0)으로 1초마다 ISR (코어 3.x).</text></g></svg>