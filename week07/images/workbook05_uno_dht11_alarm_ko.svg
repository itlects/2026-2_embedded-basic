<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980"><rect width="1300" height="980" fill="#fff"/><g font-family="Arial,sans-serif"><text x="36" y="50" font-size="29" font-weight="bold">워크북5 Arduino UNO: DHT11 + 버튼4 + LED5 + 수동 피에조</text><text x="36" y="88" font-size="18">기능별 전기 연결 개략도. 핀과 연결선을 개별 확인하세요 (실물 보드 핀 배치도 아님).</text><rect x="45" y="126" width="270" height="770" rx="16" fill="#e8f1ff" stroke="#376599" stroke-width="3"/><text x="76" y="160" font-size="25">Arduino UNO</text><text x="70" y="216" font-size="20">DHT 데이터 A0</text><path d="M315 208 H560" stroke="#8a4caa" stroke-width="4"/><rect x="565" y="176" width="300" height="89" rx="9" fill="#fff4d9" stroke="#aa7c32" stroke-width="3"/><text x="582" y="207" font-size="22">DHT11 온습도 센서</text><text x="582" y="240" font-size="18">DATA / VCC / GND</text><text x="910" y="194" font-size="19">5V → VCC</text><text x="910" y="226" font-size="19">GND → 공통 GND</text><text x="910" y="260" font-size="18">모듈 핀 순서 확인</text><text x="70" y="332" font-size="20">D2</text><path d="M315 325 H565" stroke="#1769b6" stroke-width="4"/><circle cx="565" cy="325" r="5"/><path d="M565 325 l50 -22" stroke="#333" stroke-width="3"/><circle cx="638" cy="325" r="5"/><path d="M638 325 H820" stroke="#333" stroke-width="3"/><text x="663" y="309" font-size="19">버튼 A: 경보 ON/OFF</text><text x="940" y="332" font-size="18">다른 접점 → GND</text><text x="70" y="437" font-size="20">D3</text><path d="M315 430 H565" stroke="#1769b6" stroke-width="4"/><circle cx="565" cy="430" r="5"/><path d="M565 430 l50 -22" stroke="#333" stroke-width="3"/><circle cx="638" cy="430" r="5"/><path d="M638 430 H820" stroke="#333" stroke-width="3"/><text x="663" y="414" font-size="19">버튼 B: 임계값 +5</text><text x="940" y="437" font-size="18">다른 접점 → GND</text><text x="70" y="542" font-size="20">D4</text><path d="M315 535 H565" stroke="#1769b6" stroke-width="4"/><circle cx="565" cy="535" r="5"/><path d="M565 535 l50 -22" stroke="#333" stroke-width="3"/><circle cx="638" cy="535" r="5"/><path d="M638 535 H820" stroke="#333" stroke-width="3"/><text x="663" y="519" font-size="19">버튼 C: 임계값 -5</text><text x="940" y="542" font-size="18">다른 접점 → GND</text><text x="70" y="647" font-size="20">D5</text><path d="M315 640 H565" stroke="#1769b6" stroke-width="4"/><circle cx="565" cy="640" r="5"/><path d="M565 640 l50 -22" stroke="#333" stroke-width="3"/><circle cx="638" cy="640" r="5"/><path d="M638 640 H820" stroke="#333" stroke-width="3"/><text x="663" y="624" font-size="19">버튼 D: 부저 음소거</text><text x="940" y="647" font-size="18">다른 접점 → GND</text><text x="70" y="765" font-size="17">D8</text><path d="M315 760 H580" stroke="#288d64" stroke-width="3"/><rect x="580" y="748" width="91" height="24" fill="#fff2cc" stroke="#956426"/><text x="589" y="766" font-size="16">330Ω</text><path d="M671 760 H708" stroke="#288d64" stroke-width="3"/><circle cx="724" cy="760" r="13" fill="#ffdf73" stroke="#815d11" stroke-width="2"/><text x="746" y="765" font-size="17">LED1 양극(+) → 음극(-) → GND</text><text x="70" y="797" font-size="17">D9</text><path d="M315 792 H580" stroke="#288d64" stroke-width="3"/><rect x="580" y="780" width="91" height="24" fill="#fff2cc" stroke="#956426"/><text x="589" y="798" font-size="16">330Ω</text><path d="M671 792 H708" stroke="#288d64" stroke-width="3"/><circle cx="724" cy="792" r="13" fill="#ffdf73" stroke="#815d11" stroke-width="2"/><text x="746" y="797" font-size="17">LED2 양극(+) → 음극(-) → GND</text><text x="70" y="829" font-size="17">D10</text><path d="M315 824 H580" stroke="#288d64" stroke-width="3"/><rect x="580" y="812" width="91" height="24" fill="#fff2cc" stroke="#956426"/><text x="589" y="830" font-size="16">330Ω</text><path d="M671 824 H708" stroke="#288d64" stroke-width="3"/><circle cx="724" cy="824" r="13" fill="#ffdf73" stroke="#815d11" stroke-width="2"/><text x="746" y="829" font-size="17">LED3 양극(+) → 음극(-) → GND</text><text x="70" y="861" font-size="17">D11</text><path d="M315 856 H580" stroke="#288d64" stroke-width="3"/><rect x="580" y="844" width="91" height="24" fill="#fff2cc" stroke="#956426"/><text x="589" y="862" font-size="16">330Ω</text><path d="M671 856 H708" stroke="#288d64" stroke-width="3"/><circle cx="724" cy="856" r="13" fill="#ffdf73" stroke="#815d11" stroke-width="2"/><text x="746" y="861" font-size="17">LED4 양극(+) → 음극(-) → GND</text><text x="70" y="893" font-size="17">D12</text><path d="M315 888 H580" stroke="#288d64" stroke-width="3"/><rect x="580" y="876" width="91" height="24" fill="#fff2cc" stroke="#956426"/><text x="589" y="894" font-size="16">330Ω</text><path d="M671 888 H708" stroke="#288d64" stroke-width="3"/><circle cx="724" cy="888" r="13" fill="#ffdf73" stroke="#815d11" stroke-width="2"/><text x="746" y="893" font-size="17">LED5 양극(+) → 음극(-) → GND</text><text x="53" y="932" font-size="18">부저: D6 → 소전류 수동 피에조 (+), (-) → GND. 모든 GND는 공통.</text><text x="53" y="959" font-size="16">DHT11 단품(4핀)은 DATA 풀업 4.7~10kΩ 필요. 3핀 모듈은 내장 풀업 여부를 확인. ESP32 GPIO에는 5V 입력 금지.</text></g></svg>