="bold" fill="#208657" text-anchor="start">DIN</text><text x="1040" y="344" font-size="13" font-weight="bold" fill="#d42b2b" text-anchor="end">+5V</text><text x="1040" y="376" font-size="13" font-weight="bold" fill="#222" text-anchor="end">GND</text><circle cx="840" cy="366" r="5" fill="#208657"/><path d="M1050 340 L1150 340" stroke="#d42b2b" stroke-width="3" fill="none" stroke-linejoin="round"/><circle cx="1150" cy="340" r="5" fill="#d42b2b"/><path d="M1050 372 L1142 372" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1142 372 A8 8 0 0 1 1158 372" stroke="#222" stroke-width="3" fill="#ffffff"/><path d="M1158 372 L1200 372" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round"/><circle cx="1200" cy="372" r="5" fill="#222"/><path d="M260 200 L640 200" stroke="#1762b3" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M640 200 L650 200 L655.0 191 L665.0 209 L675.0 191 L685.0 209 L695.0 191 L705.0 209 L710 200 L720 200" stroke="#7a4b12" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="680.0" y="186" font-size="15" font-weight="normal" fill="#7a4b12" text-anchor="middle">330Ω</text><path d="M720 200 L790 200 L790 226 L840 226" stroke="#1762b3" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M260 270 L640 270" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M640 270 L650 270 L655.0 261 L665.0 279 L675.0 261 L685.0 279 L695.0 261 L705.0 279 L710 270 L720 270" stroke="#7a4b12" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="680.0" y="256" font-size="15" font-weight="normal" fill="#7a4b12" text-anchor="middle">330Ω</text><path d="M720 270 L760 270 L760 366 L840 366" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M260 600 L290 600 L290 680" stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round"/><circle cx="290" cy="680" r="5" fill="#222"/><circle cx="1200" cy="680" r="5" fill="#222"/><text x="700" y="706" font-size="16" font-weight="bold" fill="#1d2433" text-anchor="middle">공통 GND (MCU · LED 모듈 · 외부 전원)</text><text x="40" y="740" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">UNO 5V 핀으로 외부 5V를 역공급하지 말 것 · 330Ω은 모듈 DIN 가까이 · 첫 시험은 밝기 50 이하</text><text x="40" y="764" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">반원(⌒)으로 넘어가는 선은 서로 연결되지 않음 · 점(●)은 연결점 · 실제 핀 배치를 나타내지 않는 개략도</text><text x="40" y="788" font-size="15" font-weight="normal" fill="#3a4556" text-anchor="start">20개 LED 최대 약 1.2A → USB 5V로 전체 구동 금지, 외부 5V 2A 이상 사용</text></g></svg>