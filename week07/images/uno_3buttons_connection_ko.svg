<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><rect width="1200" height="610" fill="white"/><text x="50" y="62" font-size="32" font-family="sans-serif" font-weight="bold">Arduino UNO — 3버튼 인터럽트 연결도</text><text x="50" y="99" font-family="sans-serif" font-size="19">ATmega328P PCINT2 그룹 · 모든 버튼은 평상시 열린 스위치이며 누르면 LOW · 내부 풀업 사용</text><rect x="50" y="135" width="300" height="383" rx="20" fill="#e5f1ff" stroke="#244772" stroke-width="3"/><text x="97" y="164" font-family="sans-serif" font-size="25">Arduino UNO</text><text x="85" y="192" font-family="sans-serif" font-size="20">D2 / PCINT18</text><path d="M350 185 H607" stroke="#d43b3b" stroke-width="5" fill="none"/><circle cx="607" cy="185" r="6" fill="#d43b3b"/><path d="M607 185 l43 -24" stroke="#222" stroke-width="4"/><circle cx="667" cy="185" r="6" fill="#222"/><path d="M667 185 H960" stroke="#333" stroke-width="4"/><rect x="705" y="130" width="195" height="33" rx="8" fill="#fff" stroke="#d43b3b" stroke-width="2"/><text x="719" y="153" font-family="sans-serif" font-size="20">A: 증가</text><text x="85" y="307" font-family="sans-serif" font-size="20">D3 / PCINT19</text><path d="M350 300 H607" stroke="#208657" stroke-width="5" fill="none"/><circle cx="607" cy="300" r="6" fill="#208657"/><path d="M607 300 l43 -24" stroke="#222" stroke-width="4"/><circle cx="667" cy="300" r="6" fill="#222"/><path d="M667 300 H960" stroke="#333" stroke-width="4"/><rect x="705" y="245" width="195" height="33" rx="8" fill="#fff" stroke="#208657" stroke-width="2"/><text x="719" y="268" font-family="sans-serif" font-size="20">B: 초기화</text><text x="85" y="422" font-family="sans-serif" font-size="20">D4 / PCINT20</text><path d="M350 415 H607" stroke="#2664bf" stroke-width="5" fill="none"/><circle cx="607" cy="415" r="6" fill="#2664bf"/><path d="M607 415 l43 -24" stroke="#222" stroke-width="4"/><circle cx="667" cy="415" r="6" fill="#222"/><path d="M667 415 H960" stroke="#333" stroke-width="4"/><rect x="705" y="360" width="195" height="33" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="719" y="383" font-family="sans-serif" font-size="20">C: 일시정지/재개</text><path d="M960 185 V470 H350" stroke="#292929" stroke-width="5" fill="none"/><text x="90" y="480" font-family="sans-serif" font-size="22">GND</text><text x="940" y="508" font-family="sans-serif" font-size="21">공통 GND</text><circle cx="960" cy="185" r="6"/><circle cx="960" cy="300" r="6"/><circle cx="960" cy="415" r="6"/><text x="50" y="564" font-family="sans-serif" font-size="19">각 스위치의 서로 다른 전기적 접점에 입력핀과 GND를 연결합니다. 4핀 택트 스위치의 같은 쪽 두 다리는 사용하지 마세요.</text></svg>