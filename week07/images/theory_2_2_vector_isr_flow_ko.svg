<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="540" viewBox="0 0 1210 540"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a4556"/></marker></defs><rect width="1210" height="540" fill="#ffffff"/><g font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fill="#1d2433"><text x="38" y="55" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">2.2 인터럽트 벡터와 CPU 처리 절차</text><rect x="60" y="110" width="330" height="110" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="76" y="154" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">① 이벤트 발생 → 플래그 세트</text><text x="76" y="190" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">예: 버튼 하강 에지 → INTF0 / PCIF2</text><rect x="440" y="110" width="330" height="110" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="456" y="154" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">② 허용 여부 확인</text><text x="456" y="190" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">개별 허용 비트 AND 전역 I비트 = 1 ?</text><rect x="820" y="110" width="330" height="110" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="836" y="154" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">③ 현재 명령 완료 후 문맥 보존</text><text x="836" y="190" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">복귀 주소(PC)를 스택에 저장, I비트 = 0</text><rect x="820" y="300" width="330" height="110" rx="12" fill="#fff0de" stroke="#4070aa" stroke-width="2"/><text x="836" y="344" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">④ 벡터 테이블로 점프 → ISR 진입</text><text x="836" y="380" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">벡터 주소의 JMP 명령 → ISR 시작</text><rect x="440" y="300" width="330" height="110" rx="12" fill="#fff0de" stroke="#4070aa" stroke-width="2"/><text x="456" y="344" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">⑤ ISR: 짧게 플래그·카운트 기록</text><text x="456" y="380" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">Serial·delay·show() 금지, 수 µs 이내</text><rect x="60" y="300" width="330" height="110" rx="12" fill="#e8f7ee" stroke="#4070aa" stroke-width="2"/><text x="76" y="344" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">⑥ RETI로 복귀 → loop()에서 처리</text><text x="76" y="380" font-size="16" font-weight="normal" fill="#3a4556" text-anchor="start">PC 복원, I비트 = 1, 중단 지점부터 재개</text><path d="M390 165 L436 165" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M770 165 L816 165" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M985 220 L985 296" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M820 355 L774 355" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M440 355 L394 355" stroke="#3a4556" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="60" y="450" width="1090" height="70" rx="10" fill="#f7f7f7" stroke="#9aa5b5" stroke-width="2"/><text x="80" y="480" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">AVR(UNO)은 ISR 진입 시 하드웨어가 전역 인터럽트(I비트)를 자동으로 끄므로 기본적으로 ISR 중첩이 없다.</text><text x="80" y="506" font-size="17" font-weight="normal" fill="#1d2433" text-anchor="start">ISR 수행 중 발생한 다른 인터럽트는 플래그로 대기했다가 RETI 이후 우선순위 순서대로 처리된다.</text></g></svg>