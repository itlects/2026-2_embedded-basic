<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#fff"/><text x="38" y="55" font-family="sans-serif" font-size="30" font-weight="bold">2.4 풀업 입력과 버튼 디바운싱</text><rect x="45" y="110" width="470" height="65" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="61" y="150" font-family="sans-serif" font-size="21">INPUT_PULLUP: 떼면 HIGH, 누르면 LOW</text><rect x="655" y="110" width="485" height="65" rx="12" fill="#fff4da" stroke="#4070aa" stroke-width="2"/><text x="671" y="150" font-family="sans-serif" font-size="21">버튼 입력은 접점 바운스로 여러 번 변할 수 있음</text><text x="48" y="247" font-family="sans-serif" font-size="21">전압(예시)</text><path d="M170 265 H290 V390 H325 V265 H360 V390 H410 V265 H440 V390 H1080" fill="none" stroke="#1671bf" stroke-width="5"/><path d="M165 390 H1100" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><text x="185" y="255" font-family="sans-serif" font-size="19">HIGH</text><text x="185" y="421" font-family="sans-serif" font-size="19">LOW</text><path d="M450 260 V418 M620 260 V418" stroke="#c55936" stroke-width="2" stroke-dasharray="7 5"/><text x="460" y="450" font-family="sans-serif" font-size="20">약 30ms 연속 LOW 확인 후 1회 인정</text><text x="48" y="507" font-family="sans-serif" font-size="19">ISR: 에지 감지 플래그만 기록 · loop(): digitalRead()와 millis()로 안정 상태를 확인</text></svg>