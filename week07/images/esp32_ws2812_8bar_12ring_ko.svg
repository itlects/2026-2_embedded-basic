<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="790" viewBox="0 0 1250 790"><rect width="1250" height="790" fill="#fff"/><text x="36" y="48" font-family="sans-serif" font-size="29" font-weight="bold">ESP32 DevKit — WS2812 일자형 8LED + 원형 12LED / 3버튼</text><text x="36" y="82" font-family="sans-serif" font-size="19">전기적 연결 개략도(물리적 보드 핀 위치 그림이 아님) · LED 전원: 안정된 외부 DC 5V</text><rect x="32" y="118" width="280" height="490" rx="15" fill="#e5f1ff" stroke="#2471bd" stroke-width="3"/><text x="71" y="160" font-family="sans-serif" font-size="26">ESP32 DevKit</text><text x="59" y="210" font-family="sans-serif" font-size="20">GPIO23</text><line x1="312" y1="201" x2="465" y2="201" stroke="#0063cf" stroke-width="4"/><text x="59" y="285" font-family="sans-serif" font-size="20">GPIO22</text><line x1="312" y1="276" x2="465" y2="276" stroke="#13854f" stroke-width="4"/><text x="59" y="360" font-family="sans-serif" font-size="20">GPIO18</text><line x1="312" y1="351" x2="465" y2="351" stroke="#e07826" stroke-width="4"/><text x="59" y="435" font-family="sans-serif" font-size="20">GPIO19</text><line x1="312" y1="426" x2="465" y2="426" stroke="#af4fb8" stroke-width="4"/><text x="59" y="510" font-family="sans-serif" font-size="20">GPIO21</text><line x1="312" y1="501" x2="465" y2="501" stroke="#8d5840" stroke-width="4"/><text x="65" y="594" font-family="sans-serif" font-size="22">GND</text><rect x="484" y="161" width="320" height="76" rx="10" fill="#f5faff" stroke="#1376c2" stroke-width="3"/><text x="498" y="192" font-family="sans-serif" font-size="22">WS2812 일자형 8LED</text><text x="498" y="218" font-family="sans-serif" font-size="17">DIN (330~470Ω 직렬저항) / +5V / GND</text><rect x="484" y="254" width="320" height="76" rx="10" fill="#f1fff2" stroke="#13854f" stroke-width="3"/><text x="498" y="285" font-family="sans-serif" font-size="22">WS2812 원형 12LED</text><text x="498" y="310" font-family="sans-serif" font-size="17">DIN (330~470Ω 직렬저항) / +5V / GND</text><rect x="485" y="347" width="290" height="46" rx="12" fill="#fff" stroke="#555" stroke-width="3"/><text x="515" y="377" font-family="sans-serif" font-size="21">A: 증가 → GND</text><rect x="485" y="422" width="290" height="46" rx="12" fill="#fff" stroke="#555" stroke-width="3"/><text x="515" y="452" font-family="sans-serif" font-size="21">B: 초기화 → GND</text><rect x="485" y="497" width="290" height="46" rx="12" fill="#fff" stroke="#555" stroke-width="3"/><text x="515" y="527" font-family="sans-serif" font-size="21">C: 일시정지/재개 → GND</text><rect x="840" y="155" width="364" height="390" rx="15" fill="#fffaf0" stroke="#d68b11" stroke-width="3"/><text x="863" y="193" font-family="sans-serif" font-size="24">외부 5V 전원 · 공통 GND</text><text x="858" y="238" font-family="sans-serif" font-size="20">5V (+) → 두 LED 모듈 +5V</text><text x="858" y="277" font-family="sans-serif" font-size="20">GND (-) → 두 모듈 GND</text><text x="858" y="316" font-family="sans-serif" font-size="20">GND (-) → ESP32 DevKit GND</text><text x="858" y="355" font-family="sans-serif" font-size="20">각 버튼 반대편 → GND</text><text x="858" y="407" font-family="sans-serif" font-size="17">전원 입력부: 470~1000µF</text><text x="858" y="431" font-family="sans-serif" font-size="17">커패시터 (+/-극성 확인)</text><text x="858" y="477" font-family="sans-serif" font-size="17">GPIO → 74AHCT125 → DIN 저항</text><text x="42" y="665" font-family="sans-serif" font-size="19">※ 신호 경로: GPIO23 → 5V 레벨시프터 → 330~470Ω → 일자형 DIN · GPIO22 → 5V 레벨시프터 → 330~470Ω → 원형 DIN</text><text x="42" y="705" font-family="sans-serif" font-size="18">※ LED별 최대 약 60mA 가정: 총 20개 최대 약 1.2A. 5V 2A 이상 전원 권장. 외부 +5V를 MCU 5V 핀으로 역공급하지 마세요.</text><text x="42" y="745" font-family="sans-serif" font-size="18">※ 보드 실크의 DIN / +5V / GND를 실물에서 확인하세요. DOUT은 데이터 입력 단자가 아닙니다.</text></svg>