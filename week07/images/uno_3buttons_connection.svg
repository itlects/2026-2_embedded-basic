<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#fff"/><text x="35" y="43" font-size="27" font-family="sans-serif">Arduino UNO — three independent switches to GND (PCINT)</text><rect x="40" y="90" width="270" height="350" rx="24" fill="#e5f0ff" stroke="#183e7a" stroke-width="3"/><text x="86" y="145" font-size="28" font-family="sans-serif">Arduino UNO</text><g font-size="20" font-family="sans-serif"><text x="90" y="203">D2  / PCINT18</text><text x="90" y="278">D3  / PCINT19</text><text x="90" y="353">D4  / PCINT20</text><text x="90" y="414">GND</text></g><g stroke="#1763d4" stroke-width="5" fill="none"><path d="M310 196 H530"/><path d="M310 271 H530"/><path d="M310 346 H530"/></g><g stroke="#222" stroke-width="4" fill="white"><rect x="530" y="178" width="95" height="36" rx="7"/><rect x="530" y="253" width="95" height="36" rx="7"/><rect x="530" y="328" width="95" height="36" rx="7"/></g><g font-size="19" font-family="sans-serif"><text x="648" y="201">A: increment</text><text x="648" y="276">B: reset</text><text x="648" y="351">C: pause/resume</text></g><g stroke="#333" stroke-width="5" fill="none"><path d="M625 196 H830 V406 H310"/><path d="M625 271 H830"/><path d="M625 346 H830"/></g><g fill="#111"><circle cx="830" cy="196" r="7"/><circle cx="830" cy="271" r="7"/><circle cx="830" cy="346" r="7"/><circle cx="830" cy="406" r="7"/></g><text x="825" y="445" font-size="20" font-family="sans-serif">Common GND</text><text x="40" y="478" font-size="16" font-family="sans-serif">Each rectangle represents one normally-open tactile switch. Connect opposite electrical sides, not same-side legs.</text></svg>