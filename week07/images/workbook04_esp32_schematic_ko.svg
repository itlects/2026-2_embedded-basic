<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="white"/><g font-family="sans-serif"><text x="40" y="48" font-size="30" font-weight="bold">ESP32 DevKit - 4 버튼, 5 LED, 수동 부저 연결 개략도</text><rect x="40" y="86" width="250" height="735" rx="18" fill="#e4f1ff" stroke="#23618a" stroke-width="3"/><text x="65" y="130" font-size="26">ESP32 DevKit</text><text x="57" y="190" font-size="21">GPIO18</text><path d="M290 185 H450" stroke="#1762b3" stroke-width="4"/><circle cx="450" cy="185" r="5"/><path d="M450 185 l45 -22" stroke="#222" stroke-width="3"/><circle cx="510" cy="185" r="5"/><path d="M510 185 H615 V815" stroke="#333" stroke-width="3" fill="none"/><text x="520" y="173" font-size="20">버튼 A: 시작/일시정지</text><text x="57" y="277" font-size="21">GPIO19</text><path d="M290 272 H450" stroke="#1762b3" stroke-width="4"/><circle cx="450" cy="272" r="5"/><path d="M450 272 l45 -22" stroke="#222" stroke-width="3"/><circle cx="510" cy="272" r="5"/><path d="M510 272 H615 V815" stroke="#333" stroke-width="3" fill="none"/><text x="520" y="260" font-size="20">버튼 B: 모드</text><text x="57" y="364" font-size="21">GPIO21</text><path d="M290 359 H450" stroke="#1762b3" stroke-width="4"/><circle cx="450" cy="359" r="5"/><path d="M450 359 l45 -22" stroke="#222" stroke-width="3"/><circle cx="510" cy="359" r="5"/><path d="M510 359 H615 V815" stroke="#333" stroke-width="3" fill="none"/><text x="520" y="347" font-size="20">버튼 C: 속도</text><text x="57" y="451" font-size="21">GPIO22</text><path d="M290 446 H450" stroke="#1762b3" stroke-width="4"/><circle cx="450" cy="446" r="5"/><path d="M450 446 l45 -22" stroke="#222" stroke-width="3"/><circle cx="510" cy="446" r="5"/><path d="M510 446 H615 V815" stroke="#333" stroke-width="3" fill="none"/><text x="520" y="434" font-size="20">버튼 D: 초기화</text><text x="57" y="555" font-size="20">GPIO13</text><path d="M290 550 H690" stroke="#208956" stroke-width="3"/><rect x="690" y="538" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818"/><text x="700" y="555" font-size="17">330Ω</text><path d="M780 550 H850" stroke="#208956" stroke-width="3"/><circle cx="850" cy="550" r="9" fill="#f9d947" stroke="#654c18"/><path d="M860 550 H1060 V815" stroke="#333" stroke-width="3" fill="none"/><text x="874" y="538" font-size="18">LED1 (+)→(-)</text><text x="57" y="603" font-size="20">GPIO14</text><path d="M290 598 H690" stroke="#208956" stroke-width="3"/><rect x="690" y="586" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818"/><text x="700" y="603" font-size="17">330Ω</text><path d="M780 598 H850" stroke="#208956" stroke-width="3"/><circle cx="850" cy="598" r="9" fill="#f9d947" stroke="#654c18"/><path d="M860 598 H1060 V815" stroke="#333" stroke-width="3" fill="none"/><text x="874" y="586" font-size="18">LEGPIO18 (+)→(-)</text><text x="57" y="651" font-size="20">GPIO25</text><path d="M290 646 H690" stroke="#208956" stroke-width="3"/><rect x="690" y="634" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818"/><text x="700" y="651" font-size="17">330Ω</text><path d="M780 646 H850" stroke="#208956" stroke-width="3"/><circle cx="850" cy="646" r="9" fill="#f9d947" stroke="#654c18"/><path d="M860 646 H1060 V815" stroke="#333" stroke-width="3" fill="none"/><text x="874" y="634" font-size="18">LEGPIO19 (+)→(-)</text><text x="57" y="699" font-size="20">GPIO26</text><path d="M290 694 H690" stroke="#208956" stroke-width="3"/><rect x="690" y="682" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818"/><text x="700" y="699" font-size="17">330Ω</text><path d="M780 694 H850" stroke="#208956" stroke-width="3"/><circle cx="850" cy="694" r="9" fill="#f9d947" stroke="#654c18"/><path d="M860 694 H1060 V815" stroke="#333" stroke-width="3" fill="none"/><text x="874" y="682" font-size="18">LEGPIO21 (+)→(-)</text><text x="57" y="747" font-size="20">GPIO27</text><path d="M290 742 H690" stroke="#208956" stroke-width="3"/><rect x="690" y="730" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818"/><text x="700" y="747" font-size="17">330Ω</text><path d="M780 742 H850" stroke="#208956" stroke-width="3"/><circle cx="850" cy="742" r="9" fill="#f9d947" stroke="#654c18"/><path d="M860 742 H1060 V815" stroke="#333" stroke-width="3" fill="none"/><text x="874" y="730" font-size="18">LEGPIO22 (+)→(-)</text><text x="60" y="797" font-size="20">GND</text><path d="M290 790 H615 V815 H1120" stroke="#333" stroke-width="4" fill="none"/><text x="60" y="839" font-size="20">GPIO23: 수동 피에조 부저 (+) → 부저 (-) → GND</text><rect x="880" y="115" width="345" height="120" rx="10" fill="#fff2e4" stroke="#d58a36" stroke-width="2"/><text x="899" y="150" font-size="21">부저: D6 → 피에조 (+)</text><text x="899" y="184" font-size="21">피에조 (-) → 공통 GND</text><text x="899" y="215" font-size="17">저전류 수동 피에조만 직접 구동</text><text x="40" y="880" font-size="18">연결 개략도(실물 핀 배열 아님). 버튼 INPUT_PULLUP, LED마다 개별 220~330Ω 저항, 모든 GND 공통.</text></g></svg>