<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" fill="white"/><text x="38" y="52" font-family="sans-serif" font-size="29" font-weight="bold">워크북 1 · Arduino UNO 버튼 인터럽트 연결도</text><rect x="55" y="120" width="275" height="205" rx="18" fill="#e6f1ff" stroke="#1b5288" stroke-width="3"/><text x="93" y="171" font-family="sans-serif" font-size="27">Arduino UNO</text><text x="90" y="227" font-family="sans-serif" font-size="22">D2 / INT0</text><text x="90" y="287" font-family="sans-serif" font-size="22">GND</text><path d="M330 220 H540" stroke="#1c66b1" stroke-width="5"/><circle cx="540" cy="220" r="6" fill="#1c66b1"/><path d="M540 220 l63 -29" stroke="#222" stroke-width="4"/><circle cx="620" cy="220" r="6" fill="#222"/><path d="M620 220 H870 V280 H330" stroke="#333" stroke-width="5" fill="none"/><text x="650" y="192" font-family="sans-serif" font-size="24">버튼 1개 (평상시 열림)</text><text x="885" y="287" font-family="sans-serif" font-size="22">공통 GND</text><text x="55" y="362" font-family="sans-serif" font-size="20">버튼을 누르면 D2 / INT0 → GND가 연결되어 HIGH → LOW. pinMode(INPUT_PULLUP) 사용.</text><text x="55" y="394" font-family="sans-serif" font-size="17">4핀 택트 스위치는 같은 쪽 두 다리가 내부 연결되어 있으므로 서로 다른 접점을 사용하세요.</text></svg>