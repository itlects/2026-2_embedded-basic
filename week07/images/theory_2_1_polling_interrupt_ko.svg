<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#fff"/><text x="38" y="55" font-family="sans-serif" font-size="30" font-weight="bold">2.1 폴링(Polling)과 인터럽트(Interrupt)</text><rect x="45" y="115" width="480" height="65" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="61" y="155" font-family="sans-serif" font-size="21">폴링: loop()가 입력을 반복 확인</text><rect x="685" y="115" width="465" height="65" rx="12" fill="#eaf9ef" stroke="#4070aa" stroke-width="2"/><text x="701" y="155" font-family="sans-serif" font-size="21">인터럽트: 이벤트 발생 시 ISR 호출</text><rect x="85" y="255" width="360" height="65" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="101" y="295" font-family="sans-serif" font-size="21">입력 확인 → 없음 → 다시 확인</text><rect x="725" y="255" width="370" height="65" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="741" y="295" font-family="sans-serif" font-size="21">메인 프로그램 실행 중</text><path d="M260 180 L260 255" stroke="#4a5568" stroke-width="3" fill="none"/><circle cx="260" cy="255" r="5" fill="#4a5568"/><path d="M900 180 L900 255" stroke="#4a5568" stroke-width="3" fill="none"/><circle cx="900" cy="255" r="5" fill="#4a5568"/><rect x="85" y="370" width="360" height="65" rx="12" fill="#eaf2ff" stroke="#4070aa" stroke-width="2"/><text x="101" y="410" font-family="sans-serif" font-size="21">입력이 있으면 메인 루프에서 처리</text><rect x="725" y="370" width="370" height="65" rx="12" fill="#fff0de" stroke="#4070aa" stroke-width="2"/><text x="741" y="410" font-family="sans-serif" font-size="21">ISR: 짧게 이벤트 플래그 기록</text><path d="M260 320 L260 370" stroke="#4a5568" stroke-width="3" fill="none"/><circle cx="260" cy="370" r="5" fill="#4a5568"/><path d="M900 320 L900 370" stroke="#4a5568" stroke-width="3" fill="none"/><circle cx="900" cy="370" r="5" fill="#4a5568"/><text x="65" y="490" font-family="sans-serif" font-size="20">폴링: 검사 주기 사이의 짧은 입력을 놓칠 수 있음</text><text x="685" y="490" font-family="sans-serif" font-size="20">인터럽트: ISR 종료 후 원래 작업으로 복귀</text></svg>