<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="760" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">40비트 프레임 해독과 체크섬 — 예: 습도 53 %, 온도 24 °C</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">받은 비트를 8개씩 묶어 5바이트로 만든다 → 앞 4바이트를 더한 값의 하위 8비트가 5번째 바이트와 같으면 정상</text><rect x="60" y="150" width="240" height="200" rx="10" fill="white" stroke="#2664bf" stroke-width="2.5"/><rect x="60" y="150" width="240" height="38" rx="10" fill="#2664bf"/><text x="180.0" y="176" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Byte 0 · 습도 정수</text><rect x="74" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="85" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="101" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="112" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="128" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="139" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><rect x="155" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="166" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><rect x="182" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="193" y="230" font-size="17" f