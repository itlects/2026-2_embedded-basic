ace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="740" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="751" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="767" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="778" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><text x="684.0" y="262" font-size="12" font-weight="normal" fill="#777" text-anchor="middle">비트 16~23</text><text x="684.0" y="296" font-size="20" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#e07b16" text-anchor="middle" xml:space="preserve">0x18 = 24</text><text x="684.0" y="330" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">→ 24 °C</text><rect x="816" y="150" width="240" height="200" rx="10" fill="white" stroke="#d69a5a" stroke-width="2.5"/><rect x="816" y="150" width="240" height="38" rx="10" fill="#d69a5a"/><text x="936.0" y="176" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Byte 3 · 온도 소수</text><rect x="830" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="841" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="857" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="868" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="884" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="895" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="911" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="922" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="938" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="949" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="965" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="976" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="992" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1003" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="1019" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1030" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><text x="936.0" y="262" font-size="12" font-weight="normal" fill="#777" text-anchor="middle">비트 24~31</text><text x="936.0" y="296" font-size="20" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#d69a5a" text-anchor="middle" xml:space="preserve">0x00 = 0</text><text x="936.0" y="330" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">→ .0</text><rect x="1068" y="150" width="240" height="200" rx="10" fill="white" stroke="#208657" stroke-width="2.5"/><rect x="1068" y="150" width="240" height="38" rx="10" fill="#208657"/><text x="1188.0" y="176" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Byte 4 · 체크섬</text><rect x="1082" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1093" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="1109" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="1120" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><rect x="1136" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1147" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="1163" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1174" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="1190" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="1201" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><rect x="1217" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="1228" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><rect x="1244" y="206" width="22" height="34" rx="4" fill="#eef5ff" stroke="#aab" stroke-width="1"/><text x="1255" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">0</text><rect x="1271" y="206" width="22" height="34" rx="4" fill="#ffe9c7" stroke="#aab" stroke-width="1"/><text x="1282" y="230" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#222" text-anchor="middle" xml:space="preserve">1</text><text x="1188.0" y="262" font-size="12" font-weight="normal" fill="#777" text-anchor="middle">비트 32~39</text><text x="1188.0" y="296" font-size="20" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#208657" text-anchor="middle" xml:space="preserve">0x4D = 77</text><text x="1188.0" y="330" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">→ 검사값 77</text><rect x="40" y="390" width="660" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="424" font-size="20" font-weight="bold" fill="#208657" text-anchor="start">① 체크섬 계산</text><text x="70" y="450" font-size="18" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">  0x35 + 0x00 + 0x18 + 0x00</text><text x="70" y="480" font-size="18" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">=  53  +  0  +  24  +  0  = 77</text><text x="70" y="510" font-size="18" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">=  0x4D  (하위 8비트만 사용: &amp; 0xFF)</text><text x="70" y="548" font-size="18" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#208657" text-anchor="start" xml:space="preserve">받은 Byte 4 = 0x4D  →  일치 → OK</text><text x="70" y="590" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">비트 하나라도 잘못 읽으면? 예) Byte 2의 마지막 비트 0→1</text><text x="70" y="618" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#c62828" text-anchor="start" xml:space="preserve">0x35+0x00+0x19+0x00 = 0x4E ≠ 0x4D → FAIL</text><text x="70" y="660" font-size="14" font-weight="normal" fill="#222" text-anchor="start">→ 라이브러리는 이 값을 버리고 NaN을 돌려준다(isnan() 검사 이유)</text><rect x="720" y="390" width="640" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="740" y="424" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">② 같은 방식, DHT22(Wokwi)는 해석만 다르다</text><text x="750" y="450" font-size="18" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">수신: 0x02 0x8C | 0x01 0x5F | 0xEE</text><text x="750" y="488" font-size="17" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">습도 = 0x028C = 652 → ×0.1 = 65.2 %</text><text x="750" y="518" font-size="17" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">온도 = 0x015F = 351 → ×0.1 = 35.1 °C</text><text x="750" y="548" font-size="17" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#208657" text-anchor="start" xml:space="preserve">검사 = 02+8C+01+5F = 0xEE → OK</text><text x="750" y="590" font-size="14" font-weight="bold" fill="#7b4bb3" text-anchor="start">온도 바이트 최상위 비트(0x80)가 1이면 영하(음수)</text><text x="750" y="620" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DHT11 해석 코드를 DHT22 데이터에 쓰면</text><text x="750" y="644" font-size="14" font-weight="normal" fill="#222" text-anchor="start">엉뚱한 값이 나온다 → 센서 종류 설정이 중요</text><text x="60" y="730" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">코드: data[i/8] &lt;&lt;= 1;  if (high_us &gt; 48) data[i/8] |= 1;   →   sum = (data[0]+data[1]+data[2]+data[3]) &amp; 0xFF;</text></svg>