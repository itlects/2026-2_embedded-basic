<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="826" viewBox="0 0 1400 826" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="826" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">센서 인터페이스 비교 — DHT 단일선 · Dallas 1-Wire · I²C</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">세 방식 모두 '풀업 + 오픈드레인' 위에서 동작한다. 차이는 비트를 구분하는 방법과 장치를 구별(주소)하는 방법</text><rect x="40" y="110" width="425" height="330" rx="12" fill="white" stroke="#c78a00" stroke-width="2.5"/><rect x="40" y="110" width="425" height="44" rx="12" fill="#c78a00"/><text x="60" y="140" font-size="17" font-weight="bold" fill="white" text-anchor="start">DHT 단일선 (DHT11/22)</text><text x="445" y="140" font-size="12" font-weight="bold" fill="white" text-anchor="end">실물 실습 1~5</text><rect x="65" y="190" width="90" height="120" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="110" y="215" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><path d="M180.0 175.0 L180.0 195.0" stroke="#d43b3b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="182" font-size="11" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><rect x="172" y="195" width="16" height="40" rx="2" fill="#fff5da" stroke="#8a5818" stroke-width="1.5"/><path d="M155.0 250.0 L440.0 250.0" stroke="#c78a00" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M180.0 235.0 L180.0 250.0" stroke="#c78a00" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="180" cy="250" r="6" fill="#c78a00" stroke="white" stroke-width="1.5"/><text x="160" y="243" font-size="11" font-weight="bold" fill="#c78a00" text-anchor="start">IO4</text><path d="M270.0 250.0 L270.0 275.0" stroke="#c78a00" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="240" y="275" width="60" height="50" rx="5" fill="#3d9be0" stroke="#1f6aa8" stroke-width="2"/><text x="270" y="305" font-size="11" font-weight="bold" fill="white" text-anchor="middle">DHT11</text><text x="340" y="300" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">센서 1개만</text><text x="62" y="370" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 신호선 1개 + 전원·GND</text><text x="62" y="394" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• 주소 없음 → 버스당 1개</text><text x="62" y="418" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• HIGH 길이(26/70µs)로 0·1</text><rect x="485" y="110" width="425" height="330" rx="12" fill="white" stroke="#7b4bb3" stroke-width="2.5"/><rect x="485" y="110" width="425" height="44" rx="12" fill="#7b4bb3"/><text x="505" y="140" font-size="17" font-weight="bold" fill="white" text-anchor="start">Dallas 1-Wire (DS18B20)</text><text x="890" y="140" font-size="12" font-weight="bold" fill="white" text-anchor="end">Wokwi C</text><rect x="510" y="190" width="90" height="120" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="555" y="215" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><path d="M625.0 175.0 L625.0 195.0" stroke="#d43b3b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="635" y="182" font-size="11" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><rect x="617" y="195" width="16" height="40" rx="2" fill="#fff5da" stroke="#8a5818" stroke-width="1.5"/><path d="M600.0 250.0 L885.0 250.0" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M625.0 235.0 L625.0 250.0" stroke="#7b4bb3" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="625" cy="250" r="6" fill="#7b4bb3" stroke="white" stroke-width="1.5"/><text x="605" y="243" font-size="11" font-weight="bold" fill="#7b4bb3" text-anchor="start">IO13</text><path d="M715.0 250.0 L715.0 275.0" stroke="#7b4bb3" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M693 320 L693 297 A22 22 0 0 1 737 297 L737 320 Z" fill="#222"/><text x="715" y="340" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">…A1</text><path d="M780.0 250.0 L780.0 275.0" stroke="#7b4bb3" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M758 320 L758 297 A22 22 0 0 1 802 297 L802 320 Z" fill="#222"/><text x="780" y="340" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">…B2</text><path d="M845.0 250.0 L845.0 275.0" stroke="#7b4bb3" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M823 320 L823 297 A22 22 0 0 1 867 297 L867 320 Z" fill="#222"/><text x="845" y="340" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">…C3</text><text x="507" y="370" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 신호선 1개 + GND(+VDD)</text><text x="507" y="394" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• 64비트 ROM 주소 → 여러 개</text><text x="507" y="418" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• LOW 길이 시간 슬롯 + 리셋</text><rect x="930" y="110" width="425" height="330" rx="12" fill="white" stroke="#208657" stroke-width="2.5"/><rect x="930" y="110" width="425" height="44" rx="12" fill="#208657"/><text x="950" y="140" font-size="17" font-weight="bold" fill="white" text-anchor="start">I²C (LCD1602·BH1750 등)</text><text x="1335" y="140" font-size="12" font-weight="bold" fill="white" text-anchor="end">Wokwi C</text><rect x="955" y="190" width="90" height="120" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="1000" y="215" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><path d="M1070.0 175.0 L1070.0 195.0" stroke="#d43b3b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1080" y="182" font-size="11" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><rect x="1062" y="195" width="16" height="40" rx="2" fill="#fff5da" stroke="#8a5818" stroke-width="1.5"/><rect x="1092" y="195" width="16" height="40" rx="2" fill="#fff5da" stroke="#8a5818" stroke-width="1.5"/><path d="M1045.0 245.0 L1330.0 245.0" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1050" y="240" font-size="11" font-weight="bold" fill="#208657" text-anchor="start">SDA 21</text><path d="M1045.0 275.0 L1330.0 275.0" stroke="#2664bf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1050" y="270" font-size="11" font-weight="bold" fill="#2664bf" text-anchor="start">SCL 22</text><path d="M1070.0 235.0 L1070.0 245.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1100.0 235.0 L1100.0 275.0" stroke="#2664bf" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1180.0 245.0 L1180.0 290.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1200.0 275.0 L1200.0 290.0" stroke="#2664bf" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="1158" y="290" width="64" height="38" rx="5" fill="#2f5d8a" stroke="#173552" stroke-width="2"/><text x="1190" y="314" font-size="12" font-weight="bold" fill="white" text-anchor="middle">0x27</text><path d="M1265.0 245.0 L1265.0 290.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1285.0 275.0 L1285.0 290.0" stroke="#2664bf" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="1243" y="290" width="64" height="38" rx="5" fill="#2f5d8a" stroke="#173552" stroke-width="2"/><text x="1275" y="314" font-size="12" font-weight="bold" fill="white" text-anchor="middle">0x23</text><text x="952" y="370" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• SDA + SCL 2선 + 전원·GND</text><text x="952" y="394" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• 7비트 주소 → 여러 개</text><text x="952" y="418" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• SCL 클록에 맞춰 SDA 샘플</text><text x="40" y="476" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">주의: DHT11은 '1-Wire처럼 선 하나'지만 Dallas 1-Wire 규격이 아니다 → OneWire 라이브러리로 읽을 수 없다</text><rect x="40" y="490" width="1320" height="306" rx="8" fill="white" stroke="#9aa3ad" stroke-width="1.5"/><rect x="40" y="490" width="1320" height="34" rx="8" fill="#e8edf3"/><text x="52" y="513" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">구분</text><text x="252" y="513" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">DHT 단일선</text><text x="612" y="513" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">Dallas 1-Wire</text><text x="992" y="513" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">I²C</text><path d="M40.0 524.0 L1360.0 524.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="547" font-size="14" font-weight="bold" fill="#222" text-anchor="start">신호선</text><text x="252" y="547" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DATA 1</text><text x="612" y="547" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DQ 1</text><text x="992" y="547" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SDA·SCL 2</text><path d="M40.0 558.0 L1360.0 558.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="581" font-size="14" font-weight="bold" fill="#222" text-anchor="start">비트 구분</text><text x="252" y="581" font-size="14" font-weight="normal" fill="#222" text-anchor="start">HIGH 펄스 길이</text><text x="612" y="581" font-size="14" font-weight="normal" fill="#222" text-anchor="start">LOW 펄스 길이(시간 슬롯)</text><text x="992" y="581" font-size="14" font-weight="normal" fill="#222" text-anchor="start">클록 엣지(동기식)</text><path d="M40.0 592.0 L1360.0 592.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="615" font-size="14" font-weight="bold" fill="#222" text-anchor="start">시작 / 응답</text><text x="252" y="615" font-size="14" font-weight="normal" fill="#222" text-anchor="start">MCU LOW 18ms → 센서 80/80µs</text><text x="612" y="615" font-size="14" font-weight="normal" fill="#222" text-anchor="start">RESET 480µs → PRESENCE</text><text x="992" y="615" font-size="14" font-weight="normal" fill="#222" text-anchor="start">START → 주소 → ACK</text><path d="M40.0 626.0 L1360.0 626.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="649" font-size="14" font-weight="bold" fill="#222" text-anchor="start">장치 구별</text><text x="252" y="649" font-size="14" font-weight="normal" fill="#222" text-anchor="start">없음(1:1)</text><text x="612" y="649" font-size="14" font-weight="normal" fill="#222" text-anchor="start">ROM 64비트(공장 고유)</text><text x="992" y="649" font-size="14" font-weight="normal" fill="#222" text-anchor="start">7비트 주소(부품 고정·점퍼)</text><path d="M40.0 660.0 L1360.0 660.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="683" font-size="14" font-weight="bold" fill="#222" text-anchor="start">오류 검사</text><text x="252" y="683" font-size="14" font-weight="normal" fill="#222" text-anchor="start">8비트 합 체크섬</text><text x="612" y="683" font-size="14" font-weight="normal" fill="#222" text-anchor="start">CRC-8</text><text x="992" y="683" font-size="14" font-weight="normal" fill="#222" text-anchor="start">바이트마다 ACK/NACK</text><path d="M40.0 694.0 L1360.0 694.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="717" font-size="14" font-weight="bold" fill="#222" text-anchor="start">속도(대략)</text><text x="252" y="717" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1회 측정/1~2초</text><text x="612" y="717" font-size="14" font-weight="normal" fill="#222" text-anchor="start">~15 kbps</text><text x="992" y="717" font-size="14" font-weight="normal" fill="#222" text-anchor="start">100k / 400 kbps</text><path d="M40.0 728.0 L1360.0 728.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="751" font-size="14" font-weight="bold" fill="#222" text-anchor="start">주도권</text><text x="252" y="751" font-size="14" font-weight="normal" fill="#222" text-anchor="start">MCU 요청 후 센서가 일방 전송</text><text x="612" y="751" font-size="14" font-weight="normal" fill="#222" text-anchor="start">마스터가 모든 슬롯 시작</text><text x="992" y="751" font-size="14" font-weight="normal" fill="#222" text-anchor="start">마스터가 클록 생성</text><path d="M40.0 762.0 L1360.0 762.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="785" font-size="14" font-weight="bold" fill="#222" text-anchor="start">ESP32 라이브러리</text><text x="252" y="785" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DHT sensor library / DHTesp</text><text x="612" y="785" font-size="14" font-weight="normal" fill="#222" text-anchor="start">OneWire + DallasTemperature</text><text x="992" y="785" font-size="14" font-weight="normal" fill="#222" text-anchor="start">Wire (I²C 내장)</text></svg>