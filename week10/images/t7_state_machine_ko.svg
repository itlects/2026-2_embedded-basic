<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="700" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">경보 시스템 소프트웨어 구조 — millis() 비차단 루프 + 3상태 상태기계(실습 4)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">loop()는 수 µs마다 돈다. 2초가 지났을 때만 측정하고, 부저는 매 loop마다 시간만 보고 켜고 끈다(delay 없음)</text><rect x="40" y="110" width="500" height="560" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">① loop() 흐름</text><rect x="90" y="160" width="400" height="46" rx="10" fill="#eef2f7" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="189" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">now = millis()</text><path d="M290.0 206.0 L290.0 228.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 228.0 L285.3 216.9 L294.7 216.9 Z" fill="#555"/><rect x="90" y="230" width="400" height="46" rx="10" fill="#fff4d6" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="259" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">now − lastRead ≥ 2000 ?</text><path d="M290.0 276.0 L290.0 298.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 298.0 L285.3 286.9 L294.7 286.9 Z" fill="#555"/><rect x="90" y="300" width="400" height="46" rx="10" fill="#eef2f7" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="329" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">읽기: t, h</text><path d="M290.0 346.0 L290.0 368.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 368.0 L285.3 356.9 L294.7 356.9 Z" fill="#555"/><rect x="90" y="370" width="400" height="46" rx="10" fill="#fff4d6" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="399" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">유효? (NaN·범위)</text><path d="M290.0 416.0 L290.0 438.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 438.0 L285.3 426.9 L294.7 426.9 Z" fill="#555"/><rect x="90" y="440" width="400" height="46" rx="10" fill="#eef2f7" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="469" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">이동평균 3개 → 상태 판단</text><path d="M290.0 486.0 L290.0 508.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 508.0 L285.3 496.9 L294.7 496.9 Z" fill="#555"/><rect x="90" y="510" width="400" height="46" rx="10" fill="#eef2f7" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="539" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">CSV 한 줄 출력</text><path d="M290.0 556.0 L290.0 578.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M290.0 578.0 L285.3 566.9 L294.7 566.9 Z" fill="#555"/><rect x="90" y="580" width="400" height="46" rx="10" fill="#e8f6ee" stroke="#9aa3ad" stroke-width="1.5"/><text x="290" y="609" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="middle">updateActuators(now)</text><text x="500" y="210" font-size="12" font-weight="normal" fill="#777" text-anchor="end">아니오 →</text><path d="M490.0 253.0 L520.0 253.0 L520.0 625.0 L492.0 625.0" stroke="#999" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="500" y="390" font-size="12" font-weight="bold" fill="#c62828" text-anchor="end">실패 → errors++</text><text x="100" y="655" font-size="13" font-weight="normal" fill="#555" text-anchor="start">부저: 120ms ON / 480ms OFF를 시간 비교로만 처리</text><rect x="560" y="110" width="800" height="560" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="580" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">② 상태 전이도</text><ellipse cx="760" cy="300" rx="110" ry="54" fill="white" stroke="#208657" stroke-width="3"/><text x="760" y="296" font-size="17" font-weight="bold" fill="#208657" text-anchor="middle">NORMAL</text><text x="760" y="320" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">부저 OFF · LED OFF</text><ellipse cx="1160" cy="300" rx="110" ry="54" fill="white" stroke="#c62828" stroke-width="3"/><text x="1160" y="296" font-size="17" font-weight="bold" fill="#c62828" text-anchor="middle">WARNING</text><text x="1160" y="320" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">부저 삑삑 · LED ON</text><ellipse cx="960" cy="560" rx="110" ry="54" fill="white" stroke="#7a7f88" stroke-width="3"/><text x="960" y="556" font-size="17" font-weight="bold" fill="#7a7f88" text-anchor="middle">SENSOR_ERROR</text><text x="960" y="580" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">부저 OFF · LED 깜빡</text><path d="M860.0 275.0 L1055.0 275.0" stroke="#c62828" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1055.0 275.0 L1043.9 279.7 L1043.9 270.3 Z" fill="#c62828"/><text x="958" y="262" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">평균 T≥30 또는 H≥75</text><path d="M1055.0 325.0 L860.0 325.0" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M860.0 325.0 L871.1 320.3 L871.1 329.7 Z" fill="#208657"/><text x="958" y="350" font-size="13" font-weight="bold" fill="#208657" text-anchor="middle">평균 T≤28 그리고 H≤70</text><path d="M800.0 350.0 L900.0 512.0" stroke="#7a7f88" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M900.0 512.0 L890.2 505.0 L898.2 500.1 Z" fill="#7a7f88"/><path d="M1120.0 350.0 L1020.0 512.0" stroke="#7a7f88" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1020.0 512.0 L1021.8 500.1 L1029.8 505.0 Z" fill="#7a7f88"/><text x="760" y="440" font-size="13" font-weight="bold" fill="#7a7f88" text-anchor="end">연속 실패 3회</text><text x="1160" y="440" font-size="13" font-weight="bold" fill="#7a7f88" text-anchor="start">연속 실패 3회</text><path d="M930.0 507.0 L780.0 356.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M780.0 356.0 L791.1 360.5 L784.5 367.1 Z" fill="#555"/><text x="860" y="470" font-size="12" font-weight="normal" fill="#555" text-anchor="end">정상값 수신</text><text x="580" y="170" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 상태 = '지금 무엇을 해야 하는가'를 한 변수에 담는다</text><text x="580" y="196" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 실패 1~2회는 마지막 상태 유지, 3회 연속이면 오류로 구분</text><text x="580" y="222" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 오류 시 경보음을 끄는 이유: 측정 불가 ≠ 위험 → 별도 표시</text></svg>