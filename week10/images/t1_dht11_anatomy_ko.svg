<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="980" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">DHT11 — 내부 구조와 두 가지 형태(4핀 단품 / 3핀 모듈)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">습도 → 정전용량 변화, 온도 → NTC 저항 변화. 내부 8비트 MCU가 측정·보정 후 40비트 디지털 값으로 보낸다</text><rect x="40" y="110" width="520" height="430" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">① 센서 안쪽에서 일어나는 일</text><rect x="70" y="170" width="200" height="70" rx="8" fill="#f4f8fd" stroke="#2664bf" stroke-width="2"/><text x="170.0" y="196" font-size="15" font-weight="bold" fill="#2664bf" text-anchor="middle">습도 감지 소자</text><text x="170.0" y="218" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">고분자 흡습 → 용량 C 변화</text><rect x="70" y="270" width="200" height="70" rx="8" fill="#f4f8fd" stroke="#e07b16" stroke-width="2"/><text x="170.0" y="296" font-size="15" font-weight="bold" fill="#e07b16" text-anchor="middle">NTC 서미스터</text><text x="170.0" y="318" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">온도↑ → 저항 R↓</text><rect x="330" y="200" width="200" height="110" rx="8" fill="#f4f8fd" stroke="#7b4bb3" stroke-width="2"/><text x="430.0" y="226" font-size="15" font-weight="bold" fill="#7b4bb3" text-anchor="middle">8비트 MCU</text><text x="430.0" y="248" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">ADC 변환 · 보정계수(OTP)</text><text x="430" y="290" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">· 40비트 프레임 생성</text><path d="M270.0 205.0 L328.0 235.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M328.0 235.0 L316.0 234.1 L320.3 225.8 Z" fill="#2664bf"/><path d="M270.0 305.0 L328.0 280.0" stroke="#e07b16" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M328.0 280.0 L319.7 288.7 L316.0 280.1 Z" fill="#e07b16"/><path d="M430.0 312.0 L430.0 380.0" stroke="#c78a00" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M430.0 380.0 L425.3 368.9 L434.7 368.9 Z" fill="#c78a00"/><rect x="340" y="382" width="180" height="46" rx="8" fill="#fff4d6" stroke="#c78a00" stroke-width="2"/><text x="430" y="411" font-size="15" font-weight="bold" fill="#8a6200" text-anchor="middle">DATA 핀 1개</text><text x="60" y="465" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 측정 시간이 걸리고 자체 가열을 피하려고 1초에 한 번 이하로 읽는다</text><text x="60" y="490" font-size="13" font-weight="normal" fill="#222" text-anchor="start">  → 수업 코드는 2초 간격</text><text x="60" y="518" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 통신 중이 아닐 때 DATA는 풀업 저항 때문에 HIGH(대기)</text><rect x="580" y="110" width="370" height="430" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="600" y="144" font-size="20" font-weight="bold" fill="#1f6aa8" text-anchor="start">② 4핀 단품</text><rect x="710" y="170" width="110" height="140" rx="6" fill="#3d9be0" stroke="#1f6aa8" stroke-width="2"/><rect x="722" y="180" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="745" y="180" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="768" y="180" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="791" y="180" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="722" y="200" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="745" y="200" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="768" y="200" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="791" y="200" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="722" y="220" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="745" y="220" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="768" y="220" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="791" y="220" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="722" y="240" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="745" y="240" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="768" y="240" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="791" y="240" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="722" y="260" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="745" y="260" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="768" y="260" width="16" height="14" rx="2" fill="#d8eefc"/><rect x="791" y="260" width="16" height="14" rx="2" fill="#d8eefc"/><text x="765" y="298" font-size="12" font-weight="bold" fill="white" text-anchor="middle">DHT11 단품(4핀)</text><path d="M729.0 310.0 L729.0 346.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="729" cy="349" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="729" y="368" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">1</text><path d="M753.0 310.0 L753.0 346.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="753" cy="349" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="753" y="368" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">2</text><path d="M777.0 310.0 L777.0 346.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="777" cy="349" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="777" y="368" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">3</text><path d="M801.0 310.0 L801.0 346.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="801" cy="349" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="801" y="368" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">4</text><text x="600" y="410" font-size="15" font-weight="bold" fill="#1f6aa8" text-anchor="start">1 VCC · 2 DATA · 3 NC · 4 GND</text><text x="600" y="440" font-size="13" font-weight="normal" fill="#222" text-anchor="start">격자 면을 앞으로, 다리를 아래로 두고</text><text x="600" y="462" font-size="13" font-weight="normal" fill="#222" text-anchor="start">왼쪽부터 1번</text><text x="600" y="494" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">풀업 저항 없음 → DATA–VCC 사이</text><text x="600" y="516" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">4.7k~10kΩ 직접 연결</text><rect x="970" y="110" width="390" height="430" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="990" y="144" font-size="20" font-weight="bold" fill="#1f6aa8" text-anchor="start">③ 3핀 모듈(PCB)</text><rect x="1100" y="165" width="130" height="170" rx="8" fill="#2a7fc4" stroke="#14507e" stroke-width="2"/><rect x="1118" y="177" width="94" height="86" rx="6" fill="#3d9be0" stroke="#1f6aa8" stroke-width="2"/><rect x="1126" y="184" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1147" y="184" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1168" y="184" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1189" y="184" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1126" y="203" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1147" y="203" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1168" y="203" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1189" y="203" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1126" y="222" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1147" y="222" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1168" y="222" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1189" y="222" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1126" y="241" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1147" y="241" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1168" y="241" width="14" height="13" rx="2" fill="#d8eefc"/><rect x="1189" y="241" width="14" height="13" rx="2" fill="#d8eefc"/><text x="1165" y="281" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DHT11 모듈</text><rect x="1120" y="289" width="30" height="12" rx="2" fill="#222"/><text x="1156" y="300" font-size="10" font-weight="normal" fill="#dce9f7" text-anchor="start">10kΩ 풀업</text><text x="1135" y="325" font-size="14" font-weight="bold" fill="white" text-anchor="middle">S</text><path d="M1135.0 335.0 L1135.0 361.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1135" cy="364" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="1165" y="325" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+</text><path d="M1165.0 335.0 L1165.0 361.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1165" cy="364" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="1195" y="325" font-size="14" font-weight="bold" fill="white" text-anchor="middle">−</text><path d="M1195.0 335.0 L1195.0 361.0" stroke="#a9a9a9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1195" cy="364" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="990" y="410" font-size="13" font-weight="normal" fill="#222" text-anchor="start">풀업 저항·(전원 LED)이 기판에 있음</text><text x="990" y="438" font-size="13" font-weight="bold" fill="#222" text-anchor="start">핀 표기 예: S·+·− / +·OUT·− / VCC·DAT·GND</text><text x="990" y="466" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">→ 제조사마다 순서가 다르다!</text><text x="990" y="494" font-size="13" font-weight="normal" fill="#222" text-anchor="start">사진 모양이 아니라 기판의 글자를</text><text x="990" y="516" font-size="13" font-weight="normal" fill="#222" text-anchor="start">보고 연결한다</text><text x="40" y="586" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">④ DHT11 vs DHT22 — Wokwi에는 DHT22만 있어 대체로 사용(프로토콜은 같고 숫자 해석만 다름)</text><rect x="40" y="600" width="1320" height="340" rx="8" fill="white" stroke="#9aa3ad" stroke-width="1.5"/><rect x="40" y="600" width="1320" height="34" rx="8" fill="#e8edf3"/><text x="52" y="623" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">항목</text><text x="352" y="623" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">DHT11 (실물 실습)</text><text x="832" y="623" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">DHT22 = AM2302 (Wokwi 실습)</text><path d="M40.0 634.0 L1360.0 634.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="657" font-size="15" font-weight="bold" fill="#222" text-anchor="start">측정 범위(온도)</text><text x="352" y="657" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0 ~ 50 °C</text><text x="832" y="657" font-size="15" font-weight="normal" fill="#222" text-anchor="start">−40 ~ 80 °C</text><path d="M40.0 668.0 L1360.0 668.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="691" font-size="15" font-weight="bold" fill="#222" text-anchor="start">정확도(온도)</text><text x="352" y="691" font-size="15" font-weight="normal" fill="#222" text-anchor="start">±2 °C</text><text x="832" y="691" font-size="15" font-weight="normal" fill="#222" text-anchor="start">±0.5 °C</text><path d="M40.0 702.0 L1360.0 702.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="725" font-size="15" font-weight="bold" fill="#222" text-anchor="start">측정 범위(습도)</text><text x="352" y="725" font-size="15" font-weight="normal" fill="#222" text-anchor="start">20 ~ 90 %RH</text><text x="832" y="725" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0 ~ 100 %RH</text><path d="M40.0 736.0 L1360.0 736.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="759" font-size="15" font-weight="bold" fill="#222" text-anchor="start">정확도(습도)</text><text x="352" y="759" font-size="15" font-weight="normal" fill="#222" text-anchor="start">±5 %RH</text><text x="832" y="759" font-size="15" font-weight="normal" fill="#222" text-anchor="start">±2 %RH (최대 ±5)</text><path d="M40.0 770.0 L1360.0 770.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="793" font-size="15" font-weight="bold" fill="#222" text-anchor="start">분해능</text><text x="352" y="793" font-size="15" font-weight="normal" fill="#222" text-anchor="start">1 °C · 1 %RH (정수)</text><text x="832" y="793" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0.1 °C · 0.1 %RH</text><path d="M40.0 804.0 L1360.0 804.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="827" font-size="15" font-weight="bold" fill="#222" text-anchor="start">최소 읽기 간격</text><text x="352" y="827" font-size="15" font-weight="normal" fill="#222" text-anchor="start">1 초</text><text x="832" y="827" font-size="15" font-weight="normal" fill="#222" text-anchor="start">2 초</text><path d="M40.0 838.0 L1360.0 838.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="861" font-size="15" font-weight="bold" fill="#222" text-anchor="start">시작 신호(LOW)</text><text x="352" y="861" font-size="15" font-weight="normal" fill="#222" text-anchor="start">≥ 18 ms</text><text x="832" y="861" font-size="15" font-weight="normal" fill="#222" text-anchor="start">≈ 1 ms (1~10 ms)</text><path d="M40.0 872.0 L1360.0 872.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="895" font-size="15" font-weight="bold" fill="#222" text-anchor="start">데이터 형식</text><text x="352" y="895" font-size="15" font-weight="normal" fill="#222" text-anchor="start">정수 8비트 + 소수 8비트</text><text x="832" y="895" font-size="15" font-weight="normal" fill="#222" text-anchor="start">16비트 값 × 0.1, 온도 MSB = 부호</text><path d="M40.0 906.0 L1360.0 906.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="929" font-size="15" font-weight="bold" fill="#222" text-anchor="start">전원 / 통신</text><text x="352" y="929" font-size="15" font-weight="normal" fill="#222" text-anchor="start">3.3~5.5 V / 단일선 40비트</text><text x="832" y="929" font-size="15" font-weight="normal" fill="#222" text-anchor="start">3.3~5.5 V / 단일선 40비트 (같음)</text></svg>