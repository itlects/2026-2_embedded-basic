<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="780" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">부저의 종류와 ESP32 구동 — 능동형 vs 수동형, tone()의 정체</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">이번 실습은 '수동형(passive) 피에조'를 tone()으로 2 kHz 사각파 구동. 큰 전류 부저는 트랜지스터로</text><rect x="40" y="110" width="640" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">① 능동형 vs 수동형</text><text x="70" y="170" font-size="15" font-weight="normal" fill="#222" text-anchor="start">능동형: 내부 발진회로 有 → 전원만 주면 '삐-' 한 음</text><text x="70" y="200" font-size="14" font-weight="normal" fill="#555" text-anchor="start">  digitalWrite(HIGH)로 ON/OFF · 음높이 바꿀 수 없음</text><text x="70" y="240" font-size="15" font-weight="bold" fill="#7b4bb3" text-anchor="start">수동형: 발진회로 無 → 사각파를 넣어야 소리남</text><text x="70" y="270" font-size="14" font-weight="normal" fill="#555" text-anchor="start">  tone(핀, 주파수)로 음높이 조절 · 멜로디 가능</text><text x="70" y="315" font-size="14" font-weight="bold" fill="#222" text-anchor="start">구별법: 3V를 잠깐 연결 → 소리 나면 능동형</text><text x="70" y="343" font-size="13" font-weight="normal" fill="#555" text-anchor="start">(밑면이 막혀 있고 스티커가 있으면 능동형인 경우가 많음)</text><text x="70" y="380" font-size="13" font-weight="normal" fill="#555" text-anchor="start">능동형이면 코드의 tone() 대신 digitalWrite()로 바꿔 사용</text><rect x="700" y="110" width="660" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="720" y="144" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">② tone(25, 2000) 이 만드는 신호</text><path d="M740.0 225.0 L786.0 225.0 L786.0 295.0 L832.0 295.0 L832.0 225.0 L878.0 225.0 L878.0 295.0 L924.0 295.0 L924.0 225.0 L970.0 225.0 L970.0 295.0 L1016.0 295.0 L1016.0 225.0 L1062.0 225.0 L1062.0 295.0 L1108.0 295.0 L1108.0 225.0 L1154.0 225.0 L1154.0 295.0 L1200.0 295.0 L1200.0 225.0 L1246.0 225.0 L1246.0 295.0 L1292.0 295.0" stroke="#7b4bb3" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M786.0 321.0 L740.0 321.0" stroke="#7b4bb3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740.0 321.0 L751.1 316.3 L751.1 325.7 Z" fill="#7b4bb3"/><path d="M786.0 321.0 L832.0 321.0" stroke="#7b4bb3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M832.0 321.0 L820.9 325.7 L820.9 316.3 Z" fill="#7b4bb3"/><text x="786.0" y="315.0" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="middle">주기 T = 1/2000 Hz = 500 µs</text><text x="740" y="211.0" font-size="12" font-weight="normal" fill="#777" text-anchor="start">3.3V</text><text x="740" y="355.0" font-size="13" font-weight="normal" fill="#222" text-anchor="start">듀티 50 % 사각파 · ESP32 LEDC(PWM) 하드웨어가 생성 → CPU는 계속 다른 일</text><text x="740" y="379.0" font-size="13" font-weight="normal" fill="#222" text-anchor="start">noTone(25) → 정지.  millis()로 120ms 켜고 480ms 끄면 '삑…삑…'</text><rect x="40" y="430" width="640" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="464" font-size="20" font-weight="bold" fill="#208657" text-anchor="start">③ GPIO 직결 (이번 실습)</text><rect x="80" y="520" width="120" height="120" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="140" y="550" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><text x="190" y="585" font-size="13" font-weight="bold" fill="white" text-anchor="end">IO25</text><text x="190" y="625" font-size="13" font-weight="bold" fill="white" text-anchor="end">GND</text><path d="M200.0 580.0 L420.0 580.0" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="446" cy="600" r="30" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="446" cy="600" r="5" fill="#555" stroke="none" stroke-width="0"/><text x="427.4" y="597" font-size="15" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><path d="M200.0 620.0 L380.0 620.0 L380.0 650.0 L480.0 650.0 L480.0 620.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="690" font-size="14" font-weight="bold" fill="#208657" text-anchor="start">조건: 3.3V에서 동작하는 소형 피에조(수 mA)</text><text x="80" y="716" font-size="14" font-weight="normal" fill="#222" text-anchor="start">ESP32 GPIO는 핀당 수십 mA 이하 권장 → 저전류만 직결</text><text x="80" y="742" font-size="14" font-weight="normal" fill="#222" text-anchor="start">모듈형(트랜지스터 내장) 부저는 VCC·GND·I/O 3핀으로 연결</text><rect x="700" y="430" width="660" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="720" y="464" font-size="20" font-weight="bold" fill="#e07b16" text-anchor="start">④ 큰 전류 부저(전자기식·5V) → NPN</text><path d="M760.0 600.0 L820.0 600.0" stroke="#7b4bb3" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="760" y="590" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="start">IO25</text><rect x="820.0" y="588" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="865.0" y="606" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">1kΩ</text><path d="M910.0 600.0 L960.0 600.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="985" cy="600" r="30" fill="none" stroke="#333" stroke-width="2.5"/><path d="M965.0 580.0 L965.0 620.0" stroke="#333" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M965.0 590.0 L1000.0 570.0 L1000.0 540.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M965.0 610.0 L1000.0 630.0 L1000.0 680.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M982.0 620.0 L998.0 629.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M998.0 629.0 L986.1 627.7 L990.7 619.5 Z" fill="#333"/><text x="1015" y="610" font-size="13" font-weight="bold" fill="#222" text-anchor="start">NPN (2N2222·S8050)</text><path d="M1000.0 680.0 L1000.0 690.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M986.0 690.0 L1014.0 690.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M991.0 696.0 L1009.0 696.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M996.0 702.0 L1004.0 702.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="975" y="490" width="50" height="50" rx="25" fill="#2b2b2b" stroke="#000" stroke-width="2"/><text x="1000" y="520" font-size="12" font-weight="bold" fill="white" text-anchor="middle">BZ</text><path d="M1000.0 476.0 L1000.0 490.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="990" y="488" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="end">5V</text><text x="1060" y="510" font-size="13" font-weight="normal" fill="#222" text-anchor="start">다이오드(1N4148)를 부저와 역병렬로</text><text x="1060" y="532" font-size="13" font-weight="normal" fill="#222" text-anchor="start">→ 코일 역기전력으로부터 보호</text><text x="720" y="742" font-size="14" font-weight="bold" fill="#e07b16" text-anchor="start">GPIO는 베이스 전류(수 mA)만 공급, 부저 전류는 5V에서 직접</text></svg>