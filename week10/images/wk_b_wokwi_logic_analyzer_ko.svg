oke-linecap="round"/><path d="M700.0 300.0 L700.0 240.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="214" font-size="13" font-weight="bold" fill="#9a7400" text-anchor="start">DATA</text><text x="420" y="254" font-size="13" font-weight="bold" fill="#008aa6" text-anchor="start">MARK(비트 판정 순간 토글)</text><rect x="40" y="350" width="1320" height="360" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="384" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">PulseView에서 보이는 모습(예상) — 커서 두 개로 폭을 재고 표에 기록</text><text x="80" y="475" font-size="15" font-weight="bold" fill="#9a7400" text-anchor="start">D0</text><path d="M120.0 440.0 L150.0 440.0 L150.0 500.0 L320.0 500.0 L320.0 440.0 L345.0 440.0 L345.0 500.0 L405.0 500.0 L405.0 440.0 L465.0 440.0" stroke="#d9a400" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M465.0 440.0 L465.0 500.0 L510.0 500.0 L510.0 440.0 L535.0 440.0 L535.0 500.0" stroke="#d9a400" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="522.5" y="432.0" font-size="13" font-weight="bold" fill="#9a7400" text-anchor="middle">0</text><path d="M535.0 440.0 L535.0 500.0 L580.0 500.0 L580.0 440.0 L605.0 440.0 L605.0 500.0" stroke="#d9a400" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="592.5" y="432.0" font-size="13" font-weight="bold" fill="#9a7400" text-anchor="middle">0</text><path d="M605.0 440.0 L605.0 500.0 L650.0 500.0 L650.0 440.0 L712.0 440.0 L712.0 500.0" stroke="#d9a400" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="681.0" y="432.0" font-size="13" font-weight="bold" fill="#9a7400" text-anchor="middle">1</text><path d="M712.0 440.0 L712.0 500.0 L757.0 500.0 L757.0 440.0 L819.0 440.0 L819.0 500.0" stroke="#d9a400" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="