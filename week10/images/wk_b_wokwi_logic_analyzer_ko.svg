ound" stroke-linecap="butt"/><text x="120" y="640" font-size="14" font-weight="normal" fill="#222" text-anchor="start">D1이 바뀌는 순간 = 코드가 HIGH 길이를 다 잰 시점 → 비트 판정이 파형과 맞는지 눈으로 확인</text><text x="120" y="668" font-size="13" font-weight="normal" fill="#c62828" text-anchor="start">※ 시뮬레이터 CPU는 실제보다 느릴 수 있어 시리얼에 찍힌 µs 값과 파형 폭이 수 µs 다를 수 있다 — 파형 값이 기준</text><text x="40" y="746" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">기록표</text><rect x="40" y="760" width="1120" height="204" rx="8" fill="white" stroke="#9aa3ad" stroke-width="1.5"/><rect x="40" y="760" width="1120" height="34" rx="8" fill="#e8edf3"/><text x="52" y="783" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">구간</text><text x="312" y="783" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">데이터시트</text><text x="532" y="783" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">PulseView 측정값</text><text x="852" y="783" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">시리얼 출력값</text><path d="M40.0 794.0 L1160.0 794.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="817" font-size="14" font-weight="bold" fill="#222" text-anchor="start">응답 LOW</text><text x="312" y="817" font-size="14" font-weight="normal" fill="#222" text-anchor="start">80µs</text><text x="532" y="817" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><text x="852" y="817" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><path d="M40.0 828.0 L1160.0 828.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="851" font-size="14" font-weight="bold" fill="#222" text-anchor="start">응답 HIGH</text><text x="312" y="851" font-size="14" font-weight="normal" fill="#222" text-anchor="start">80µs</text><text x="532" y="851" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><text x="852" y="851" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><path d="M40.0 862.0 L1160.0 862.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="885" font-size="14" font-weight="bold" fill="#222" text-anchor="start">비트 0의 HIGH</text><text x="312" y="885" font-size="14" font-weight="normal" fill="#222" text-anchor="start">26~28µs</text><text x="532" y="885" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><text x="852" y="885" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><path d="M40.0 896.0 L1160.0 896.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="919" font-size="14" font-weight="bold" fill="#222" text-anchor="start">비트 1의 HIGH</text><text x="312" y="919" font-size="14" font-weight="normal" fill="#222" text-anchor="start">70µs</text><text x="532" y="919" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><text x="852" y="919" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><path d="M40.0 930.0 L1160.0 930.0" stroke="#d5dae0" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="953" font-size="14" font-weight="bold" fill="#222" text-anchor="start">비트 앞 LOW</text><text x="312" y="953" font-size="14" font-weight="normal" fill="#222" text-anchor="start">50µs</text><text x="532" y="953" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text><text x="852" y="953" font-size="14" font-weight="normal" fill="#222" text-anchor="start"></text></svg>