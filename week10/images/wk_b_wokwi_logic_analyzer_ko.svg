<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="994" viewBox="0 0 1400 994" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="994" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">Wokwi 워크북 B · 로직 분석기로 DHT 타이밍 직접 보기</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">D0 = DATA(IO4), D1 = 판정 표시(IO13). 시뮬레이션 정지 → .vcd 파일 다운로드 → PulseView에서 펄스 폭 측정</text><rect x="60" y="120" width="200" height="200" rx="12" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="160" y="150" font-size="17" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><text x="245" y="185" font-size="14" font-weight="bold" fill="white" text-anchor="end">3V3</text><text x="245" y="225" font-size="14" font-weight="bold" fill="white" text-anchor="end">IO4</text><text x="245" y="265" font-size="14" font-weight="bold" fill="white" text-anchor="end">IO13</text><text x="245" y="305" font-size="14" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="560" y="120" width="170" height="120" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="645" y="170" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">DHT22</text><text x="645" y="194" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">VCC SDA NC GND</text><rect x="900" y="120" width="300" height="200" rx="8" fill="#1c1c1c" stroke="#000" stroke-width="2"/><text x="1050" y="152" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Logic Analyzer (la1)</text><circle cx="930" cy="190" r="7" fill="#d4af37" stroke="none" stroke-width="0"/><text x="930" y="215" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D0</text><circle cx="964" cy="190" r="7" fill="#d4af37" stroke="none" stroke-width="0"/><text x="964" y="215" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D1</text><