<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1400" height="840" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">DHT11 통신 타이밍 — 단일 DATA선으로 '시작 → 응답 → 40비트 → 종료'</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">파란 선 = MCU가 LOW로 당김 · 주황 선 = 센서가 당김 · 회색 = 아무도 안 당김(풀업이 HIGH로 유지). 시간 축은 구간별로 확대</text><rect x="40" y="110" width="1320" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">① 한 번 읽기 전체 흐름 (약 22 ms + 40비트 ≈ 4 ms)</text><path d="M80.0 220.0 L140.0 220.0" stroke="#999" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M140.0 220.0 L140.0 300.0 L380.0 300.0 L380.0 220.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="260" y="324.0" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">MCU: LOW ≥ 18 ms</text><text x="260" y="344.0" font-size="12" font-weight="normal" fill="#2664bf" text-anchor="middle">'측정해 줘' 요청</text><path d="M250.0 290.0 L260.0 308.0" stroke="white" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M254.0 288.0 L262.0 308.0" stroke="#999" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M380.0 220.0 L440.0 220.0" stroke="#999" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="410" y="208.0" font-size="12" font-weight="bold" fill="#777" text-anchor="middle">20~40µs</text><text x="410" y="190.0" font-size="11" font-weight="normal" fill="#777" text-anchor="middle">버스 놓음</text><path d="M440.0 220.0 L440.0 300.0 L540.0 300.0 L540.0 220.0 L640.0 220.0 L640.0 300.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="490" y="324.0" font-size="13" font-weight="bold" fill="#d06a00" text-anchor="middle">LOW 80µs</text><text x="590" y="208.0" font-size="13" font-weight="bold" fill="#d06a00" text-anchor="middle">HIGH 80µs</text><text x="540" y="346.0" font-size="12" font-weight="normal" fill="#d06a00" text-anchor="middle">센서 응답 '준비됨'</text><path d="M640.0 300.0 L700.0 300.0 L700.0 220.0 L734.0 220.0 L734.0 300.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="717.0" y="208.0" font-size="15" font-weight="bold" fill="#d06a00" text-anchor="middle">0</text><path d="M734.0 300.0 L794.0 300.0 L794.0 220.0 L874.0 220.0 L874.0 300.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="834.0" y="208.0" font-size="15" font-weight="bold" fill="#d06a00" text-anchor="middle">1</text><path d="M874.0 300.0 L934.0 300.0 L934.0 220.0 L1014.0 220.0 L1014.0 300.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="974.0" y="208.0" font-size="15" font-weight="bold" fill="#d06a00" text-anchor="middle">1</text><path d="M1014.0 300.0 L1074.0 300.0 L1074.0 220.0 L1108.0 220.0 L1108.0 300.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="1091.0" y="208.0" font-size="15" font-weight="bold" fill="#d06a00" text-anchor="middle">0</text><text x="1138" y="266" font-size="22" font-weight="bold" fill="#d06a00" text-anchor="middle">· · ·</text><path d="M1168.0 300.0 L1228.0 300.0 L1228.0 220.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M1228.0 220.0 L1308.0 220.0" stroke="#999" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="1198" y="324.0" font-size="12" font-weight="bold" fill="#d06a00" text-anchor="middle">종료 50µs</text><text x="840" y="344.0" font-size="12" font-weight="normal" fill="#d06a00" text-anchor="start">40비트(5바이트) 데이터 — 비트마다 LOW 50µs 후 HIGH 길이로 0/1</text><text x="60" y="410" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">코드 대응:  pinMode(OUTPUT) + LOW 20ms → pinMode(INPUT_PULLUP)로 놓기 → 응답 확인 → 40번 반복해 HIGH 길이 측정 (실습 5 / Wokwi B)</text><rect x="40" y="460" width="640" height="350" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="494" font-size="20" font-weight="bold" fill="#d06a00" text-anchor="start">② 비트 0과 1 — HIGH 길이만 다르다</text><path d="M80.0 550.0 L100.0 550.0 L100.0 650.0 L200.0 650.0 L200.0 550.0 L255.0 550.0 L255.0 650.0 L280.0 650.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M150.0 676.0 L100.0 676.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M100.0 676.0 L111.1 671.3 L111.1 680.7 Z" fill="#d06a00"/><path d="M150.0 676.0 L200.0 676.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M200.0 676.0 L188.9 680.7 L188.9 671.3 Z" fill="#d06a00"/><text x="150.0" y="670" font-size="12" font-weight="bold" fill="#d06a00" text-anchor="middle">50µs (시작)</text><path d="M227.5 536.0 L200.0 536.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M200.0 536.0 L211.1 531.3 L211.1 540.7 Z" fill="#d06a00"/><path d="M227.5 536.0 L255.0 536.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M255.0 536.0 L243.9 540.7 L243.9 531.3 Z" fill="#d06a00"/><text x="227.5" y="530" font-size="12" font-weight="bold" fill="#d06a00" text-anchor="middle">26~28µs</text><text x="190" y="710" font-size="18" font-weight="bold" fill="#d06a00" text-anchor="middle">비트 0</text><path d="M360.0 550.0 L380.0 550.0 L380.0 650.0 L480.0 650.0 L480.0 550.0 L620.0 550.0 L620.0 650.0 L650.0 650.0" stroke="#d06a00" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M430.0 676.0 L380.0 676.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M380.0 676.0 L391.1 671.3 L391.1 680.7 Z" fill="#d06a00"/><path d="M430.0 676.0 L480.0 676.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M480.0 676.0 L468.9 680.7 L468.9 671.3 Z" fill="#d06a00"/><text x="430.0" y="670" font-size="12" font-weight="bold" fill="#d06a00" text-anchor="middle">50µs (시작)</text><path d="M550.0 536.0 L480.0 536.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M480.0 536.0 L491.1 531.3 L491.1 540.7 Z" fill="#d06a00"/><path d="M550.0 536.0 L620.0 536.0" stroke="#d06a00" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M620.0 536.0 L608.9 540.7 L608.9 531.3 Z" fill="#d06a00"/><text x="550.0" y="530" font-size="12" font-weight="bold" fill="#d06a00" text-anchor="middle">≈ 70µs</text><text x="510" y="710" font-size="18" font-weight="bold" fill="#d06a00" text-anchor="middle">비트 1</text><path d="M576.0 520.0 L576.0 660.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="60" y="755" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">판정: HIGH &gt; 약 48µs 이면 1 (0과 1의 중간값). 비트는 MSB부터 도착한다.</text><rect x="700" y="460" width="660" height="350" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="720" y="494" font-size="20" font-weight="bold" fill="#555" text-anchor="start">③ 왜 풀업 저항이 필요한가 — 한 선을 둘이 함께 쓰는 법</text><path d="M1030.0 520.0 L1030.0 545.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1040" y="528" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="start">3.3V</text><rect x="1019" y="545" width="22" height="60" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="1050" y="582" font-size="13" font-weight="bold" fill="#8a5818" text-anchor="start">10kΩ</text><path d="M1030.0 605.0 L1030.0 640.0" stroke="#c78a00" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1030" cy="640" r="6" fill="#c78a00" stroke="white" stroke-width="1.5"/><path d="M800.0 640.0 L1320.0 640.0" stroke="#c78a00" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1060" y="632" font-size="13" font-weight="bold" fill="#8a6200" text-anchor="start">DATA</text><path d="M870.0 640.0 L870.0 670.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="830" y="670" width="80" height="46" rx="6" fill="#f4f8fd" stroke="#2664bf" stroke-width="2"/><text x="870" y="699" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">스위치</text><path d="M870.0 716.0 L870.0 736.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M870.0 736.0 L870.0 746.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M856.0 746.0 L884.0 746.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M861.0 752.0 L879.0 752.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M866.0 758.0 L874.0 758.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="870" y="634" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">MCU(IO4)</text><path d="M1230.0 640.0 L1230.0 670.0" stroke="#d06a00" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="1190" y="670" width="80" height="46" rx="6" fill="#f4f8fd" stroke="#d06a00" stroke-width="2"/><text x="1230" y="699" font-size="13" font-weight="bold" fill="#d06a00" text-anchor="middle">스위치</text><path d="M1230.0 716.0 L1230.0 736.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1230.0 736.0 L1230.0 746.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1216.0 746.0 L1244.0 746.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1221.0 752.0 L1239.0 752.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1226.0 758.0 L1234.0 758.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1230" y="634" font-size="14" font-weight="bold" fill="#d06a00" text-anchor="middle">DHT11</text><text x="720" y="770" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 누구든 스위치를 닫으면 LOW, 아무도 안 닫으면 풀업이 HIGH → 충돌 없이 번갈아 말하기</text><text x="720" y="786" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">• 풀업이 없으면 '떠 있는(floating)' 선 → 응답 없음·NaN·체크섬 오류</text></svg>