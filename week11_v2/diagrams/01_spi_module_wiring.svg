<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="45" y="58" font-family="Arial" font-weight="bold" font-size="31" fill="#142638">ESP32-S3 N16R8 — external SPI microSD</text><text x="45" y="90" font-family="Arial" font-size="18" fill="#42546a">GPIO pin numbers (not physical header indices). 3.3V-compatible module only.</text><rect x="60" y="135" width="380" height="420" rx="24" fill="#213a56"/><rect x="760" y="135" width="395" height="420" rx="24" fill="#e6e0f7" stroke="#62518b" stroke-width="3"/><text x="93" y="178" font-family="Arial" font-size="24" fill="#fff">ESP32-S3-WROOM N16R8</text><text x="786" y="178" font-family="Arial" font-size="23" fill="#4b3475">SPI microSD module</text><text x="93" y="240" font-family="Arial" font-size="22" fill="#fff">3V3</text><text x="785" y="240" font-family="Arial" font-size="22" fill="#493a61">VCC</text><path d="M 400 234 L 750 234" stroke="#e4675d" stroke-width="6" fill="none"/><text x="93" y="292" font-family="Arial" font-size="22" fill="#fff">GND</text><text x="785" y="292" font-family="Arial" font-size="22" fill="#493a61">GND</text><path d="M 400 286 L 750 286" stroke="#323942" stroke-width="6" fill="none"/><text x="93" y="344" font-family="Arial" font-size="22" fill="#fff">GPIO12</text><text x="785" y="344" font-family="Arial" font-size="22" fill="#493a61">SCK / CLK</text><path d="M 400 338 L 750 338" stroke="#ef9e37" stroke-width="6" fill="none"/><text x="93" y="396" font-family="Arial" font-size="22" fill="#fff">GPIO13</text><text x="785" y="396" font-family="Arial" font-size="22" fill="#493a61">MISO / DO</text><path d="M 400 390 L 750 390" stroke="#61a8f2" stroke-width="6" fill="none"/><text x="93" y="448" font-family="Arial" font-size="22" fill="#fff">GPIO11</text><text x="785" y="448" font-family="Arial" font-size="22" fill="#493a61">MOSI / DI</text><path d="M 400 442 L 750 442" stroke="#3cac8e" stroke-width="6" fill="none"/><text x="93" y="500" font-family="Arial" font-size="22" fill="#fff">GPIO10</text><text x="785" y="500" font-family="Arial" font-size="22" fill="#493a61">CS / SS</text><path d="M 400 494 L 750 494" stroke="#a37aec" stroke-width="6" fill="none"/><text x="45" y="595" font-family="Arial" font-size="15" fill="#9b373d">Disconnect power before wiring. Internal FNK0083 SD slot uses SDMMC; this drawing shows EXTERNAL SPI module.</text></svg>