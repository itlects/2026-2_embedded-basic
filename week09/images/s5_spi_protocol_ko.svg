<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="800" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">SPI — 4선 동기식: SCK · MOSI · MISO · CS(장치 선택)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">마스터가 CS를 LOW로 내려 장치를 고르고, SCK 한 번에 1비트씩 동시에 주고받는다(전이중). 주소가 없는 대신 장치마다 CS선이 하나씩.</text><rect x="40" y="110" width="1160" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">① MAX6675 읽기: CS↓ → 16클럭 → MISO로 16비트 → CS↑ (모드 0)</text><path d="M170.0 165.0 L190.0 165.0 L210.0 165.0 L210.0 195.0 L230.0 195.0 L250.0 195.0 L270.0 195.0 L290.0 195.0 L310.0 195.0 L330.0 195.0 L350.0 195.0 L370.0 195.0 L390.0 195.0 L410.0 195.0 L430.0 195.0 L450.0 195.0 L470.0 195.0 L490.0 195.0 L510.0 195.0 L530.0 195.0 L550.0 195.0 L570.0 195.0 L590.0 195.0 L610.0 195.0 L630.0 195.0 L650.0 195.0 L670.0 195.0 L690.0 195.0 L710.0 195.0 L730.0 195.0 L750.0 195.0 L770.0 195.0 L790.0 195.0 L810.0 195.0 L830.0 195.0 L850.0 195.0 L870.0 195.0 L870.0 165.0 L890.0 165.0 L910.0 165.0 L930.0 165.0" stroke="#c62828" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="158" y="185" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">CS</text><path d="M170.0 265.0 L190.0 265.0 L210.0 265.0 L230.0 265.0 L230.0 235.0 L250.0 235.0 L250.0 265.0 L270.0 265.0 L270.0 235.0 L290.0 235.0 L290.0 265.0 L310.0 265.0 L310.0 235.0 L330.0 235.0 L330.0 265.0 L350.0 265.0 L350.0 235.0 L370.0 235.0 L370.0 265.0 L390.0 265.0 L390.0 235.0 L410.0 235.0 L410.0 265.0 L430.0 265.0 L430.0 235.0 L450.0 235.0 L450.0 265.0 L470.0 265.0 L470.0 235.0 L490.0 235.0 L490.0 265.0 L510.0 265.0 L510.0 235.0 L530.0 235.0 L530.0 265.0 L550.0 265.0 L550.0 235.0 L570.0 235.0 L570.0 265.0 L590.0 265.0 L590.0 235.0 L610.0 235.0 L610.0 265.0 L630.0 265.0 L630.0 235.0 L650.0 235.0 L650.0 265.0 L670.0 265.0 L670.0 235.0 L690.0 235.0 L690.0 265.0 L710.0 265.0 L710.0 235.0 L730.0 235.0 L730.0 265.0 L750.0 265.0 L750.0 235.0 L770.0 235.0 L770.0 265.0 L790.0 265.0 L790.0 235.0 L810.0 235.0 L810.0 265.0 L830.0 265.0 L830.0 235.0 L850.0 235.0 L850.0 265.0 L870.0 265.0 L890.0 265.0 L910.0 265.0 L930.0 265.0" stroke="#555" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="158" y="255" font-size="15" font-weight="bold" fill="#555" text-anchor="end">SCK</text><path d="M170.0 305.0 L190.0 305.0 L210.0 305.0 L210.0 335.0 L230.0 335.0 L250.0 335.0 L270.0 335.0 L290.0 335.0 L310.0 335.0 L330.0 335.0 L350.0 335.0 L370.0 335.0 L390.0 335.0 L390.0 305.0 L410.0 305.0 L430.0 305.0 L450.0 305.0 L470.0 305.0 L470.0 335.0 L490.0 335.0 L510.0 335.0 L530.0 335.0 L550.0 335.0 L550.0 305.0 L570.0 305.0 L590.0 305.0 L590.0 335.0 L610.0 335.0 L630.0 335.0 L650.0 335.0 L670.0 335.0 L690.0 335.0 L710.0 335.0 L730.0 335.0 L750.0 335.0 L770.0 335.0 L790.0 335.0 L810.0 335.0 L830.0 335.0 L850.0 335.0 L870.0 335.0 L870.0 305.0 L890.0 305.0 L910.0 305.0 L930.0 305.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="158" y="325" font-size="15" font-weight="bold" fill="#c06000" text-anchor="end">MISO</text><path d="M170.0 380.0 L930.0 380.0" stroke="#bbb" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="158" y="385" font-size="15" font-weight="bold" fill="#999" text-anchor="end">MOSI</text><text x="530" y="404" font-size="12" font-weight="normal" fill="#999" text-anchor="middle">MAX6675는 MOSI 없음(읽기 전용)</text><text x="250" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">15</text><text x="290" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">14</text><text x="330" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">13</text><text x="370" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">12</text><text x="410" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">11</text><text x="450" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">10</text><text x="490" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">9</text><text x="530" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">8</text><text x="570" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">7</text><text x="610" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">6</text><text x="650" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">5</text><text x="690" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">4</text><text x="730" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">3</text><text x="770" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">2</text><text x="810" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">1</text><text x="850" y="352" font-size="10" font-weight="normal" fill="#888" text-anchor="middle">0</text><text x="960" y="300" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">예: 0x0C80 → (0x0C80 &gt;&gt; 3) × 0.25</text><text x="960" y="324" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">= 400 × 0.25 = 100.00 °C</text><text x="960" y="352" font-size="13" font-weight="normal" fill="#555" text-anchor="start">bit2 = 1 이면 열전대 끊김</text><text x="960" y="180" font-size="13" font-weight="normal" fill="#c62828" text-anchor="start">CS LOW 동안만 통신</text><text x="960" y="250" font-size="13" font-weight="normal" fill="#555" text-anchor="start">SCK 상승 에지에서 읽음</text><rect x="40" y="460" width="580" height="310" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="494" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">② 연결 (장치가 여러 개면 CS만 추가)</text><rect x="70" y="530" width="130" height="230" rx="10" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="135" y="558" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><text x="192" y="595" font-size="13" font-weight="bold" fill="white" text-anchor="end">SCK 18</text><path d="M200.0 590.0 L560.0 590.0" stroke="#555" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="192" y="630" font-size="13" font-weight="bold" fill="white" text-anchor="end">MISO 19</text><path d="M200.0 625.0 L560.0 625.0" stroke="#c06000" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="192" y="665" font-size="13" font-weight="bold" fill="white" text-anchor="end">MOSI 23</text><path d="M200.0 660.0 L560.0 660.0" stroke="#999" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="192" y="700" font-size="13" font-weight="bold" fill="white" text-anchor="end">CS 4</text><path d="M200.0 695.0 L420.0 695.0" stroke="#c62828" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="330" y="712" width="110" height="46" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="385" y="741" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">MAX6675</text><path d="M350.0 590.0 L350.0 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M367.5 625.0 L367.5 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M385.0 660.0 L385.0 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="480" y="712" width="110" height="46" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="535" y="741" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">SD카드</text><path d="M500.0 590.0 L500.0 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M517.5 625.0 L517.5 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M535.0 660.0 L535.0 712.0" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M420.0 695.0 L420.0 712.0" stroke="#c62828" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M200.0 735.0 L230.0 735.0 L230.0 766.0 L535.0 766.0 L535.0 758.0" stroke="#e57373" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="192" y="740" font-size="12" font-weight="bold" fill="white" text-anchor="end">CS2 (예 15)</text><rect x="640" y="460" width="560" height="310" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="660" y="494" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">③ 기억할 점</text><text x="660" y="518" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 가장 빠름: 수 MHz~수십 MHz (I2C의 10배 이상)</text><text x="660" y="548" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 주소 없음 → 장치 수만큼 CS선 필요</text><text x="660" y="578" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 모드 0~3 = 클럭 극성(CPOL)·위상(CPHA) 조합</text><text x="660" y="608" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  → 데이터시트 모드와 SPISettings를 맞춘다</text><text x="660" y="638" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• MOSI=Master Out, MISO=Master In (COPI/CIPO)</text><text x="660" y="668" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• ESP32 VSPI 기본: SCK18 MISO19 MOSI23 SS5</text><text x="660" y="698" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  (GPIO5는 부팅 스트랩 → 9주차 CS는 GPIO4)</text><text x="660" y="728" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• SPI.beginTransaction → CS LOW → transfer → CS HIGH</text></svg>