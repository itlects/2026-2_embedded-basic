x="130" y="590" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><text x="180" y="640" font-size="13" font-weight="bold" fill="white" text-anchor="end">SDA 21</text><text x="180" y="680" font-size="13" font-weight="bold" fill="white" text-anchor="end">SCL 22</text><path d="M190.0 635.0 L700.0 635.0" stroke="#208657" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M190.0 675.0 L700.0 675.0" stroke="#555" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 548.0 L250.0 558.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="240" y="558" width="20" height="56" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><path d="M250.0 614.0 L250.0 635.0" stroke="#208657" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="250" cy="635" r="5" fill="#208657" stroke="none" stroke-width="0"/><path d="M310.0 548.0 L310.0 558.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="300" y="558" width="20" height="56" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><path d="M310.0 614.0 L310.0 675.0" stroke="#555" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="310" cy="675" r="5" fill="#555" stroke="none" stroke-width="0"/><path d="M240.0 548.0 L320.0 548.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="553" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><text x="330" y="595" font-size="13" font-weight="bold" fill="#8a5818" text-anchor="start">풀업 4.7kΩ × 2</text><path d="M420.0 635.0 L420.0 715.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M460.0 675.0 L460.0 715.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="400" y="715" width="85" height="50" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="442" y="737" font-size="13" font-weight="bold" fill="#208657" text-anchor="middle">BH1750</text><text x="442" y="755" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">0x23</text><path d="M530.0 635.0 L530.0 715.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M570.0 675.0 L570.0 715.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="510" y="715" width="85" height="50" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="552" y="737" font-size="13" font-weight="bold" fill="#208657" text-anchor="middle">BMP280</text><text x="552" y="755" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">0x76</text><path d="M640.0 635.0 L640.0 715.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M680.0 675.0 L680.0 715.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="620" y="715" width="85" height="50" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="662" y="737" font-size="13" font-weight="bold" fill="#208657" text-anchor="middle">OLED</text><text x="662" y="755" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">0x3C</text><text x="60" y="785" font-size="12" font-weight="normal" fill="#555" text-anchor="start">모듈 대부분은 풀업이 내장 → 여러 개를 꽂으면 병렬로 너무 강해질 수 있음</text><rect x="760" y="470" width="440" height="320" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="780" y="504" font-size="20" font-weight="bold" fill="#208657" text-anchor="start">③ 기억할 점</text><text x="785" y="528" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 주소 = 7비트(0x08~0x77)</text><text x="785" y="557" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 같은 주소 2개는 충돌 → ADDR 핀으로 변경</text><text x="785" y="586" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 속도 100kHz(표준), 400kHz(고속)</text><text x="785" y="615" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 짧은 거리(보드 위·수십 cm)</text><text x="785" y="644" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 3.3V 버스에 5V 풀업 모듈 주의</text><text x="785" y="673" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 장치 확인: I2C 스캐너(예제 6B)</text><text x="785" y="702" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• Wire.beginTransmission → write</text><text x="785" y="731" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  → endTransmission (0이면 ACK)</text><text x="785" y="760" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• Wire.requestFrom(주소, 바이트수)</text></svg>