<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="820" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">UART — 비동기 시리얼: 프레임(8N1)과 TX↔RX 교차 연결</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">클럭선이 없으므로 양쪽이 같은 속도(baud)를 쓰기로 약속한다. 쉬는 상태는 HIGH, START 비트(LOW)로 시작을 알린다.</text><rect x="40" y="110" width="1160" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">① 'A'(0x41 = 0100 0001) 전송 — 8N1, LSB 먼저</text><path d="M90.0 220.0 L170.0 220.0 L250.0 220.0 L250.0 300.0 L330.0 300.0 L330.0 220.0 L410.0 220.0 L410.0 300.0 L490.0 300.0 L570.0 300.0 L650.0 300.0 L730.0 300.0 L810.0 300.0 L810.0 220.0 L890.0 220.0 L890.0 300.0 L970.0 300.0 L970.0 220.0 L1050.0 220.0 L1130.0 220.0 L1210.0 220.0" stroke="#2664bf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="130.0" y="205" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">대기</text><text x="290.0" y="205" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">START</text><text x="370.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D0</text><text x="370.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">1</text><text x="450.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D1</text><text x="450.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="530.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D2</text><text x="530.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="610.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D3</text><text x="610.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="690.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D4</text><text x="690.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="770.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D5</text><text x="770.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="850.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D6</text><text x="850.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">1</text><text x="930.0" y="205" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">D7</text><text x="930.0" y="330" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">0</text><text x="1010.0" y="205" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">STOP</text><text x="1090.0" y="205" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">대기</text><path d="M250.0 190.0 L250.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M330.0 190.0 L330.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M410.0 190.0 L410.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M490.0 190.0 L490.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M570.0 190.0 L570.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M650.0 190.0 L650.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M730.0 190.0 L730.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M810.0 190.0 L810.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M890.0 190.0 L890.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M970.0 190.0 L970.0 340.0" stroke="#ccc" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><text x="60" y="225" font-size="12" font-weight="normal" fill="#888" text-anchor="start">HIGH</text><text x="60" y="305" font-size="12" font-weight="normal" fill="#888" text-anchor="start">LOW</text><path d="M250.0 360.0 L330.0 360.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M330.0 360.0 L318.9 364.7 L318.9 355.3 Z" fill="#333"/><path d="M330.0 360.0 L250.0 360.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 360.0 L261.1 355.3 L261.1 364.7 Z" fill="#333"/><text x="290.0" y="385" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">1비트 = 1/baud</text><text x="560" y="385" font-size="14" font-weight="normal" fill="#333" text-anchor="start">프레임 10비트 → 115200bps면 초당 약 11,520문자</text><text x="560" y="412" font-size="14" font-weight="normal" fill="#333" text-anchor="start">패리티(선택): 1의 개수로 오류 검출.  8N1 = 데이터 8, 패리티 None, 정지 1</text><rect x="40" y="460" width="560" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="494" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">② 연결: TX → 상대 RX (교차), GND 공통</text><rect x="70" y="540" width="140" height="150" rx="10" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="140" y="570" font-size="16" font-weight="bold" fill="white" text-anchor="middle">장치 A</text><text x="195" y="610" font-size="15" font-weight="bold" fill="white" text-anchor="end">TX</text><text x="195" y="642" font-size="15" font-weight="bold" fill="white" text-anchor="end">RX</text><text x="195" y="674" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="430" y="540" width="140" height="150" rx="10" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="500" y="570" font-size="16" font-weight="bold" fill="white" text-anchor="middle">장치 B</text><text x="445" y="610" font-size="15" font-weight="bold" fill="white" text-anchor="start">TX</text><text x="445" y="642" font-size="15" font-weight="bold" fill="white" text-anchor="start">RX</text><text x="445" y="674" font-size="15" font-weight="bold" fill="white" text-anchor="start">GND</text><path d="M210.0 605.0 L300.0 605.0 L340.0 637.0 L430.0 637.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M210.0 637.0 L300.0 637.0 L340.0 605.0 L430.0 605.0" stroke="#208657" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M210.0 669.0 L430.0 669.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="320" y="595" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">A.TX → B.RX</text><text x="320" y="660" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">GND ─ GND</text><text x="320" y="740" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">A.TX→B.RX, A.RX←B.TX (같은 이름끼리 연결하면 안 됨)</text><text x="320" y="764" font-size="13" font-weight="normal" fill="#555" text-anchor="middle">전압 레벨: ESP32 3.3V, UNO 5V, RS-232 ±12V — 직결 금지</text><rect x="620" y="460" width="580" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="640" y="494" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">③ 시리얼 모니터의 실제 경로</text><rect x="640" y="530" width="98" height="70" rx="8" fill="#fff" stroke="#555" stroke-width="2.5"/><text x="689" y="570" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">PC 앱</text><path d="M740.0 565.0 L754.0 565.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M754.0 565.0 L742.9 569.7 L742.9 560.3 Z" fill="#333"/><rect x="754" y="530" width="98" height="70" rx="8" fill="#fff" stroke="#555" stroke-width="2.5"/><text x="803" y="570" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">USB</text><path d="M854.0 565.0 L868.0 565.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M868.0 565.0 L856.9 569.7 L856.9 560.3 Z" fill="#333"/><rect x="868" y="530" width="98" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="917" y="556" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">USB-UART</text><text x="917" y="576" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">브리지</text><path d="M968.0 565.0 L982.0 565.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M982.0 565.0 L970.9 569.7 L970.9 560.3 Z" fill="#333"/><rect x="982" y="530" width="98" height="70" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2.5"/><text x="1031" y="556" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">UART0</text><text x="1031" y="576" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">TX/RX</text><path d="M1082.0 565.0 L1096.0 565.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1096.0 565.0 L1084.9 569.7 L1084.9 560.3 Z" fill="#333"/><rect x="1096" y="530" width="98" height="70" rx="8" fill="#fff" stroke="#2f6aa8" stroke-width="2.5"/><text x="1145" y="570" font-size="14" font-weight="bold" fill="#2f6aa8" text-anchor="middle">ESP32</text><text x="645" y="640" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• Serial.print() = UART0 송신 → PC 화면</text><text x="645" y="668" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• PC 입력창 Enter = UART0 수신 → Serial.read()</text><text x="645" y="696" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• ESP32: UART0(USB), UART1, UART2(GPIO16/17) 3개</text><text x="645" y="724" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• UNO: UART 1개(D0/D1) → USB와 공용, 꽂으면 업로드 방해</text><text x="645" y="752" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 줄 끝 설정(Newline)이 '명령 한 줄'의 끝 표시가 된다</text></svg>