<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="560" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 5B · ESP32 UART2 루프백 — TX2(GPIO17) ↔ RX2(GPIO16) 점퍼 1개</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">PC에서 쓴 글자가 UART0 → 코드 → UART2 TX → 점퍼 → UART2 RX → UART0 → PC로 되돌아온다. 점퍼를 빼면 돌아오지 않는다.</text><rect x="80" y="120" width="280" height="290" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="220.0" y="152" font-size="19" font-weight="bold" fill="white" text-anchor="middle">ESP32-DevKitC V4</text><rect x="338" y="202" width="16" height="16" rx="2" fill="#111"/><text x="330" y="215" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO17 TX2</text><rect x="338" y="262" width="16" height="16" rx="2" fill="#111"/><text x="330" y="275" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO16 RX2</text><rect x="338" y="342" width="16" height="16" rx="2" fill="#111"/><text x="330" y="355" font-size="15" font-weight="bold" fill="white" text-anchor="end">TX0/RX0 (USB)</text><path d="M354.0 210.0 L520.0 210.0 L520.0 270.0 L354.0 270.0" stroke="#e07b16" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="535" y="245.0" font-size="15" font-weight="bold" fill="#e07b16" text-anchor="start">점퍼선(M-F 2개 또는 F-F 1개)</text><path d="M354.0 350.0 L470.0 350.0" stroke="#555" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="355" font-size="14" font-weight="normal" fill="#555" text-anchor="start">USB → PC 시리얼 모니터</text><rect x="60" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="105.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">키보드 'A'</text><path d="M152.0 442.0 L164.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M164.0 442.0 L152.9 446.7 L152.9 437.3 Z" fill="#333"/><rect x="166" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="211.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">UART0 RX</text><path d="M258.0 442.0 L270.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M270.0 442.0 L258.9 446.7 L258.9 437.3 Z" fill="#333"/><rect x="272" y="420" width="143" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="343.5" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">Serial2.write</text><path d="M417.0 442.0 L429.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M429.0 442.0 L417.9 446.7 L417.9 437.3 Z" fill="#333"/><rect x="431" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="476.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">TX2 17</text><path d="M523.0 442.0 L535.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M535.0 442.0 L523.9 446.7 L523.9 437.3 Z" fill="#333"/><rect x="537" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#e07b16" stroke-width="2"/><text x="582.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">점퍼</text><path d="M629.0 442.0 L641.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M641.0 442.0 L629.9 446.7 L629.9 437.3 Z" fill="#333"/><rect x="643" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="688.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">RX2 16</text><path d="M735.0 442.0 L747.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M747.0 442.0 L735.9 446.7 L735.9 437.3 Z" fill="#333"/><rect x="749" y="420" width="132" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="815.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">Serial2.read</text><path d="M883.0 442.0 L895.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M895.0 442.0 L883.9 446.7 L883.9 437.3 Z" fill="#333"/><rect x="897" y="420" width="90" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="942.0" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">UART0 TX</text><path d="M989.0 442.0 L1001.0 442.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1001.0 442.0 L989.9 446.7 L989.9 437.3 Z" fill="#333"/><rect x="1003" y="420" width="209" height="44" rx="8" fill="#fff" stroke="#2664bf" stroke-width="2"/><text x="1107.5" y="447" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">[UART2 RX] 0x41 'A'</text><text x="60" y="510" font-size="14" font-weight="normal" fill="#333" text-anchor="start">실험: '#'을 보내 UART2 baud를 9600 ↔ 115200으로 바꿔도 송·수신이 같은 UART2라 그대로 맞는다. 양쪽 baud가 다르면 글자가 깨진다(토론).</text></svg>