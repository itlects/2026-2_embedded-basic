<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="750" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">UART · I2C · SPI · 1-Wire 비교</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">같은 '시리얼'이지만 선 개수, 클럭, 주소 방식, 속도가 다르다. 센서 데이터시트의 인터페이스 항목을 보고 고른다.</text><rect x="40" y="120" width="146" height="40" rx="6" fill="#eef2f7" stroke="none" stroke-width="0"/><text x="113.0" y="147" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="middle">항목</text><rect x="190" y="120" width="251" height="40" rx="6" fill="#2664bf" stroke="none" stroke-width="0"/><text x="315.5" y="147" font-size="17" font-weight="bold" fill="white" text-anchor="middle">UART</text><rect x="445" y="120" width="251" height="40" rx="6" fill="#208657" stroke="none" stroke-width="0"/><text x="570.5" y="147" font-size="17" font-weight="bold" fill="white" text-anchor="middle">I2C (TWI)</text><rect x="700" y="120" width="251" height="40" rx="6" fill="#c06000" stroke="none" stroke-width="0"/><text x="825.5" y="147" font-size="17" font-weight="bold" fill="white" text-anchor="middle">SPI</text><rect x="955" y="120" width="241" height="40" rx="6" fill="#7b4bb3" stroke="none" stroke-width="0"/><text x="1075.5" y="147" font-size="17" font-weight="bold" fill="white" text-anchor="middle">1-Wire</text><rect x="40" y="166" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="192" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">신호선</text><text x="200" y="192" font-size="14" font-weight="normal" fill="#222" text-anchor="start">TX, RX (+GND)</text><text x="455" y="192" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SDA, SCL (+GND)</text><text x="710" y="192" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SCK, MOSI, MISO, CS (+GND)</text><text x="965" y="192" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DQ 1개 (+GND)</text><rect x="40" y="210" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="236" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">클럭</text><text x="200" y="236" font-size="14" font-weight="normal" fill="#222" text-anchor="start">없음(비동기, baud 약속)</text><text x="455" y="236" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SCL (마스터 생성)</text><text x="710" y="236" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SCK (마스터 생성)</text><text x="965" y="236" font-size="14" font-weight="normal" fill="#222" text-anchor="start">없음(시간 슬롯)</text><rect x="40" y="254" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="280" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">방향</text><text x="200" y="280" font-size="14" font-weight="normal" fill="#222" text-anchor="start">전이중</text><text x="455" y="280" font-size="14" font-weight="normal" fill="#222" text-anchor="start">반이중</text><text x="710" y="280" font-size="14" font-weight="normal" fill="#222" text-anchor="start">전이중</text><text x="965" y="280" font-size="14" font-weight="normal" fill="#222" text-anchor="start">반이중</text><rect x="40" y="298" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="324" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">장치 선택</text><text x="200" y="324" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1:1 연결</text><text x="455" y="324" font-size="14" font-weight="normal" fill="#222" text-anchor="start">7비트 주소</text><text x="710" y="324" font-size="14" font-weight="normal" fill="#222" text-anchor="start">장치마다 CS선</text><text x="965" y="324" font-size="14" font-weight="normal" fill="#222" text-anchor="start">64비트 ROM ID</text><rect x="40" y="342" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="368" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">일반 속도</text><text x="200" y="368" font-size="14" font-weight="normal" fill="#222" text-anchor="start">9600~115200bps(~Mbps)</text><text x="455" y="368" font-size="14" font-weight="normal" fill="#222" text-anchor="start">100k / 400kHz</text><text x="710" y="368" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1~수십 MHz</text><text x="965" y="368" font-size="14" font-weight="normal" fill="#222" text-anchor="start">약 15.4kbps</text><rect x="40" y="386" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="412" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">풀업 저항</text><text x="200" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">불필요</text><text x="455" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">필요(SDA·SCL, 4.7k)</text><text x="710" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">불필요</text><text x="965" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">필요(DQ, 4.7k)</text><rect x="40" y="430" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="456" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">ESP32 핀</text><text x="200" y="456" font-size="14" font-weight="normal" fill="#222" text-anchor="start">UART0 1/3(USB), UART2 16/17</text><text x="455" y="456" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SDA21 · SCL22</text><text x="710" y="456" font-size="14" font-weight="normal" fill="#222" text-anchor="start">SCK18·MISO19·MOSI23·CS4</text><text x="965" y="456" font-size="14" font-weight="normal" fill="#222" text-anchor="start">아무 GPIO (예 13)</text><rect x="40" y="474" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="500" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">UNO 핀</text><text x="200" y="500" font-size="14" font-weight="normal" fill="#222" text-anchor="start">D0/D1(USB 공용)</text><text x="455" y="500" font-size="14" font-weight="normal" fill="#222" text-anchor="start">A4 · A5</text><text x="710" y="500" font-size="14" font-weight="normal" fill="#222" text-anchor="start">D13·D12·D11·CS D10</text><text x="965" y="500" font-size="14" font-weight="normal" fill="#222" text-anchor="start">아무 핀 (예 D2)</text><rect x="40" y="518" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="544" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">장점</text><text x="200" y="544" font-size="14" font-weight="normal" fill="#222" text-anchor="start">간단, PC와 바로 통신</text><text x="455" y="544" font-size="14" font-weight="normal" fill="#222" text-anchor="start">2선에 여러 장치</text><text x="710" y="544" font-size="14" font-weight="normal" fill="#222" text-anchor="start">가장 빠름, 구조 단순</text><text x="965" y="544" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1선, 긴 거리, ID 내장</text><rect x="40" y="562" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="588" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">단점</text><text x="200" y="588" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1:1, 속도 불일치 시 깨짐</text><text x="455" y="588" font-size="14" font-weight="normal" fill="#222" text-anchor="start">느림, 주소 충돌</text><text x="710" y="588" font-size="14" font-weight="normal" fill="#222" text-anchor="start">선 많음, 장치당 CS</text><text x="965" y="588" font-size="14" font-weight="normal" fill="#222" text-anchor="start">느림, 타이밍 엄격</text><rect x="40" y="606" width="1156" height="40" rx="4" fill="#f7f8fa" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="632" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">9주차 예제</text><text x="200" y="632" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="start">시리얼 모니터·릴레이 명령</text><text x="455" y="632" font-size="14" font-weight="bold" fill="#208657" text-anchor="start">BH1750 조도</text><text x="710" y="632" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">MAX6675 열전대</text><text x="965" y="632" font-size="14" font-weight="bold" fill="#7b4bb3" text-anchor="start">DS18B20 온도</text><rect x="40" y="650" width="1156" height="40" rx="4" fill="#ffffff" stroke="#e3e7ee" stroke-width="1"/><text x="50" y="676" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">그 밖의 센서</text><text x="200" y="676" font-size="14" font-weight="normal" fill="#222" text-anchor="start">GPS NEO-6M, PMS7003</text><text x="455" y="676" font-size="14" font-weight="normal" fill="#222" text-anchor="start">BMP280, SHT31, OLED</text><text x="710" y="676" font-size="14" font-weight="normal" fill="#222" text-anchor="start">MFRC522 RFID, SD카드</text><text x="965" y="676" font-size="14" font-weight="normal" fill="#222" text-anchor="start">DS1990 iButton</text><text x="40" y="732" font-size="14" font-weight="bold" fill="#a40000" text-anchor="start">※ DHT11(10주차)은 1-Wire가 아니라 제조사 고유의 단일선 프로토콜이다. '선이 1개'라고 모두 1-Wire는 아니다.</text></svg>