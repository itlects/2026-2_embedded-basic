<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="640" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">선택 · 수동 부저 NPN 트랜지스터 구동 회로</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">부저(특히 자석식)가 GPIO 허용 전류보다 많이 먹거나 5V 정격일 때 사용한다. GPIO는 트랜지스터의 베이스만 켠다.</text><rect x="40" y="110" width="700" height="500" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><rect x="80" y="330" width="150" height="60" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="155" y="366" font-size="18" font-weight="bold" fill="white" text-anchor="middle">GPIO27</text><path d="M230.0 360.0 L300.0 360.0" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="305.0" y="348" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="350.0" y="366" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">1kΩ</text><path d="M395.0 360.0 L470.0 360.0" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="510" cy="360" r="40" fill="none" stroke="#222" stroke-width="2.5"/><path d="M470.0 360.0 L500.0 360.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M500.0 334.0 L500.0 386.0" stroke="#222" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M500.0 348.0 L530.0 326.0 L530.0 250.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M500.0 372.0 L530.0 394.0 L530.0 470.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M512.0 381.0 L528.0 393.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M528.0 393.0 L516.4 390.1 L522.0 382.6 Z" fill="#222"/><text x="494" y="326" font-size="14" font-weight="bold" fill="#333" text-anchor="end">B</text><text x="540" y="320" font-size="14" font-weight="bold" fill="#333" text-anchor="start">C</text><text x="540" y="412" font-size="14" font-weight="bold" fill="#333" text-anchor="start">E</text><text x="480" y="430" font-size="14" font-weight="normal" fill="#444" text-anchor="end">NPN (2N2222 · S8050 · BC547 등)</text><circle cx="530" cy="210" r="24" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="530" cy="210" r="5" fill="#555" stroke="none" stroke-width="0"/><text x="515.12" y="207" font-size="15" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><path d="M530.0 186.0 L530.0 150.0 L530.0 140.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="530" y="132" font-size="14" font-weight="bold" fill="#d43b3b" text-anchor="middle">5V 핀(또는 3V3) — 부저 정격 전압</text><path d="M530.0 234.0 L530.0 250.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M530.0 160.0 L610.0 160.0 L610.0 192.0" stroke="#555" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M598 222 L622 222 L610 196 Z" fill="#555"/><path d="M598.0 196.0 L622.0 196.0" stroke="#555" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M610.0 222.0 L610.0 250.0 L530.0 250.0" stroke="#555" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="630" y="205" font-size="13" font-weight="normal" fill="#444" text-anchor="start">1N4148/1N4001</text><text x="630" y="224" font-size="13" font-weight="normal" fill="#444" text-anchor="start">(자석식 부저일 때)</text><path d="M530.0 470.0 L530.0 480.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M516.0 480.0 L544.0 480.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M521.0 486.0 L539.0 486.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M526.0 492.0 L534.0 492.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="490" font-size="14" font-weight="bold" fill="#222" text-anchor="start">공통 GND</text><rect x="770" y="110" width="430" height="500" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="2"/><text x="790" y="150" font-size="17" font-weight="bold" fill="#2664bf" text-anchor="start">동작</text><text x="800" y="178" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• GPIO27 HIGH → 베이스 전류 → C–E 도통</text><text x="800" y="208" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• → 부저에 전류가 흐른다 (트랜지스터가 스위치)</text><text x="790" y="238" font-size="17" font-weight="bold" fill="#2664bf" text-anchor="start">부품</text><text x="800" y="266" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 베이스 저항 1kΩ: GPIO 전류 ≈ (3.3−0.7)/1k ≈ 2.6mA</text><text x="800" y="296" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 다이오드: 코일 역기전력 흡수 (캐소드 띠 → +쪽)</text><text x="790" y="326" font-size="17" font-weight="bold" fill="#2664bf" text-anchor="start">언제</text><text x="800" y="354" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 부저 데이터시트 전류 &gt; 약 10~20mA</text><text x="800" y="384" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 5V 정격 부저 · 자석식(전자기) 부저</text><text x="790" y="414" font-size="17" font-weight="bold" fill="#2664bf" text-anchor="start">주의</text><text x="800" y="442" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 5V를 GPIO에 연결하지 않는다 (부저 쪽만 5V)</text><text x="800" y="472" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• NPN 핀 순서(E-B-C)는 품번마다 다르다 → 데이터시트</text></svg>