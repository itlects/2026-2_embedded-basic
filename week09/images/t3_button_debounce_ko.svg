<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="600" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">버튼 바운싱(채터링)과 millis() 디바운스</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">기계식 접점은 누르는 순간 수 ms 동안 여러 번 붙었다 떨어진다. 코드는 '같은 값이 25ms 이상 유지될 때'만 진짜 변화로 인정한다.</text><text x="40" y="176" font-size="16" font-weight="bold" fill="#c06000" text-anchor="start">원 신호 raw</text><path d="M160.0 130.0 L1180.0 130.0" stroke="#ddd" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M160.0 210.0 L1180.0 210.0" stroke="#ddd" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="135" font-size="12" font-weight="normal" fill="#888" text-anchor="end">HIGH</text><text x="150" y="215" font-size="12" font-weight="normal" fill="#888" text-anchor="end">LOW</text><path d="M160.0 130.0 L300.0 130.0 L300.0 210.0 L312.0 210.0 L312.0 130.0 L322.0 130.0 L322.0 210.0 L340.0 210.0 L340.0 130.0 L348.0 130.0 L348.0 210.0 L372.0 210.0 L372.0 130.0 L380.0 130.0 L380.0 210.0 L700.0 210.0 L700.0 130.0 L712.0 130.0 L712.0 210.0 L722.0 210.0 L722.0 130.0 L734.0 130.0 L734.0 210.0 L742.0 210.0 L742.0 130.0 L1180.0 130.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="40" y="336" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">판정 stable</text><path d="M160.0 290.0 L1180.0 290.0" stroke="#ddd" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M160.0 370.0 L1180.0 370.0" stroke="#ddd" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="295" font-size="12" font-weight="normal" fill="#888" text-anchor="end">HIGH</text><text x="150" y="375" font-size="12" font-weight="normal" fill="#888" text-anchor="end">LOW</text><path d="M160.0 290.0 L480.0 290.0 L480.0 370.0 L842.0 370.0 L842.0 290.0 L1180.0 290.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><rect x="300" y="115" width="80" height="110" rx="0" fill="#ffefe0" stroke="none" stroke-width="0" fill-opacity="0.6"/><rect x="700" y="115" width="42" height="110" rx="0" fill="#ffefe0" stroke="none" stroke-width="0" fill-opacity="0.6"/><text x="340" y="112" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">바운싱 수 ms</text><text x="721" y="112" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">놓을 때도 바운싱</text><path d="M380.0 260.0 L480.0 260.0" stroke="#2664bf" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M480.0 260.0 L468.9 264.7 L468.9 255.3 Z" fill="#2664bf"/><text x="430" y="252" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">마지막 변화 후 25ms</text><path d="M380.0 120.0 L380.0 380.0" stroke="#2664bf" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M480.0 120.0 L480.0 380.0" stroke="#2664bf" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M742.0 260.0 L842.0 260.0" stroke="#2664bf" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M842.0 260.0 L830.9 264.7 L830.9 255.3 Z" fill="#2664bf"/><text x="792" y="252" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">마지막 변화 후 25ms</text><path d="M742.0 120.0 L742.0 380.0" stroke="#2664bf" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M842.0 120.0 L842.0 380.0" stroke="#2664bf" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="480" y="400" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">▲ 눌림 1회 확정 → LED 토글</text><text x="842" y="400" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">▲ 놓임 확정 (동작 없음)</text><rect x="40" y="430" width="1160" height="140" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="2"/><text x="64" y="466" font-size="15" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">if (raw != previousRaw) changedAt = now;           // 값이 바뀔 때마다 타이머 다시 시작</text><text x="64" y="494" font-size="15" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">if (now - changedAt &gt;= 25 &amp;&amp; raw != stable) {     // 25ms 동안 그대로면 확정</text><text x="64" y="522" font-size="15" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">  stable = raw;  if (stable == LOW) { /* 눌림 1회 처리 */ }</text><text x="64" y="550" font-size="15" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">}   previousRaw = raw;</text></svg>