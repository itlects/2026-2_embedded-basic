<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="900" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">PWM 원리 — 켜져 있는 시간의 비율(듀티비)로 밝기 조절</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">PWM은 전압을 낮추는 것이 아니라 0V/3.3V를 빠르게 반복한다. 사람 눈은 평균값을 밝기로 느낀다.  평균 전압 ≈ 3.3V × 듀티비</text><text x="40" y="158" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">듀티 0%</text><text x="150" y="158" font-size="14" font-weight="normal" fill="#555" text-anchor="start">값 0/255</text><path d="M300.0 122.0 L1020.0 122.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 178.0 L1020.0 178.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 178.0 L480.0 178.0 L480.0 178.0 L660.0 178.0 L660.0 178.0 L840.0 178.0 L840.0 178.0 L1020.0 178.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M300.0 178.0 L1020.0 178.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1040" y="183.0" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">평균 ≈ 0.00V</text><circle cx="1150" cy="150" r="20" fill="#d43b3b" stroke="#333" stroke-width="1.5"/><circle cx="1150" cy="150" r="20" fill="#ffffff" fill-opacity="1.00"/><text x="40" y="250" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">듀티 25%</text><text x="150" y="250" font-size="14" font-weight="normal" fill="#555" text-anchor="start">값 64/255</text><path d="M300.0 214.0 L1020.0 214.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 270.0 L1020.0 270.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 270.0 L300.0 214.0 L345.0 214.0 L345.0 270.0 L480.0 270.0 L480.0 270.0 L480.0 214.0 L525.0 214.0 L525.0 270.0 L660.0 270.0 L660.0 270.0 L660.0 214.0 L705.0 214.0 L705.0 270.0 L840.0 270.0 L840.0 270.0 L840.0 214.0 L885.0 214.0 L885.0 270.0 L1020.0 270.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M300.0 256.0 L1020.0 256.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1040" y="261.0" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">평균 ≈ 0.82V</text><circle cx="1150" cy="242" r="20" fill="#d43b3b" stroke="#333" stroke-width="1.5"/><circle cx="1150" cy="242" r="20" fill="#ffffff" fill-opacity="0.78"/><text x="40" y="342" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">듀티 50%</text><text x="150" y="342" font-size="14" font-weight="normal" fill="#555" text-anchor="start">값 128/255</text><path d="M300.0 306.0 L1020.0 306.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 362.0 L1020.0 362.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 362.0 L300.0 306.0 L390.0 306.0 L390.0 362.0 L480.0 362.0 L480.0 362.0 L480.0 306.0 L570.0 306.0 L570.0 362.0 L660.0 362.0 L660.0 362.0 L660.0 306.0 L750.0 306.0 L750.0 362.0 L840.0 362.0 L840.0 362.0 L840.0 306.0 L930.0 306.0 L930.0 362.0 L1020.0 362.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M300.0 334.0 L1020.0 334.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1040" y="339.0" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">평균 ≈ 1.65V</text><circle cx="1150" cy="334" r="20" fill="#d43b3b" stroke="#333" stroke-width="1.5"/><circle cx="1150" cy="334" r="20" fill="#ffffff" fill-opacity="0.55"/><text x="40" y="434" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">듀티 75%</text><text x="150" y="434" font-size="14" font-weight="normal" fill="#555" text-anchor="start">값 191/255</text><path d="M300.0 398.0 L1020.0 398.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 454.0 L1020.0 454.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 454.0 L300.0 398.0 L435.0 398.0 L435.0 454.0 L480.0 454.0 L480.0 454.0 L480.0 398.0 L615.0 398.0 L615.0 454.0 L660.0 454.0 L660.0 454.0 L660.0 398.0 L795.0 398.0 L795.0 454.0 L840.0 454.0 L840.0 454.0 L840.0 398.0 L975.0 398.0 L975.0 454.0 L1020.0 454.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M300.0 412.0 L1020.0 412.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1040" y="417.0" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">평균 ≈ 2.48V</text><circle cx="1150" cy="426" r="20" fill="#d43b3b" stroke="#333" stroke-width="1.5"/><circle cx="1150" cy="426" r="20" fill="#ffffff" fill-opacity="0.32"/><text x="40" y="526" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">듀티 100%</text><text x="150" y="526" font-size="14" font-weight="normal" fill="#555" text-anchor="start">값 255/255</text><path d="M300.0 490.0 L1020.0 490.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 546.0 L1020.0 546.0" stroke="#eee" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 490.0 L480.0 490.0 L480.0 490.0 L660.0 490.0 L660.0 490.0 L840.0 490.0 L840.0 490.0 L1020.0 490.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M300.0 490.0 L1020.0 490.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1040" y="495.0" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">평균 ≈ 3.30V</text><circle cx="1150" cy="518" r="20" fill="#d43b3b" stroke="#333" stroke-width="1.5"/><circle cx="1150" cy="518" r="20" fill="#ffffff" fill-opacity="0.10"/><path d="M300.0 125.0 L480.0 125.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M480.0 125.0 L468.9 129.7 L468.9 120.3 Z" fill="#555"/><path d="M480.0 125.0 L300.0 125.0" stroke="#555" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 125.0 L311.1 120.3 L311.1 129.7 Z" fill="#555"/><text x="390.0" y="118" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">주기 T = 1/주파수</text><rect x="40" y="620" width="560" height="250" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="2"/><text x="60" y="654" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">ESP32 LEDC: 주파수 × 2^해상도 ≤ 80MHz</text><text x="70" y="694" font-size="15" font-weight="bold" fill="#222" text-anchor="start">해상도</text><text x="230" y="694" font-size="15" font-weight="bold" fill="#222" text-anchor="start">단계</text><text x="390" y="694" font-size="15" font-weight="bold" fill="#222" text-anchor="start">최대 주파수(대략)</text><text x="70" y="726" font-size="15" font-weight="normal" fill="#222" text-anchor="start">8비트</text><text x="230" y="726" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0~255</text><text x="390" y="726" font-size="15" font-weight="normal" fill="#222" text-anchor="start">312kHz</text><text x="70" y="758" font-size="15" font-weight="normal" fill="#222" text-anchor="start">10비트</text><text x="230" y="758" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0~1023</text><text x="390" y="758" font-size="15" font-weight="normal" fill="#222" text-anchor="start">78kHz</text><text x="70" y="790" font-size="15" font-weight="normal" fill="#222" text-anchor="start">12비트</text><text x="230" y="790" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0~4095</text><text x="390" y="790" font-size="15" font-weight="normal" fill="#222" text-anchor="start">19.5kHz</text><text x="70" y="822" font-size="15" font-weight="normal" fill="#222" text-anchor="start">13비트</text><text x="230" y="822" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0~8191</text><text x="390" y="822" font-size="15" font-weight="normal" fill="#222" text-anchor="start">9.7kHz</text><text x="60" y="858" font-size="13" font-weight="normal" fill="#555" text-anchor="start">LED: 1~5kHz면 깜빡임이 보이지 않는다. analogWrite 기본 = 8비트.</text><rect x="630" y="620" width="570" height="250" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="2"/><text x="650" y="654" font-size="17" font-weight="bold" fill="#1d2433" text-anchor="start">두 가지 코드 방법 (Arduino-ESP32 3.x)</text><text x="650" y="690" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">analogWrite(25, 128);          // 간단: 8비트, 약 50%</text><text x="650" y="714" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433"></text><text x="650" y="738" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">ledcAttach(25, 5000, 8);       // 직접: 5kHz, 8비트</text><text x="650" y="762" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">ledcWrite(25, 192);            // 약 75%</text><text x="650" y="786" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433"></text><text x="650" y="810" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">ledcAttach(27, 2000, 8);       // 부저</text><text x="650" y="834" font-size="14" xml:space="preserve" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433">ledcWriteTone(27, 1000);       // 1kHz 50% 톤</text></svg>