<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="409" viewBox="0 0 1240 409" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="409" fill="white"/><text x="40" y="48" font-size="28" font-weight="bold" fill="#1d2433" text-anchor="start">예제 1 · GPIO25 LED 출력 — 회로도</text><text x="40" y="80" font-size="16" font-weight="normal" fill="#444" text-anchor="start">digitalWrite(25, HIGH) → 3.3V가 저항·LED를 거쳐 GND로 흐른다. 빨간 LED·220Ω이면 I ≈ (3.3−2.0)/220 ≈ 6mA</text><rect x="40" y="112" width="240" height="245" rx="16" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="160.0" y="148" font-size="20" font-weight="bold" fill="white" text-anchor="middle">ESP32-DevKitC V4</text><rect x="260" y="212" width="18" height="18" rx="2" fill="#111"/><text x="252" y="227" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO25</text><text x="54" y="226" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-9</text><rect x="260" y="298" width="18" height="18" rx="2" fill="#111"/><text x="252" y="313" font-size="17" font-weight="bold" fill="white" text-anchor="end">GND</text><text x="54" y="312" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-14</text><text x="320" y="175" font-size="17" font-weight="bold" fill="#333" text-anchor="start">출력 — GPIO → 저항 → LED(+) … LED(−) → GND</text><path d="M280.0 221.0 L520.0 221.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="209" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565.0" y="227" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610.0 221.0 L700.0 221.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 205 L700 237 L732 221 Z" fill="#d43b3b" stroke="#222" stroke-width="2"/><path d="M732.0 205.0 L732.0 237.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712.0 199.0 L724.0 187.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722.0 201.0 L734.0 189.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="692" y="203" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="744" y="205" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="790" y="227" font-size="16" font-weight="bold" fill="#d43b3b" text-anchor="start">LED1 (긴 다리가 +)</text><path d="M732.0 221.0 L760.0 221.0 L760.0 245.0 L1130.0 245.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1130.0 245.0 L1130.0 307.0 L280.0 307.0" stroke="#222" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1130" cy="245" r="5" fill="#222" stroke="none" stroke-width="0"/><text x="1120" y="337" font-size="16" font-weight="bold" fill="#222" text-anchor="end">공통 GND</text><text x="40" y="391" font-size="14" font-weight="normal" fill="#555" text-anchor="start">저항은 LED의 앞(+쪽)이나 뒤(−쪽) 어디에 넣어도 전류 제한 효과는 같다. 단, 반드시 하나 이상 직렬로 들어가야 한다.</text></svg>