<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="850" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">1-Wire — 데이터선 1개(+GND), 64비트 고유 ID로 장치 구별</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">DQ선은 4.7kΩ 풀업으로 평소 HIGH. 마스터가 LOW로 끌어내리는 '시간 길이'로 0/1과 리셋을 구분한다(시간 슬롯).</text><rect x="40" y="110" width="1160" height="360" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">① 리셋·존재 펄스와 비트 쓰기/읽기 시간 슬롯</text><path d="M80.0 205.0 L120.0 205.0 L120.0 275.0 L320.0 275.0 L320.0 205.0 L370.0 205.0 L370.0 275.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M370.0 275.0 L480.0 275.0 L480.0 205.0 L550.0 205.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="220" y="301.0" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="middle">마스터 LOW ≥ 480µs = RESET</text><text x="425" y="301.0" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">센서 LOW 60~240µs</text><text x="425" y="319.0" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">= PRESENCE(나 여기 있어)</text><path d="M640.0 205.0 L660.0 205.0 L660.0 275.0 L760.0 275.0 L760.0 205.0 L790.0 205.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="720" y="193.0" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="middle">쓰기 0: LOW 60µs+</text><path d="M820.0 205.0 L830.0 205.0 L830.0 275.0 L850.0 275.0 L850.0 205.0 L970.0 205.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="895" y="193.0" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="middle">쓰기 1: LOW 1~15µs</text><path d="M1000.0 205.0 L1010.0 205.0 L1010.0 275.0 L1025.0 275.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M1025.0 275.0 L1070.0 275.0 L1070.0 205.0 L1150.0 205.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M1045.0 185.0 L1045.0 295.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><text x="1075" y="177.0" font-size="13" font-weight="bold" fill="#7b4bb3" text-anchor="middle">읽기: 15µs 시점 샘플</text><text x="1100" y="301.0" font-size="12" font-weight="normal" fill="#c06000" text-anchor="middle">센서가 LOW 유지 = 0</text><text x="60" y="340" font-size="14" font-weight="normal" fill="#333" text-anchor="start">한 바이트 = 8개 시간 슬롯(LSB 먼저). 슬롯 하나 ≈ 60~120µs → 약 15kbps. 타이밍이 정확해야 해서 라이브러리(OneWire)가 처리한다.</text><text x="60" y="372" font-size="14" font-weight="bold" fill="#7b4bb3" text-anchor="start">명령 흐름:  RESET → ROM 명령(0x55 MATCH ROM + 64비트 ID / 0xCC SKIP ROM) → 기능 명령(0x44 변환, 0xBE 읽기) → 데이터 9바이트(CRC 포함)</text><text x="60" y="404" font-size="14" font-weight="normal" fill="#333" text-anchor="start">64비트 ROM ID = 패밀리코드 1바이트(DS18B20=0x28) + 일련번호 6바이트 + CRC 1바이트 → 공장에서 정해져 겹치지 않는다</text><rect x="40" y="490" width="700" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="524" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">② 연결: 여러 센서를 한 선에</text><rect x="70" y="560" width="120" height="150" rx="10" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="130" y="590" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><text x="180" y="645" font-size="13" font-weight="bold" fill="white" text-anchor="end">GPIO13</text><text x="180" y="695" font-size="13" font-weight="bold" fill="white" text-anchor="end">GND</text><path d="M190.0 640.0 L700.0 640.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M190.0 690.0 L700.0 690.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 545.0 L250.0 560.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 560.0 L250.0 563.5" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 631.5 L250.0 635.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="239" y="563.5" width="22" height="68" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="268" y="602.5" font-size="14" font-weight="normal" fill="#333" text-anchor="start">4.7kΩ</text><circle cx="250" cy="640" r="5" fill="#7b4bb3" stroke="none" stroke-width="0"/><text x="262" y="552" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><path d="M400 745 L400 720 A22 22 0 0 1 444 720 L444 745 Z" fill="#222"/><path d="M422.0 640.0 L422.0 698.0" stroke="#7b4bb3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M408.0 690.0 L408.0 698.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="422" y="768" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">ID …A3</text><path d="M510 745 L510 720 A22 22 0 0 1 554 720 L554 745 Z" fill="#222"/><path d="M532.0 640.0 L532.0 698.0" stroke="#7b4bb3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M518.0 690.0 L518.0 698.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="532" y="768" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">ID …5F</text><path d="M620 745 L620 720 A22 22 0 0 1 664 720 L664 745 Z" fill="#222"/><path d="M642.0 640.0 L642.0 698.0" stroke="#7b4bb3" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M628.0 690.0 L628.0 698.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="642" y="768" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">ID …C1</text><text x="60" y="805" font-size="12" font-weight="normal" fill="#555" text-anchor="start">VDD는 3V3(또는 UNO 5V)에 연결(외부 전원 방식). 기생 전원 방식은 9주차에서 다루지 않음</text><rect x="760" y="490" width="440" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="780" y="524" font-size="20" font-weight="bold" fill="#7b4bb3" text-anchor="start">③ 기억할 점</text><text x="785" y="548" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 신호선 1개 + GND (전원선 포함 3선)</text><text x="785" y="581" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 4.7kΩ 풀업 없으면 '센서 없음'</text><text x="785" y="614" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 느리지만 수십 m까지 가능</text><text x="785" y="647" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 장치마다 고유 ID → 주소 설정 불필요</text><text x="785" y="680" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• DS18B20: -55~125°C, ±0.5°C</text><text x="785" y="713" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 12비트 변환에 최대 750ms</text><text x="785" y="746" font-size="14" font-weight="bold" fill="#a40000" text-anchor="start">• DHT11은 1-Wire가 아니다(10주차)</text></svg>