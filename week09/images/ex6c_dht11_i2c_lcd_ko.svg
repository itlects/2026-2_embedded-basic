<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="810" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 6C · DHT11 온습도 → I2C LCD1602 (BH1750이 없을 때의 I2C 실습)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">DHT11은 I2C가 아니다(전용 단일선). I2C로 통신하는 장치는 LCD 백팩(PCF8574, 주소 0x27/0x3F) — SDA·SCL 2선으로 글자를 보낸다.</text><rect x="60" y="130" width="250" height="360" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="185.0" y="162" font-size="19" font-weight="bold" fill="white" text-anchor="middle">Arduino UNO</text><rect x="288" y="192" width="16" height="16" rx="2" fill="#111"/><text x="280" y="205" font-size="15" font-weight="bold" fill="white" text-anchor="end">5V</text><rect x="288" y="242" width="16" height="16" rx="2" fill="#111"/><text x="280" y="255" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="288" y="302" width="16" height="16" rx="2" fill="#111"/><text x="280" y="315" font-size="15" font-weight="bold" fill="white" text-anchor="end">A4 SDA</text><rect x="288" y="352" width="16" height="16" rx="2" fill="#111"/><text x="280" y="365" font-size="15" font-weight="bold" fill="white" text-anchor="end">A5 SCL</text><rect x="288" y="422" width="16" height="16" rx="2" fill="#111"/><text x="280" y="435" font-size="15" font-weight="bold" fill="white" text-anchor="end">D2</text><rect x="700" y="140" width="300" height="110" rx="8" fill="#1f5f2a" stroke="#0f3a16" stroke-width="2"/><rect x="720" y="160" width="260" height="70" rx="4" fill="#9ed36a" stroke="#4a7a2a" stroke-width="2"/><text x="734" y="190" font-size="18" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#123" text-anchor="start" xml:space="preserve">Temp: 24°C</text><text x="734" y="218" font-size="18" fon