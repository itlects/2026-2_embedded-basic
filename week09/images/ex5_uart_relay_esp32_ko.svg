<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="900" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 5 · UART 양방향 — 센서값 송신 + PC 명령으로 릴레이 제어 (ESP32)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">PC ⇄ USB ⇄ 보드: 보드는 1초마다 'DATA,…'를 보내고, PC가 'ON/OFF/AUTO 60'을 보내면 릴레이를 켠다. 부하는 LED(저전압)만 사용.</text><rect x="40" y="130" width="170" height="120" rx="10" fill="#eef2f7" stroke="#555" stroke-width="2"/><text x="125" y="165" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">PC</text><text x="125" y="192" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">시리얼 모니터</text><text x="125" y="212" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">115200 · Newline</text><path d="M215.0 175.0 L300.0 175.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300.0 175.0 L288.9 179.7 L288.9 170.3 Z" fill="#2664bf"/><text x="258" y="165" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">명령 ON</text><path d="M300.0 215.0 L215.0 215.0" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M215.0 215.0 L226.1 210.3 L226.1 219.7 Z" fill="#208657"/><text x="258" y="238" font-size="12" font-weight="bold" fill="#208657" text-anchor="middle">DATA,…</text><rect x="300" y="110" width="250" height="290" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="425.0" y="142" font-size="19" font-weight="bold" fill="white" text-anchor="middle">ESP32-DevKitC V4</text><rect x="528" y="172" width="16" height="16" rx="2" fill="#111"/><text x="520" y="185" font-size="15" font-weight="bold" fill="white" text-anchor="end">5V</text><rect x="528" y="212" width="16" height="16" rx="2" fill="#111"/><text x="520" y="225" font-size="15" font-weight="bold" fill="white" text-anchor="end">3V3</text><rect x="528" y="252" width="16" height="16" rx="2" fill="#111"/><text x="520" y="265" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO34</text><rect x="528" y="292" width="16" height="16" rx="2" fill="#111"/><text x="520" y="305" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO32</text><rect x="528" y="332" width="16" height="16" rx="2" fill="#111"/><text x="520" y="345" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><text x="425" y="365" font-size="12" font-weight="normal" fill="#dce9f7" text-anchor="middle">USB 데이터 케이블 → PC</text><rect x="700" y="120" width="150" height="120" rx="8" fill="#2f5d8a" stroke="#173552" stroke-width="2.5"/><text x="775" y="144" font-size="14" font-weight="bold" fill="white" text-anchor="middle">가변저항 10kΩ</text><circle cx="775" cy="188" r="22" fill="#d8dde3" stroke="#555" stroke-width="2"/><path d="M730.0 240.0 L730.0 260.0" stroke="#999" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="730" cy="265" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="730" y="232" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1</text><path d="M775.0 240.0 L775.0 260.0" stroke="#999" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="775" cy="265" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="775" y="232" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text><path d="M820.0 240.0 L820.0 260.0" stroke="#999" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="820" cy="265" r="5" fill="#d4af37" stroke="none" stroke-width="0"/><text x="820" y="232" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text><path d="M544.0 220.0 L620.0 220.0 L620.0 300.0 L730.0 300.0 L730.0 265.0" stroke="#d43b3b" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M544.0 260.0 L640.0 260.0 L640.0 320.0 L775.0 320.0 L775.0 265.0" stroke="#178a8a" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M544.0 340.0 L660.0 340.0 L660.0 340.0 L820.0 340.0 L820.0 265.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="700" y="420" width="260" height="190" rx="10" fill="#1b5e7e" stroke="#0e3a4f" stroke-width="2.5"/><text x="830" y="448" font-size="15" font-weight="bold" fill="white" text-anchor="middle">1채널 릴레이 모듈</text><rect x="810" y="470" width="90" height="70" rx="4" fill="#2a6fc9" stroke="#123" stroke-width="2"/><text x="855" y="510" font-size="12" font-weight="bold" fill="white" text-anchor="middle">RELAY</text><text x="855" y="528" font-size="11" font-weight="normal" fill="#dce9f7" text-anchor="middle">5V 코일</text><circle cx="700" cy="490" r="6" fill="#d4af37" stroke="#7a5d00" stroke-width="1.5"/><text x="714" y="495" font-size="13" font-weight="bold" fill="white" text-anchor="start">VCC</text><circle cx="700" cy="530" r="6" fill="#d4af37" stroke="#7a5d00" stroke-width="1.5"/><text x="714" y="535" font-size="13" font-weight="bold" fill="white" text-anchor="start">GND</text><circle cx="700" cy="570" r="6" fill="#d4af37" stroke="#7a5d00" stroke-width="1.5"/><text x="714" y="575" font-size="13" font-weight="bold" fill="white" text-anchor="start">IN</text><rect x="930" y="478" width="40" height="24" rx="3" fill="#2b7a3d" stroke="#123" stroke-width="1.5"/><text x="950" y="495" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NO</text><rect x="930" y="518" width="40" height="24" rx="3" fill="#2b7a3d" stroke="#123" stroke-width="1.5"/><text x="950" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">COM</text><rect x="930" y="558" width="40" height="24" rx="3" fill="#2b7a3d" stroke="#123" stroke-width="1.5"/><text x="950" y="575" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NC</text><path d="M544.0 180.0 L580.0 180.0 L580.0 490.0 L700.0 490.0" stroke="#a40000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660.0 340.0 L660.0 530.0 L700.0 530.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M544.0 300.0 L600.0 300.0 L600.0 570.0 L700.0 570.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1100" y="400" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">저전압 부하(예)</text><path d="M970.0 530.0 L1050.0 530.0" stroke="#a40000" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1058" y="535" font-size="12" font-weight="bold" fill="#a40000" text-anchor="start">← 보드 5V</text><path d="M970.0 490.0 L1150.0 490.0 L1150.0 470.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="1138" y="470" width="24" height="50" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="1170" y="500" font-size="12" font-weight="normal" fill="#333" text-anchor="start">330Ω</text><path d="M1150.0 520.0 L1150.0 540.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1136 540 L1164 540 L1150 564 Z" fill="#208657" stroke="#222" stroke-width="1.5"/><path d="M1136.0 564.0 L1164.0 564.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1172" y="558" font-size="12" font-weight="bold" fill="#208657" text-anchor="start">LED</text><path d="M1150.0 564.0 L1150.0 590.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1150.0 590.0 L1150.0 600.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1136.0 600.0 L1164.0 600.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1141.0 606.0 L1159.0 606.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1146.0 612.0 L1154.0 612.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1100" y="645" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">릴레이 ON → COM–NO 연결 → LED 켜짐</text><rect x="40" y="680" width="1160" height="190" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="2"/><text x="60" y="710" font-size="16" font-weight="bold" fill="#222" text-anchor="start">연결 주의</text><text x="60" y="742" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 릴레이 VCC=5V 핀(USB 전원), GND 공통, IN=GPIO32</text><text x="60" y="770" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 5V 코일 Active-LOW 모듈 + 3.3V GPIO: HIGH(3.3V)로는 안 꺼질 수 있다</text><text x="60" y="798" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  → 코드는 '끌 때 핀을 INPUT(고임피던스)'으로 바꾼다 (relayWrite 함수)</text><text x="60" y="826" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 또는 3.3V 트리거 모듈 / High-Low 점퍼형 모듈을 사용</text><text x="60" y="855" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">⚠ 실습에서 릴레이 접점에 220V 등 상용 전원을 연결하지 않는다. 5V 이하 저전압 부하만.</text></svg>