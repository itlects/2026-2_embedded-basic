<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="615" viewBox="0 0 1240 615" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="615" fill="white"/><text x="40" y="48" font-size="28" font-weight="bold" fill="#1d2433" text-anchor="start">예제 3 · 가변저항 ADC 입력(GPIO34) → LED PWM(GPIO25) — 회로도</text><text x="40" y="80" font-size="16" font-weight="normal" fill="#444" text-anchor="start">analogRead(34) 0~4095  →  map(…, 0, 255)  →  analogWrite(25, duty)</text><rect x="40" y="112" width="240" height="451" rx="16" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="160.0" y="148" font-size="20" font-weight="bold" fill="white" text-anchor="middle">ESP32-DevKitC V4</text><rect x="260" y="212" width="18" height="18" rx="2" fill="#111"/><text x="252" y="227" font-size="17" font-weight="bold" fill="white" text-anchor="end">3V3</text><text x="54" y="226" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-1</text><rect x="260" y="262" width="18" height="18" rx="2" fill="#111"/><text x="252" y="277" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO34</text><text x="54" y="276" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-5</text><rect x="260" y="418" width="18" height="18" rx="2" fill="#111"/><text x="252" y="433" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO25</text><text x="54" y="432" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-9</text><rect x="260" y="504" width="18" height="18" rx="2" fill="#111"/><text x="252" y="519" font-size="17" font-weight="bold" fill="white" text-anchor="end">GND</text><text x="54" y="518" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-14</text><text x="320" y="175" font-size="17" font-weight="bold" fill="#333" text-anchor="start">입력 — 가변저항 전압 분배 (ADC1)</text><path d="M280.0 221.0 L760.0 221.0 L760.0 227.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="748" y="227" width="24" height="90" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><path d="M280.0 271.0 L730.0 271.0" stroke="#178a8a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M720.0 271.0 L747.0 271.0" stroke="#178a8a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M747.0 271.0 L735.9 275.7 L735.9 266.3 Z" fill="#178a8a"/><path d="M760.0 317.0 L760.0 341.0 L1130.0 341.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="786" y="251" font-size="16" font-weight="bold" fill="#2f5d8a" text-anchor="start">가변저항 10kΩ (B형)</text><text x="786" y="275" font-size="14" font-weight="normal" fill="#444" text-anchor="start">1번 → 3V3, 2번(가운데·와이퍼) → GPIO34, 3번 → GND</text><text x="786" y="297" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Vout = 3.3V × (아래쪽 저항 / 전체 저항)</text><text x="470" y="211" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="middle">3.3V (5V 금지)</text><text x="470" y="261" font-size="13" font-weight="bold" fill="#178a8a" text-anchor="middle">ADC1_CH6 · 입력 전용</text><text x="320" y="381" font-size="17" font-weight="bold" fill="#333" text-anchor="start">출력 — PWM으로 LED 밝기 조절</text><path d="M280.0 427.0 L520.0 427.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="415" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565.0" y="433" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610.0 427.0 L700.0 427.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 411 L700 443 L732 427 Z" fill="#d43b3b" stroke="#222" stroke-width="2"/><path d="M732.0 411.0 L732.0 443.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712.0 405.0 L724.0 393.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722.0 407.0 L734.0 395.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="692" y="409" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="744" y="411" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="790" y="433" font-size="16" font-weight="bold" fill="#d43b3b" text-anchor="start">LED1 (PWM 밝기)</text><path d="M732.0 427.0 L760.0 427.0 L760.0 451.0 L1130.0 451.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1130.0 341.0 L1130.0 513.0 L280.0 513.0" stroke="#222" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1130" cy="341" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="451" r="5" fill="#222" stroke="none" stroke-width="0"/><text x="1120" y="543" font-size="16" font-weight="bold" fill="#222" text-anchor="end">공통 GND</text><text x="40" y="597" font-size="14" font-weight="normal" fill="#555" text-anchor="start">가변저항 양 끝 중 어느 쪽을 3V3로 하느냐에 따라 회전 방향과 값 증가 방향만 바뀐다. 가운데 단자를 3V3/GND에 꽂으면 단락 위험.</text></svg>