<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="330" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 3의 신호 흐름 — 입력(ADC)과 출력(PWM)은 서로 다른 장치</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">loop()가 100ms마다 한 바퀴: 측정 → 변환 → 출력 → 기록</text><rect x="40" y="140" width="200" height="110" rx="12" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><text x="140" y="186" font-size="17" font-weight="bold" fill="#2f5d8a" text-anchor="middle">가변저항 회전</text><text x="140" y="216" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">0~3.3V</text><path d="M244.0 195.0 L276.0 195.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M276.0 195.0 L264.9 199.7 L264.9 190.3 Z" fill="#333"/><rect x="280" y="140" width="200" height="110" rx="12" fill="#fff" stroke="#178a8a" stroke-width="3"/><text x="380" y="186" font-size="17" font-weight="bold" fill="#178a8a" text-anchor="middle">GPIO34 · ADC1</text><text x="380" y="216" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">analogRead → 0~4095</text><path d="M484.0 195.0 L516.0 195.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M516.0 195.0 L504.9 199.7 L504.9 190.3 Z" fill="#333"/><rect x="520" y="140" width="200" height="110" rx="12" fill="#fff" stroke="#555" stroke-width="3"/><text x="620" y="186" font-size="17" font-weight="bold" fill="#555" text-anchor="middle">map()</text><text x="620" y="216" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">0~4095 → 0~255</text><path d="M724.0 195.0 L756.0 195.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M756.0 195.0 L744.9 199.7 L744.9 190.3 Z" fill="#333"/><rect x="760" y="140" width="200" height="110" rx="12" fill="#fff" stroke="#2664bf" stroke-width="3"/><text x="860" y="186" font-size="17" font-weight="bold" fill="#2664bf" text-anchor="middle">GPIO25 · LEDC</text><text x="860" y="216" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">analogWrite → 듀티</text><path d="M964.0 195.0 L996.0 195.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M996.0 195.0 L984.9 199.7 L984.9 190.3 Z" fill="#333"/><rect x="1000" y="140" width="200" height="110" rx="12" fill="#fff" stroke="#d43b3b" stroke-width="3"/><text x="1100" y="186" font-size="17" font-weight="bold" fill="#d43b3b" text-anchor="middle">LED 밝기</text><text x="1100" y="216" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">평균 전류 변화</text><text x="40" y="300" font-size="15" font-weight="normal" fill="#333" text-anchor="start">duty = map(adc, 0, 4095, 0, 255);  duty = constrain(duty, 0, 255);   — 비례식 duty = adc × 255 / 4095</text></svg>