<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="985" viewBox="0 0 1240 985" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="985" fill="white"/><text x="40" y="48" font-size="28" font-weight="bold" fill="#1d2433" text-anchor="start">예제 4 · 복합 이벤트 컨트롤러 — 회로도</text><text x="40" y="80" font-size="16" font-weight="normal" fill="#444" text-anchor="start">버튼 2 · LED 2 · 가변저항 1 · 수동 부저 1. 모든 GND는 하나로 연결된다.</text><rect x="40" y="112" width="240" height="821" rx="16" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="160.0" y="148" font-size="20" font-weight="bold" fill="white" text-anchor="middle">ESP32-DevKitC V4</text><rect x="260" y="212" width="18" height="18" rx="2" fill="#111"/><text x="252" y="227" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO25</text><text x="54" y="226" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-9</text><rect x="260" y="294" width="18" height="18" rx="2" fill="#111"/><text x="252" y="309" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO26</text><text x="54" y="308" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-10</text><rect x="260" y="422" width="18" height="18" rx="2" fill="#111"/><text x="252" y="437" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO18</text><text x="54" y="436" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J3-9</text><rect x="260" y="484" width="18" height="18" rx="2" fill="#111"/><text x="252" y="499" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO19</text><text x="54" y="498" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J3-8</text><rect x="260" y="592" width="18" height="18" rx="2" fill="#111"/><text x="252" y="607" font-size="17" font-weight="bold" fill="white" text-anchor="end">3V3</text><text x="54" y="606" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-1</text><rect x="260" y="642" width="18" height="18" rx="2" fill="#111"/><text x="252" y="657" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO34</text><text x="54" y="656" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-5</text><rect x="260" y="798" width="18" height="18" rx="2" fill="#111"/><text x="252" y="813" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO27</text><text x="54" y="812" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-11</text><rect x="260" y="874" width="18" height="18" rx="2" fill="#111"/><text x="252" y="889" font-size="17" font-weight="bold" fill="white" text-anchor="end">GND</text><text x="54" y="888" font-size="12" font-weight="normal" fill="#b9d3ee" text-anchor="start">J2-14</text><text x="320" y="175" font-size="17" font-weight="bold" fill="#333" text-anchor="start">출력 — LED</text><path d="M280.0 221.0 L520.0 221.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="209" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565.0" y="227" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610.0 221.0 L700.0 221.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 205 L700 237 L732 221 Z" fill="#d43b3b" stroke="#222" stroke-width="2"/><path d="M732.0 205.0 L732.0 237.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712.0 199.0 L724.0 187.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722.0 201.0 L734.0 189.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="692" y="203" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="744" y="205" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="790" y="227" font-size="16" font-weight="bold" fill="#d43b3b" text-anchor="start">LED1 · ADC 값 → PWM 밝기</text><path d="M732.0 221.0 L760.0 221.0 L760.0 245.0 L1130.0 245.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M280.0 303.0 L520.0 303.0" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="291" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565.0" y="309" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610.0 303.0 L700.0 303.0" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 287 L700 319 L732 303 Z" fill="#208657" stroke="#222" stroke-width="2"/><path d="M732.0 287.0 L732.0 319.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712.0 281.0 L724.0 269.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722.0 283.0 L734.0 271.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="692" y="285" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="744" y="287" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="790" y="309" font-size="16" font-weight="bold" fill="#208657" text-anchor="start">LED2 · RUN 중 400ms 점멸</text><path d="M732.0 303.0 L760.0 303.0 L760.0 327.0 L1130.0 327.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="320" y="385" font-size="17" font-weight="bold" fill="#333" text-anchor="start">입력 — 버튼 (INPUT_PULLUP)</text><path d="M280.0 431.0 L580.0 431.0" stroke="#b8322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580" cy="431" r="5" fill="#b8322f" stroke="none" stroke-width="0"/><path d="M580.0 431.0 L624.0 411.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="431" r="5" fill="#222" stroke="none" stroke-width="0"/><path d="M640.0 431.0 L1130.0 431.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="421" font-size="16" font-weight="bold" fill="#b8322f" text-anchor="start">버튼 RUN · 실행/정지</text><text x="420" y="421" font-size="13" font-weight="normal" fill="#666" text-anchor="middle">내부 풀업 ≈45kΩ → 평소 HIGH</text><path d="M280.0 493.0 L580.0 493.0" stroke="#1b6e48" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580" cy="493" r="5" fill="#1b6e48" stroke="none" stroke-width="0"/><path d="M580.0 493.0 L624.0 473.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="493" r="5" fill="#222" stroke="none" stroke-width="0"/><path d="M640.0 493.0 L1130.0 493.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="483" font-size="16" font-weight="bold" fill="#1b6e48" text-anchor="start">버튼 MODE · 경보 ON/OFF</text><text x="420" y="483" font-size="13" font-weight="normal" fill="#666" text-anchor="middle">내부 풀업 ≈45kΩ → 평소 HIGH</text><text x="320" y="555" font-size="17" font-weight="bold" fill="#333" text-anchor="start">입력 — 가변저항 (ADC1)</text><path d="M280.0 601.0 L760.0 601.0 L760.0 607.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="748" y="607" width="24" height="90" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><path d="M280.0 651.0 L730.0 651.0" stroke="#178a8a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M720.0 651.0 L747.0 651.0" stroke="#178a8a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M747.0 651.0 L735.9 655.7 L735.9 646.3 Z" fill="#178a8a"/><path d="M760.0 697.0 L760.0 721.0 L1130.0 721.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="786" y="631" font-size="16" font-weight="bold" fill="#2f5d8a" text-anchor="start">가변저항 10kΩ</text><text x="786" y="655" font-size="14" font-weight="normal" fill="#444" text-anchor="start">1번 → 3V3, 2번(가운데·와이퍼) → GPIO34, 3번 → GND</text><text x="786" y="677" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Vout = 3.3V × (아래쪽 저항 / 전체 저항)</text><text x="470" y="591" font-size="13" font-weight="bold" fill="#d43b3b" text-anchor="middle">3.3V (5V 금지)</text><text x="470" y="641" font-size="13" font-weight="bold" fill="#178a8a" text-anchor="middle">ADC1_CH6 · 입력 전용</text><text x="320" y="761" font-size="17" font-weight="bold" fill="#333" text-anchor="start">출력 — 수동 부저 (톤)</text><path d="M280.0 807.0 L704.0 807.0" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="730" cy="807" r="26" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="730" cy="807" r="5" fill="#555" stroke="none" stroke-width="0"/><text x="713.88" y="804" font-size="15" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><path d="M756.0 807.0 L1130.0 807.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="790" y="795" font-size="16" font-weight="bold" fill="#7b4bb3" text-anchor="start">수동 부저 (+ 표시가 신호 쪽)</text><text x="470" y="797" font-size="13" font-weight="normal" fill="#666" text-anchor="middle">LEDC 톤(주파수) 출력</text><path d="M1130.0 245.0 L1130.0 883.0 L280.0 883.0" stroke="#222" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1130" cy="245" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="327" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="431" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="493" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="721" r="5" fill="#222" stroke="none" stroke-width="0"/><circle cx="1130" cy="807" r="5" fill="#222" stroke="none" stroke-width="0"/><text x="1120" y="913" font-size="16" font-weight="bold" fill="#222" text-anchor="end">공통 GND</text><text x="40" y="967" font-size="14" font-weight="normal" fill="#555" text-anchor="start">부저 정격이 3.3V·소전류가 아니면 GPIO27에 직결하지 말고 '부저 구동 회로(NPN)' 그림처럼 트랜지스터를 사용한다.</text></svg>