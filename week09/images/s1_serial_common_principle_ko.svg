<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="860" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">시리얼 통신의 공통 원리 — 한 줄로 1비트씩, 약속(프로토콜)대로</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">MCU와 센서·PC는 데이터를 비트 단위로 순서대로 보낸다. 방식은 달라도 아래 5가지 질문에 대한 '약속'이 프로토콜이다.</text><rect x="40" y="110" width="560" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">① 병렬 vs 직렬</text><text x="70" y="175" font-size="15" font-weight="bold" fill="#222" text-anchor="start">병렬: 8비트를 8개 선으로 동시에</text><path d="M80.0 195.0 L300.0 195.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="200" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 206.0 L300.0 206.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="211" font-size="12" font-weight="bold" fill="#555" text-anchor="start">1</text><path d="M80.0 217.0 L300.0 217.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="222" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 228.0 L300.0 228.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="233" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 239.0 L300.0 239.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="244" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 250.0 L300.0 250.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="255" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 261.0 L300.0 261.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="266" font-size="12" font-weight="bold" fill="#555" text-anchor="start">0</text><path d="M80.0 272.0 L300.0 272.0" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="277" font-size="12" font-weight="bold" fill="#555" text-anchor="start">1</text><text x="350" y="240" font-size="14" font-weight="normal" fill="#555" text-anchor="start">→ 빠르지만 선이 많다</text><text x="70" y="315" font-size="15" font-weight="bold" fill="#222" text-anchor="start">직렬: 1개 선으로 하나씩 차례로</text><path d="M80.0 345.0 L104.0 345.0 L104.0 375.0 L128.0 375.0 L128.0 345.0 L152.0 345.0 L152.0 375.0 L176.0 375.0 L200.0 375.0 L224.0 375.0 L248.0 375.0 L272.0 375.0 L272.0 345.0 L296.0 345.0 L296.0 375.0 L320.0 375.0 L320.0 345.0 L344.0 345.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="350" y="395" font-size="14" font-weight="normal" fill="#555" text-anchor="start">→ 선이 적어 센서 연결에 유리</text><rect x="620" y="110" width="580" height="300" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="640" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">② 모든 시리얼 방식이 정하는 5가지</text><text x="645" y="170" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">1. 타이밍</text><text x="745" y="170" font-size="14" font-weight="normal" fill="#222" text-anchor="start">클럭선을 같이 보내나(동기) / 속도를 미리 맞추나(비동기)</text><text x="645" y="216" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">2. 프레임</text><text x="745" y="216" font-size="14" font-weight="normal" fill="#222" text-anchor="start">어디서 시작·끝나나 (START/STOP, CS, RESET)</text><text x="645" y="262" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">3. 주소</text><text x="745" y="262" font-size="14" font-weight="normal" fill="#222" text-anchor="start">여러 장치 중 누구에게? (주소·CS선·64비트 ID)</text><text x="645" y="308" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">4. 방향</text><text x="745" y="308" font-size="14" font-weight="normal" fill="#222" text-anchor="start">동시에 양방향(전이중) / 번갈아(반이중)</text><text x="645" y="354" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">5. 전기</text><text x="745" y="354" font-size="14" font-weight="normal" fill="#222" text-anchor="start">전압 레벨, 풀업 저항, 공통 GND, 거리</text><rect x="40" y="430" width="560" height="390" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="464" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">③ 동기식 vs 비동기식</text><text x="70" y="490" font-size="15" font-weight="bold" fill="#2664bf" text-anchor="start">비동기(UART): 클럭선 없음 → 양쪽 baud 일치 필요</text><path d="M80.0 522.0 L116.0 522.0 L116.0 558.0 L152.0 558.0 L152.0 522.0 L188.0 522.0 L188.0 558.0 L224.0 558.0 L260.0 558.0 L296.0 558.0 L332.0 558.0 L368.0 558.0 L368.0 522.0 L404.0 522.0 L404.0 558.0 L440.0 558.0 L440.0 522.0 L476.0 522.0 L512.0 522.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="134.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">S</text><text x="170.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">1</text><text x="206.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="242.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="278.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="314.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="350.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="386.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">1</text><text x="422.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">0</text><text x="458.0" y="514.0" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">P</text><text x="70" y="590" font-size="13" font-weight="normal" fill="#555" text-anchor="start">S=START, P=STOP. 비트 폭 = 1/baud (115200 → 8.68µs)</text><text x="70" y="640" font-size="15" font-weight="bold" fill="#208657" text-anchor="start">동기(I2C·SPI): 클럭선이 '지금 읽어라'를 알려줌</text><path d="M80.0 705.0 L110.0 705.0 L110.0 675.0 L140.0 675.0 L140.0 705.0 L170.0 705.0 L170.0 675.0 L200.0 675.0 L200.0 705.0 L230.0 705.0 L230.0 675.0 L260.0 675.0 L260.0 705.0 L290.0 705.0 L290.0 675.0 L320.0 675.0 L320.0 705.0 L350.0 705.0 L350.0 675.0 L380.0 675.0 L380.0 705.0 L410.0 705.0 L410.0 675.0 L440.0 675.0 L440.0 705.0 L470.0 705.0 L470.0 675.0 L500.0 675.0" stroke="#555" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="70" y="695" font-size="12" font-weight="bold" fill="#555" text-anchor="end">CLK</text><path d="M80.0 725.0 L110.0 725.0 L140.0 725.0 L140.0 755.0 L170.0 755.0 L200.0 755.0 L200.0 725.0 L230.0 725.0 L260.0 725.0 L260.0 755.0 L290.0 755.0 L320.0 755.0 L350.0 755.0 L380.0 755.0 L380.0 725.0 L410.0 725.0 L440.0 725.0 L470.0 725.0 L500.0 725.0" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="70" y="745" font-size="12" font-weight="bold" fill="#208657" text-anchor="end">DATA</text><text x="70" y="795" font-size="13" font-weight="normal" fill="#555" text-anchor="start">클럭이 있으므로 속도가 조금 흔들려도 된다. 1-Wire는 '시간 슬롯'으로 동기</text><rect x="620" y="430" width="580" height="390" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="640" y="464" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">④ 연결 구조(토폴로지)</text><rect x="650" y="480" width="90" height="38" rx="6" fill="#fff" stroke="#2664bf" stroke-width="2.5"/><text x="695.0" y="505" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">MCU</text><rect x="850" y="480" width="90" height="38" rx="6" fill="#fff" stroke="#2664bf" stroke-width="2.5"/><text x="895.0" y="505" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="middle">장치</text><path d="M740.0 492.0 L850.0 492.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740.0 508.0 L850.0 508.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1000" y="505" font-size="15" font-weight="bold" fill="#2664bf" text-anchor="start">UART: 1:1 점대점</text><rect x="650" y="560" width="90" height="38" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="695.0" y="585" font-size="14" font-weight="bold" fill="#208657" text-anchor="middle">MCU</text><path d="M740.0 572.0 L1000.0 572.0" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740.0 588.0 L1000.0 588.0" stroke="#208657" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M810.0 588.0 L810.0 612.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="790" y="612" width="60" height="38" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="820.0" y="637" font-size="14" font-weight="bold" fill="#208657" text-anchor="middle">#1</text><path d="M900.0 588.0 L900.0 612.0" stroke="#208657" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="880" y="612" width="60" height="38" rx="6" fill="#fff" stroke="#208657" stroke-width="2.5"/><text x="910.0" y="637" font-size="14" font-weight="bold" fill="#208657" text-anchor="middle">#2</text><text x="1010" y="585" font-size="15" font-weight="bold" fill="#208657" text-anchor="start">I2C: 2선 버스+주소</text><rect x="650" y="690" width="90" height="38" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="695.0" y="715" font-size="14" font-weight="bold" fill="#c06000" text-anchor="middle">MCU</text><path d="M740.0 700.0 L980.0 700.0" stroke="#c06000" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M820.0 700.0 L820.0 740.0" stroke="#c06000" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="790" y="740" width="60" height="38" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="820.0" y="765" font-size="14" font-weight="bold" fill="#c06000" text-anchor="middle">#1</text><path d="M740.0 715.0 L800.0 715.0 L800.0 740.0" stroke="#999" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M910.0 700.0 L910.0 740.0" stroke="#c06000" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="880" y="740" width="60" height="38" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="910.0" y="765" font-size="14" font-weight="bold" fill="#c06000" text-anchor="middle">#2</text><path d="M740.0 723.0 L896.0 723.0 L896.0 740.0" stroke="#999" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><text x="1000" y="705" font-size="15" font-weight="bold" fill="#c06000" text-anchor="start">SPI: 공유선+장치별 CS</text><text x="1000" y="760" font-size="15" font-weight="bold" fill="#7b4bb3" text-anchor="start">1-Wire: 1선 버스+64비트 ID</text><text x="1000" y="782" font-size="13" font-weight="normal" fill="#555" text-anchor="start">(아래 1-Wire 그림 참고)</text></svg>