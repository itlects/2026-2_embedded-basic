<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="980" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">9주차 부품 확인 — 모양 · 극성 · 동작원리</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">부품을 꽂기 전에 다리 방향과 내부 연결을 확인한다. (그림은 일반적인 형태이며 제품마다 모양이 조금 다를 수 있다)</text><rect x="40" y="110" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="180.0" y="144" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">LED (발광 다이오드)</text><rect x="340" y="110" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="480.0" y="144" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">저항 220Ω / 330Ω</text><rect x="640" y="110" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="780.0" y="144" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">4핀 택트 스위치</text><rect x="940" y="110" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="1080.0" y="144" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">가변저항 10kΩ</text><rect x="40" y="520" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="180.0" y="554" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">수동 부저 vs 능동 부저</text><rect x="340" y="520" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="480.0" y="554" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">브레드보드</text><rect x="640" y="520" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="780.0" y="554" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">점퍼선 · USB 케이블</text><rect x="940" y="520" width="280" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="1080.0" y="554" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">NPN 트랜지스터(선택)</text><path d="M158 220 L158 180 A22 22 0 0 1 202 180 L202 220 Z" fill="#d43b3b" fill-opacity="0.85" stroke="#333" stroke-width="2"/><rect x="154" y="220" width="52" height="7" fill="#d43b3b" stroke="#333"/><path d="M170.0 227.0 L170.0 330.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M190.0 227.0 L190.0 305.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="162" y="350" font-size="14" font-weight="bold" fill="#c62828" text-anchor="end">긴 다리 = +(애노드)</text><text x="198" y="320" font-size="14" font-weight="bold" fill="#333" text-anchor="start">짧은 다리 = −</text><text x="60" y="390" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• +→− 방향으로만 전류가 흐르며 빛남</text><text x="60" y="416" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 평평한 테두리 쪽 = −(캐소드)</text><text x="60" y="442" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 반드시 직렬 저항과 함께</text><path d="M370.0 220.0 L590.0 220.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="200" width="110" height="40" rx="16" fill="#e9cf9a" stroke="#8a6a2a" stroke-width="2"/><rect x="442" y="200" width="9" height="40" fill="#c62828"/><rect x="460" y="200" width="9" height="40" fill="#c62828"/><rect x="478" y="200" width="9" height="40" fill="#6d4c2f"/><rect x="508" y="200" width="9" height="40" fill="#c9a227"/><text x="360" y="290" font-size="13" font-weight="bold" fill="#222" text-anchor="start">220Ω: 빨강-빨강-갈색-금</text><text x="360" y="316" font-size="13" font-weight="bold" fill="#222" text-anchor="start">330Ω: 주황-주황-갈색-금</text><text x="360" y="342" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="360" y="368" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 전류를 제한한다(옴의 법칙 V=IR)</text><text x="360" y="394" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 극성 없음 · LED마다 1개</text><text x="360" y="420" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 5색 띠 저항: 빨-빨-검-검-갈 = 220Ω</text><rect x="725" y="175" width="110" height="110" rx="8" fill="#3a3a3a" stroke="#111" stroke-width="2"/><circle cx="780" cy="230" r="24" fill="#6d6d6d" stroke="#222" stroke-width="2"/><rect x="711" y="186" width="14" height="8" fill="#bbb"/><text x="703" y="196" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">1</text><rect x="835" y="186" width="14" height="8" fill="#bbb"/><text x="857" y="196" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">2</text><rect x="711" y="266" width="14" height="8" fill="#bbb"/><text x="703" y="276" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">3</text><rect x="835" y="266" width="14" height="8" fill="#bbb"/><text x="857" y="276" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">4</text><path d="M738.0 190.0 L822.0 190.0" stroke="#ffb347" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M738.0 270.0 L822.0 270.0" stroke="#ffb347" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="660" y="330" font-size="13" font-weight="normal" fill="#222" text-anchor="start">1–2, 3–4는 항상 연결(점선)</text><text x="660" y="356" font-size="13" font-weight="normal" fill="#222" text-anchor="start">누르면 위·아래가 연결</text><text x="660" y="382" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">→ 대각선 1번·4번 다리 사용</text><text x="660" y="408" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 멀티미터 도통 모드로 확인</text><rect x="1020" y="170" width="120" height="70" rx="8" fill="#2f5d8a" stroke="#173552" stroke-width="2"/><circle cx="1080" cy="205" r="26" fill="#d8dde3" stroke="#555" stroke-width="2"/><path d="M1080.0 205.0 L1094.0 186.0" stroke="#333" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1040.0 240.0 L1040.0 290.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1040" y="312" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">1</text><path d="M1080.0 240.0 L1080.0 290.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1080" y="312" font-size="15" font-weight="bold" fill="#178a8a" text-anchor="middle">2</text><path d="M1120.0 240.0 L1120.0 290.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1120" y="312" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">3</text><text x="960" y="340" font-size="13" font-weight="bold" fill="#222" text-anchor="start">1 → 3V3, 3 → GND</text><text x="960" y="366" font-size="13" font-weight="bold" fill="#178a8a" text-anchor="start">2(가운데, 와이퍼) → GPIO34</text><text x="960" y="392" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 양 끝 사이 저항은 항상 10kΩ</text><text x="960" y="418" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 돌리면 와이퍼 위치가 이동</text><text x="960" y="444" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• B형(선형) 권장</text><circle cx="110" cy="620" r="36" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="110" cy="620" r="6" fill="#555" stroke="none" stroke-width="0"/><text x="92" y="606" font-size="16" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><text x="110" y="680" font-size="14" font-weight="bold" fill="#7b4bb3" text-anchor="middle">수동(Passive)</text><text x="110" y="700" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">밑면 기판 보임</text><circle cx="250" cy="620" r="36" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="250" cy="620" r="6" fill="#555" stroke="none" stroke-width="0"/><text x="232" y="606" font-size="16" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><text x="250" y="680" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">능동(Active)</text><text x="250" y="700" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">밑면 밀봉·스티커</text><text x="56" y="740" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 수동: 내부 발진기 없음 → PWM 주파수</text><text x="56" y="764" font-size="13" font-weight="normal" fill="#222" text-anchor="start">  를 넣어야 소리(음높이 조절 가능)</text><text x="56" y="788" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 능동: HIGH만 주면 고정음</text><text x="56" y="812" font-size="13" font-weight="bold" fill="#222" text-anchor="start">• 9주차는 수동 부저 사용</text><text x="56" y="836" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• + 다리 → GPIO27, − → GND</text><text x="56" y="860" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 소비전류 큰 부저 → NPN 구동</text><rect x="370" y="580" width="220" height="150" rx="6" fill="#f4f1e8" stroke="#cfc6ad" stroke-width="2"/><path d="M380.0 596.0 L580.0 596.0" stroke="#2a4fa0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="384" y="612" width="6" height="6" fill="#6b6658"/><rect x="404" y="612" width="6" height="6" fill="#6b6658"/><rect x="424" y="612" width="6" height="6" fill="#6b6658"/><rect x="444" y="612" width="6" height="6" fill="#6b6658"/><rect x="464" y="612" width="6" height="6" fill="#6b6658"/><rect x="484" y="612" width="6" height="6" fill="#6b6658"/><rect x="504" y="612" width="6" height="6" fill="#6b6658"/><rect x="524" y="612" width="6" height="6" fill="#6b6658"/><rect x="544" y="612" width="6" height="6" fill="#6b6658"/><rect x="564" y="612" width="6" height="6" fill="#6b6658"/><rect x="384" y="626" width="6" height="6" fill="#6b6658"/><rect x="404" y="626" width="6" height="6" fill="#6b6658"/><rect x="424" y="626" width="6" height="6" fill="#6b6658"/><rect x="444" y="626" width="6" height="6" fill="#6b6658"/><rect x="464" y="626" width="6" height="6" fill="#6b6658"/><rect x="484" y="626" width="6" height="6" fill="#6b6658"/><rect x="504" y="626" width="6" height="6" fill="#6b6658"/><rect x="524" y="626" width="6" height="6" fill="#6b6658"/><rect x="544" y="626" width="6" height="6" fill="#6b6658"/><rect x="564" y="626" width="6" height="6" fill="#6b6658"/><rect x="384" y="640" width="6" height="6" fill="#6b6658"/><rect x="404" y="640" width="6" height="6" fill="#6b6658"/><rect x="424" y="640" width="6" height="6" fill="#6b6658"/><rect x="444" y="640" width="6" height="6" fill="#6b6658"/><rect x="464" y="640" width="6" height="6" fill="#6b6658"/><rect x="484" y="640" width="6" height="6" fill="#6b6658"/><rect x="504" y="640" width="6" height="6" fill="#6b6658"/><rect x="524" y="640" width="6" height="6" fill="#6b6658"/><rect x="544" y="640" width="6" height="6" fill="#6b6658"/><rect x="564" y="640" width="6" height="6" fill="#6b6658"/><rect x="384" y="654" width="6" height="6" fill="#6b6658"/><rect x="404" y="654" width="6" height="6" fill="#6b6658"/><rect x="424" y="654" width="6" height="6" fill="#6b6658"/><rect x="444" y="654" width="6" height="6" fill="#6b6658"/><rect x="464" y="654" width="6" height="6" fill="#6b6658"/><rect x="484" y="654" width="6" height="6" fill="#6b6658"/><rect x="504" y="654" width="6" height="6" fill="#6b6658"/><rect x="524" y="654" width="6" height="6" fill="#6b6658"/><rect x="544" y="654" width="6" height="6" fill="#6b6658"/><rect x="564" y="654" width="6" height="6" fill="#6b6658"/><rect x="384" y="668" width="6" height="6" fill="#6b6658"/><rect x="404" y="668" width="6" height="6" fill="#6b6658"/><rect x="424" y="668" width="6" height="6" fill="#6b6658"/><rect x="444" y="668" width="6" height="6" fill="#6b6658"/><rect x="464" y="668" width="6" height="6" fill="#6b6658"/><rect x="484" y="668" width="6" height="6" fill="#6b6658"/><rect x="504" y="668" width="6" height="6" fill="#6b6658"/><rect x="524" y="668" width="6" height="6" fill="#6b6658"/><rect x="544" y="668" width="6" height="6" fill="#6b6658"/><rect x="564" y="668" width="6" height="6" fill="#6b6658"/><rect x="422" y="607" width="16" height="72" rx="6" fill="none" stroke="#2e9d57" stroke-width="3"/><rect x="374" y="684" width="212" height="16" rx="0" fill="#e3dccb" stroke="none" stroke-width="0"/><text x="480" y="718" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">(아래쪽 f~j도 같은 구조)</text><text x="356" y="760" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 레일(−/+): 가로로 연결</text><text x="356" y="786" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• a~e, f~j: 세로 5칸씩 연결</text><text x="356" y="812" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 중앙 홈 위·아래는 끊겨 있음</text><text x="356" y="838" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 긴 레일은 가운데가 끊긴 제품도 있음</text><path d="M680.0 600.0 L760.0 600.0" stroke="#2664bf" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="594" width="20" height="12" rx="2" fill="#222" stroke="none" stroke-width="0"/><rect x="760" y="594" width="20" height="12" rx="2" fill="#222" stroke="none" stroke-width="0"/><text x="800" y="606" font-size="13" font-weight="bold" fill="#222" text-anchor="start">M-M</text><path d="M680.0 640.0 L760.0 640.0" stroke="#d43b3b" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="634" width="20" height="12" rx="2" fill="#222" stroke="none" stroke-width="0"/><rect x="760" y="632" width="20" height="16" rx="2" fill="#555" stroke="#222" stroke-width="1"/><text x="800" y="646" font-size="13" font-weight="bold" fill="#222" text-anchor="start">M-F (보드 핀 연결)</text><rect x="680" y="670" width="60" height="30" rx="4" fill="#777" stroke="#333" stroke-width="2"/><path d="M740.0 685.0 L860.0 685.0" stroke="#333" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="720" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Micro-USB '데이터' 케이블</text><text x="656" y="750" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 충전 전용 케이블은 포트가 안 보임</text><text x="656" y="774" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 색 규칙: 빨강=3V3, 검정=GND,</text><text x="656" y="798" font-size="13" font-weight="normal" fill="#222" text-anchor="start">  그 외 색 = 신호선</text><text x="656" y="822" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 장치 관리자에서 COM 포트 확인</text><text x="656" y="846" font-size="13" font-weight="normal" fill="#222" text-anchor="start">  (CP210x/CH340 드라이버)</text><path d="M1030 640 L1030 610 A30 30 0 0 1 1090 610 L1090 640 Z" fill="#222"/><path d="M1042.0 640.0 L1042.0 690.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1042" y="710" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">E</text><path d="M1060.0 640.0 L1060.0 690.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1060" y="710" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">B</text><path d="M1078.0 640.0 L1078.0 690.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1078" y="710" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">C</text><text x="1110" y="630" font-size="12" font-weight="normal" fill="#555" text-anchor="start">평면이 앞</text><text x="956" y="740" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 작은 전류(B)로 큰 전류(C→E) 스위칭</text><text x="956" y="766" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 부저·릴레이·모터 구동 시 사용</text><text x="956" y="792" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 핀 순서는 품번마다 다름(예시 E-B-C)</text><text x="956" y="818" font-size="13" font-weight="normal" fill="#222" text-anchor="start">• 9주차 필수 아님 → 확장 과제</text></svg>