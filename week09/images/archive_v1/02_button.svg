<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="375" viewBox="0 0 1080 375"><rect width="1080" height="375" fill="#f7fafc"/><text x="35" y="55" font-size="30" font-family="Arial" font-weight="bold" fill="#17324b">Example 02 - Button + LED</text><rect x="38" y="95" width="235" height="249" rx="12" fill="#1a658f"/><text x="75" y="120" fill="white" font-size="21" font-family="Arial">ESP32 DevKitC V4</text><rect x="70" y="142" width="172" height="40" rx="5" fill="#fff"/><text x="91" y="169" font-size="21" font-family="Arial">GPIO25</text><path d="M243 162 H375" stroke="#e85b4a" stroke-width="6" fill="none"/><circle cx="375" cy="162" r="6" fill="#e85b4a"/><rect x="384" y="138" width="650" height="52" rx="8" fill="#fff" stroke="#a6b9c7"/><text x="398" y="171" fill="#243746" font-size="19" font-family="Arial">220-330 ohm resistor - LED anode (+)</text><rect x="70" y="217" width="172" height="40" rx="5" fill="#fff"/><text x="91" y="244" font-size="21" font-family="Arial">GND</text><path d="M243 237 H375" stroke="#333333" stroke-width="6" fill="none"/><circle cx="375" cy="237" r="6" fill="#333333"/><rect x="384" y="213" width="650" height="52" rx="8" fill="#fff" stroke="#a6b9c7"/><text x="398" y="246" fill="#243746" font-size="19" font-family="Arial">LED cathode (-), button opposite contact</text><rect x="70" y="292" width="172" height="40" rx="5" fill="#fff"/><text x="91" y="319" font-size="21" font-family="Arial">GPIO18</text><path d="M243 312 H375" stroke="#2d89b3" stroke-width="6" fill="none"/><circle cx="375" cy="312" r="6" fill="#2d89b3"/><rect x="384" y="288" width="650" height="52" rx="8" fill="#fff" stroke="#a6b9c7"/><text x="398" y="321" fill="#243746" font-size="19" font-family="Arial">Button first contact, INPUT_PULLUP</text><text x="40" y="363" font-size="16" font-family="Arial">Only use USB power. Check actual silkscreen and component polarity before wiring.</text></svg>