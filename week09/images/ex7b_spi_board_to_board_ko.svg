<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1130" viewBox="0 0 1240 1130" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="1130" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 7B·7C · SPI 보드 간 통신 — 마스터가 'A'~'Z'를 보내고, 슬레이브가 동시에 응답</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">SPI는 '같은 이름끼리' 연결한다(SS-SS, MOSI-MOSI, MISO-MISO, SCK-SCK). UART처럼 TX/RX를 교차하지 않는다. GND 공통 필수.</text><rect x="40" y="110" width="1160" height="360" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">① Arduino UNO(마스터) ↔ Arduino UNO(슬레이브)</text><rect x="80" y="150" width="250" height="320" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="205.0" y="182" font-size="19" font-weight="bold" fill="white" text-anchor="middle">UNO 마스터 (7B)</text><rect x="308" y="222" width="16" height="16" rx="2" fill="#111"/><text x="300" y="235" font-size="15" font-weight="bold" fill="white" text-anchor="end">D10 SS</text><rect x="308" y="267" width="16" height="16" rx="2" fill="#111"/><text x="300" y="280" font-size="15" font-weight="bold" fill="white" text-anchor="end">D11 MOSI</text><rect x="308" y="312" width="16" height="16" rx="2" fill="#111"/><text x="300" y="325" font-size="15" font-weight="bold" fill="white" text-anchor="end">D12 MISO</text><rect x="308" y="357" width="16" height="16" rx="2" fill="#111"/><text x="300" y="370" font-size="15" font-weight="bold" fill="white" text-anchor="end">D13 SCK</text><rect x="308" y="402" width="16" height="16" rx="2" fill="#111"/><text x="300" y="415" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="870" y="150" width="250" height="320" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="995" y="182" font-size="19" font-weight="bold" fill="white" text-anchor="middle">UNO 슬레이브 (7C)</text><rect x="876" y="222" width="16" height="16" rx="2" fill="#111"/><text x="900" y="235" font-size="15" font-weight="bold" fill="white" text-anchor="start">D10 SS</text><path d="M324.0 230.0 L876.0 230.0" stroke="#c62828" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="876" cy="230" r="4" fill="#c62828" stroke="white" stroke-width="1.5"/><rect x="876" y="267" width="16" height="16" rx="2" fill="#111"/><text x="900" y="280" font-size="15" font-weight="bold" fill="white" text-anchor="start">D11 MOSI</text><path d="M324.0 275.0 L876.0 275.0" stroke="#c06000" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="876" cy="275" r="4" fill="#c06000" stroke="white" stroke-width="1.5"/><rect x="876" y="312" width="16" height="16" rx="2" fill="#111"/><text x="900" y="325" font-size="15" font-weight="bold" fill="white" text-anchor="start">D12 MISO</text><path d="M324.0 320.0 L876.0 320.0" stroke="#2664bf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="876" cy="320" r="4" fill="#2664bf" stroke="white" stroke-width="1.5"/><rect x="876" y="357" width="16" height="16" rx="2" fill="#111"/><text x="900" y="370" font-size="15" font-weight="bold" fill="white" text-anchor="start">D13 SCK</text><path d="M324.0 365.0 L876.0 365.0" stroke="#555" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="876" cy="365" r="4" fill="#555" stroke="white" stroke-width="1.5"/><rect x="876" y="402" width="16" height="16" rx="2" fill="#111"/><text x="900" y="415" font-size="15" font-weight="bold" fill="white" text-anchor="start">GND</text><path d="M324.0 410.0 L876.0 410.0" stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="876" cy="410" r="4" fill="#222" stroke="white" stroke-width="1.5"/><text x="600" y="222" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">SS: 마스터 → 슬레이브 (LOW=선택)</text><text x="600" y="267" font-size="13" font-weight="bold" fill="#c06000" text-anchor="middle">MOSI: 마스터 → 슬레이브 (보낼 글자)</text><text x="600" y="312" font-size="13" font-weight="bold" fill="#2664bf" text-anchor="middle">MISO: 슬레이브 → 마스터 (응답)</text><text x="600" y="357" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">SCK: 마스터가 클럭 생성</text><text x="600" y="445" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">각 보드 USB → PC (시리얼 모니터 2개: IDE 창을 2개 열어 COM 포트를 각각 선택)</text><rect x="40" y="490" width="580" height="400" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="524" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">② ESP32(마스터) → UNO(슬레이브): MISO 분압</text><rect x="70" y="545" width="210" height="290" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="175.0" y="577" font-size="19" font-weight="bold" fill="white" text-anchor="middle">ESP32 (7B)</text><rect x="258" y="607" width="16" height="16" rx="2" fill="#111"/><text x="250" y="620" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO4 SS</text><rect x="258" y="647" width="16" height="16" rx="2" fill="#111"/><text x="250" y="660" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO23 MOSI</text><rect x="258" y="687" width="16" height="16" rx="2" fill="#111"/><text x="250" y="700" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO18 SCK</text><rect x="258" y="727" width="16" height="16" rx="2" fill="#111"/><text x="250" y="740" font-size="15" font-weight="bold" fill="white" text-anchor="end">GPIO19 MISO</text><rect x="258" y="767" width="16" height="16" rx="2" fill="#111"/><text x="250" y="780" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="480" y="545" width="120" height="290" rx="12" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="540" y="575" font-size="17" font-weight="bold" fill="white" text-anchor="middle">UNO</text><rect x="484" y="607" width="16" height="16" rx="2" fill="#111"/><text x="508" y="620" font-size="14" font-weight="bold" fill="white" text-anchor="start">D10</text><rect x="484" y="647" width="16" height="16" rx="2" fill="#111"/><text x="508" y="660" font-size="14" font-weight="bold" fill="white" text-anchor="start">D11</text><rect x="484" y="687" width="16" height="16" rx="2" fill="#111"/><text x="508" y="700" font-size="14" font-weight="bold" fill="white" text-anchor="start">D13</text><rect x="484" y="727" width="16" height="16" rx="2" fill="#111"/><text x="508" y="740" font-size="14" font-weight="bold" fill="white" text-anchor="start">D12</text><rect x="484" y="767" width="16" height="16" rx="2" fill="#111"/><text x="508" y="780" font-size="14" font-weight="bold" fill="white" text-anchor="start">GND</text><path d="M274.0 615.0 L484.0 615.0" stroke="#c62828" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M274.0 655.0 L484.0 655.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M274.0 695.0 L484.0 695.0" stroke="#555" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M274.0 775.0 L484.0 775.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M484.0 735.0 L440.0 735.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="395" y="725" width="45" height="20" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="417" y="721" font-size="12" font-weight="bold" fill="#8a5818" text-anchor="middle">1kΩ</text><path d="M395.0 735.0 L274.0 735.0" stroke="#2664bf" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="350" cy="735" r="5" fill="#2664bf" stroke="none" stroke-width="0"/><rect x="342" y="743" width="16" height="26" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><path d="M350.0 735.0 L350.0 743.0" stroke="#2664bf" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M350.0 769.0 L350.0 775.0" stroke="#222" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="350" cy="775" r="5" fill="#222" stroke="none" stroke-width="0"/><text x="362" y="763" font-size="12" font-weight="bold" fill="#8a5818" text-anchor="start">2kΩ</text><text x="60" y="862" font-size="12" font-weight="normal" fill="#555" text-anchor="start">ESP32→UNO 방향(3.3V)은 UNO가 HIGH로 인식(VIH≈3.0V)하지만 여유가 작다.</text><text x="60" y="880" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">UNO MISO는 5V → ESP32에 직결 금지. 5V×2k/(1k+2k)≈3.3V로 낮춘다(또는 레벨 시프터).</text><rect x="640" y="490" width="560" height="400" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="660" y="524" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">③ SPI = 두 시프트 레지스터의 맞교환</text><rect x="670" y="560" width="200" height="50" rx="6" fill="#fff" stroke="#c06000" stroke-width="2.5"/><text x="770" y="592" font-size="15" font-weight="bold" fill="#c06000" text-anchor="middle">마스터 8비트</text><rect x="980" y="560" width="190" height="50" rx="6" fill="#fff" stroke="#2664bf" stroke-width="2.5"/><text x="1075" y="592" font-size="15" font-weight="bold" fill="#2664bf" text-anchor="middle">슬레이브 SPDR</text><path d="M870.0 575.0 L978.0 575.0" stroke="#c06000" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M978.0 575.0 L966.9 579.7 L966.9 570.3 Z" fill="#c06000"/><text x="924" y="568" font-size="12" font-weight="bold" fill="#c06000" text-anchor="middle">MOSI</text><path d="M980.0 598.0 L872.0 598.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M872.0 598.0 L883.1 593.3 L883.1 602.7 Z" fill="#2664bf"/><text x="924" y="622" font-size="12" font-weight="bold" fill="#2664bf" text-anchor="middle">MISO</text><text x="670" y="652" font-size="14" font-weight="bold" fill="#333" text-anchor="start">SCK 8번 → 두 레지스터 내용이 서로 바뀐다</text><text x="690" y="700" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="start">전송</text><text x="840" y="700" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">MOSI(보냄)</text><text x="990" y="700" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="start">MISO(받음)</text><text x="690" y="732" font-size="14" font-weight="normal" fill="#1d2433" text-anchor="start">1</text><text x="840" y="732" font-size="14" font-weight="normal" fill="#c06000" text-anchor="start">'A'</text><text x="990" y="732" font-size="14" font-weight="normal" fill="#2664bf" text-anchor="start">'-' (초기값)</text><text x="690" y="764" font-size="14" font-weight="normal" fill="#1d2433" text-anchor="start">2</text><text x="840" y="764" font-size="14" font-weight="normal" fill="#c06000" text-anchor="start">'B'</text><text x="990" y="764" font-size="14" font-weight="normal" fill="#2664bf" text-anchor="start">'a' (A의 응답)</text><text x="690" y="796" font-size="14" font-weight="normal" fill="#1d2433" text-anchor="start">3</text><text x="840" y="796" font-size="14" font-weight="normal" fill="#c06000" text-anchor="start">'C'</text><text x="990" y="796" font-size="14" font-weight="normal" fill="#2664bf" text-anchor="start">'b'</text><text x="690" y="828" font-size="14" font-weight="normal" fill="#1d2433" text-anchor="start">…</text><text x="840" y="828" font-size="14" font-weight="normal" fill="#c06000" text-anchor="start">…</text><text x="990" y="828" font-size="14" font-weight="normal" fill="#2664bf" text-anchor="start">…</text><text x="670" y="868" font-size="13" font-weight="normal" fill="#555" text-anchor="start">응답은 한 박자 늦다: 슬레이브는 받은 '뒤'에야 다음 응답을 준비</text><rect x="40" y="910" width="1160" height="200" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="944" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">④ 코드 흐름</text><text x="70" y="965" font-size="14" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">[마스터 7B]</text><text x="70" y="999" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">SPI.beginTransaction(1MHz, 모드0)</text><text x="70" y="1033" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">digitalWrite(SS, LOW)   ← 슬레이브 선택</text><text x="70" y="1067" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">reply = SPI.transfer('A')   ← 보내며 받기</text><text x="70" y="1101" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">digitalWrite(SS, HIGH)  ← 선택 해제</text><text x="620" y="965" font-size="14" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">[슬레이브 7C, UNO 레지스터]</text><text x="620" y="999" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">pinMode(MISO, OUTPUT); SPCR |= _BV(SPE);  ← 슬레이브 모드</text><text x="620" y="1033" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">SPI.attachInterrupt();  ← SPIE=1</text><text x="620" y="1067" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">ISR(SPI_STC_vect){ b = SPDR; SPDR = 응답; flag=true; }</text><text x="620" y="1101" font-size="14" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">loop(): flag면 Serial.print (ISR 안에서 출력 금지)</text></svg>