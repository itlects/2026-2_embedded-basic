<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="800" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">ADC 원리 — 가변저항 전압을 0~4095 정수로</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">ADC(Analog-to-Digital Converter)는 핀 전압을 일정 간격으로 잘라(양자화) 숫자로 바꾼다. ESP32 기본 12비트 → 4096단계.</text><rect x="40" y="110" width="360" height="650" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#2f5d8a" text-anchor="start">① 가변저항 = 전압 분배기</text><text x="110" y="180" font-size="16" font-weight="bold" fill="#d43b3b" text-anchor="start">3V3</text><path d="M130.0 188.0 L130.0 210.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="116" y="210" width="28" height="230" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="106" y="300" font-size="15" font-weight="bold" fill="#8a5818" text-anchor="end">R1</text><text x="106" y="390" font-size="15" font-weight="bold" fill="#8a5818" text-anchor="end">R2</text><path d="M220.0 330.0 L146.0 330.0" stroke="#178a8a" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M146.0 330.0 L157.1 325.3 L157.1 334.7 Z" fill="#178a8a"/><text x="226" y="326" font-size="14" font-weight="bold" fill="#178a8a" text-anchor="start">와이퍼</text><text x="226" y="348" font-size="14" font-weight="bold" fill="#178a8a" text-anchor="start">→ GPIO34</text><path d="M130.0 440.0 L130.0 470.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M130.0 470.0 L130.0 480.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M116.0 480.0 L144.0 480.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M121.0 486.0 L139.0 486.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M126.0 492.0 L134.0 492.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="545" font-size="16" font-weight="bold" fill="#1d2433" text-anchor="start">Vout = 3.3V × R2 / (R1 + R2)</text><text x="70" y="580" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 손잡이를 돌리면 R1·R2 비율이 바뀐다</text><text x="70" y="606" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 전체 10kΩ: 3.3V/10kΩ = 0.33mA</text><text x="70" y="632" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">• 가운데 단자를 3V3·GND에 직접</text><text x="70" y="656" font-size="14" font-weight="bold" fill="#c06000" text-anchor="start">  꽂지 않는다(끝까지 돌리면 단락)</text><text x="70" y="690" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 측정은 ADC1(GPIO32~39) 사용:</text><text x="70" y="714" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  ADC2는 Wi-Fi 사용 중 충돌</text><rect x="420" y="110" width="380" height="650" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="440" y="144" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">② 양자화 (예: 3비트)</text><path d="M480.0 170.0 L480.0 470.0 L770.0 470.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M480.0 470.0 L516.2 470.0 L516.2 429.3 L552.5 429.3 L552.5 388.6 L588.8 388.6 L588.8 347.9 L625.0 347.9 L625.0 307.1 L661.2 307.1 L661.2 266.4 L697.5 266.4 L697.5 225.7 L733.8 225.7 L733.8 185.0 L770.0 185.0" stroke="#2664bf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M480.0 470.0 L770.0 185.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="625.0" y="500" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">입력 전압 →</text><text x="470" y="180" font-size="13" font-weight="normal" fill="#444" text-anchor="end">코드</text><text x="470" y="470" font-size="13" font-weight="normal" fill="#444" text-anchor="end">0</text><text x="470" y="194" font-size="13" font-weight="normal" fill="#444" text-anchor="end">7</text><text x="450" y="540" font-size="16" font-weight="bold" fill="#1d2433" text-anchor="start">n비트 → 2ⁿ 단계, 최댓값 2ⁿ − 1</text><text x="450" y="576" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• UNO: 10비트 → 0~1023</text><text x="450" y="604" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• ESP32: 12비트 → 0~4095</text><text x="450" y="632" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 1단계 ≈ 3.3V / 4095 ≈ 0.8mV (이상적)</text><text x="450" y="660" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• analogReadResolution(12) 기본값</text><text x="450" y="688" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 빨간 점선 = 이상적인 직선, 파란 계단 = ADC</text><rect x="820" y="110" width="380" height="650" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="840" y="144" font-size="20" font-weight="bold" fill="#c06000" text-anchor="start">③ ESP32 실제 응답 (11dB)</text><path d="M880.0 170.0 L880.0 470.0 L1170.0 470.0" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M880.0 470.0 L1170.0 170.0" stroke="#c62828" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M880.0 470.0 L893.2 470.0 L923.9 439.2 L1011.8 348.4 L1099.7 253.9 L1134.8 202.6 L1152.4 170.0 L1170.0 170.0" stroke="#c06000" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="880.0" y="170" width="13.18181818181813" height="300" rx="0" fill="#ffe2c4" stroke="none" stroke-width="0" fill-opacity="0.7"/><rect x="1152.4242424242425" y="170" width="17.575757575757507" height="300" rx="0" fill="#ffe2c4" stroke="none" stroke-width="0" fill-opacity="0.7"/><text x="884.0" y="492" font-size="12" font-weight="normal" fill="#c06000" text-anchor="start">0.15V</text><text x="1134.4242424242425" y="492" font-size="12" font-weight="normal" fill="#c06000" text-anchor="start">3.1V</text><text x="1025.0" y="516" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">입력 전압(V) →</text><text x="872" y="180" font-size="12" font-weight="normal" fill="#444" text-anchor="end">4095</text><text x="890" y="200" font-size="12" font-weight="normal" fill="#888" text-anchor="start" font-style="italic">개념도(실측 아님)</text><text x="850" y="560" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 11dB 감쇠: 측정 범위 약 0.15~3.1V</text><text x="850" y="588" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  양 끝은 0 또는 4095로 '붙는다'</text><text x="850" y="616" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 중간 구간도 완전한 직선이 아니다</text><text x="850" y="644" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• 전압이 필요하면 보정값 사용:</text><text x="850" y="672" font-size="14" font-weight="bold" fill="#222" text-anchor="start">  analogReadMilliVolts(34) → mV</text><text x="850" y="700" font-size="14" font-weight="normal" fill="#222" text-anchor="start">• analogRead 값은 '상대적 크기'로 쓴다</text></svg>