<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="760" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">GPIO 원리 — 디지털 출력(LED)과 디지털 입력(버튼 · 풀업)</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">GPIO 하나는 코드(pinMode)로 출력 또는 입력이 된다. 출력은 핀 전압을 3.3V/0V로 만들고, 입력은 핀 전압이 HIGH인지 LOW인지 읽는다.</text><rect x="40" y="110" width="560" height="610" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#d43b3b" text-anchor="start">① 출력: digitalWrite(25, HIGH)</text><rect x="70" y="180" width="120" height="70" rx="8" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="130" y="222" font-size="17" font-weight="bold" fill="white" text-anchor="middle">GPIO25</text><text x="130" y="270" font-size="14" font-weight="bold" fill="#d43b3b" text-anchor="middle">HIGH = 3.3V</text><path d="M190.0 215.0 L260.0 215.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="260.0" y="203" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="305.0" y="221" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220Ω</text><path d="M350.0 215.0 L400.0 215.0" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 199 L400 231 L432 215 Z" fill="#d43b3b" stroke="#222" stroke-width="2"/><path d="M432.0 199.0 L432.0 231.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M412.0 193.0 L424.0 181.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M422.0 195.0 L434.0 183.0" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="392" y="197" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="444" y="199" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><path d="M432.0 215.0 L500.0 215.0 L500.0 250.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M500.0 250.0 L500.0 260.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M486.0 260.0 L514.0 260.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M491.0 266.0 L509.0 266.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M496.0 272.0 L504.0 272.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 180.0 L420.0 180.0" stroke="#c62828" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M420.0 180.0 L408.9 184.7 L408.9 175.3 Z" fill="#c62828"/><text x="335" y="170" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">전류 I</text><text x="70" y="316" font-size="18" font-weight="bold" fill="#1d2433" text-anchor="start">I = (3.3V − Vf) ÷ R</text><rect x="66" y="322" width="512" height="32" rx="4" fill="#eef2f7" stroke="none" stroke-width="0"/><text x="80" y="344" font-size="14" font-weight="bold" fill="#222" text-anchor="start">LED 색</text><text x="208" y="344" font-size="14" font-weight="bold" fill="#222" text-anchor="start">Vf(대략)</text><text x="336" y="344" font-size="14" font-weight="bold" fill="#222" text-anchor="start">220Ω 전류</text><text x="464" y="344" font-size="14" font-weight="bold" fill="#222" text-anchor="start">330Ω 전류</text><text x="80" y="378" font-size="14" font-weight="normal" fill="#222" text-anchor="start">빨강·노랑</text><text x="208" y="378" font-size="14" font-weight="normal" fill="#222" text-anchor="start">1.8~2.1V</text><text x="336" y="378" font-size="14" font-weight="normal" fill="#222" text-anchor="start">≈ 6mA</text><text x="464" y="378" font-size="14" font-weight="normal" fill="#222" text-anchor="start">≈ 4mA</text><text x="80" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">초록(일반)</text><text x="208" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">2.0~2.2V</text><text x="336" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">≈ 5mA</text><text x="464" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start">≈ 3.5mA</text><text x="80" y="446" font-size="14" font-weight="normal" fill="#222" text-anchor="start">파랑·흰색</text><text x="208" y="446" font-size="14" font-weight="normal" fill="#222" text-anchor="start">2.8~3.2V</text><text x="336" y="446" font-size="14" font-weight="normal" fill="#222" text-anchor="start">≈ 0.5~2mA</text><text x="464" y="446" font-size="14" font-weight="normal" fill="#222" text-anchor="start">매우 어두움</text><text x="70" y="510" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 3.3V 보드에서는 빨강·노랑·초록 LED를 권장한다.</text><text x="70" y="538" font-size="15" font-weight="normal" fill="#222" text-anchor="start">  파랑/흰 LED는 Vf가 3V 근처라 거의 켜지지 않을 수 있다.</text><text x="70" y="572" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 저항이 없으면 전류가 GPIO 한계(수십 mA)까지 흘러</text><text x="70" y="600" font-size="15" font-weight="normal" fill="#222" text-anchor="start">  LED·GPIO가 손상될 수 있다. LED 1개당 저항 1개.</text><text x="70" y="640" font-size="15" font-weight="bold" fill="#333" text-anchor="start">• digitalWrite(25, LOW) → 0V → 전류 0 → LED 꺼짐</text><text x="70" y="674" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 권장: 핀당 10mA 이하로 설계 (구동 세기 기본값 기준)</text><rect x="630" y="110" width="570" height="610" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="650" y="144" font-size="20" font-weight="bold" fill="#2664bf" text-anchor="start">② 입력: pinMode(18, INPUT_PULLUP)</text><text x="660" y="180" font-size="16" font-weight="bold" fill="#208657" text-anchor="start">버튼 놓음 → HIGH (1)</text><text x="670" y="220" font-size="14" font-weight="bold" fill="#d43b3b" text-anchor="start">3.3V</text><path d="M690.0 226.0 L690.0 240.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M690.0 240.0 L690.0 251.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M690.0 319.0 L690.0 330.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="679" y="251.0" width="22" height="68" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="708" y="290.0" font-size="14" font-weight="normal" fill="#333" text-anchor="start">내부 풀업 ≈45kΩ</text><path d="M690.0 330.0 L690.0 350.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690" cy="350" r="5" fill="#333" stroke="none" stroke-width="0"/><path d="M690.0 350.0 L810.0 350.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="810" y="340" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="start">GPIO18 읽기</text><text x="810" y="368" font-size="16" font-weight="bold" fill="#208657" text-anchor="start">= HIGH</text><path d="M690.0 350.0 L690.0 375.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M690.0 375.0 L712.0 415.0" stroke="#333" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690" cy="375" r="5" fill="#333" stroke="none" stroke-width="0"/><circle cx="690" cy="425" r="5" fill="#333" stroke="none" stroke-width="0"/><text x="722" y="405" font-size="14" font-weight="normal" fill="#555" text-anchor="start">버튼</text><path d="M690.0 425.0 L690.0 440.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M690.0 440.0 L690.0 450.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M676.0 450.0 L704.0 450.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M681.0 456.0 L699.0 456.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M686.0 462.0 L694.0 462.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="930" y="180" font-size="16" font-weight="bold" fill="#c62828" text-anchor="start">버튼 누름 → LOW (0)</text><text x="940" y="220" font-size="14" font-weight="bold" fill="#d43b3b" text-anchor="start">3.3V</text><path d="M960.0 226.0 L960.0 240.0" stroke="#d43b3b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.0 240.0 L960.0 251.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.0 319.0 L960.0 330.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="949" y="251.0" width="22" height="68" rx="3" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="978" y="290.0" font-size="14" font-weight="normal" fill="#333" text-anchor="start">내부 풀업 ≈45kΩ</text><path d="M960.0 330.0 L960.0 350.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="960" cy="350" r="5" fill="#333" stroke="none" stroke-width="0"/><path d="M960.0 350.0 L1080.0 350.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1080" y="340" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="start">GPIO18 읽기</text><text x="1080" y="368" font-size="16" font-weight="bold" fill="#c62828" text-anchor="start">= LOW</text><path d="M960.0 350.0 L960.0 375.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.0 375.0 L960.0 425.0" stroke="#333" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="960" cy="375" r="5" fill="#333" stroke="none" stroke-width="0"/><circle cx="960" cy="425" r="5" fill="#333" stroke="none" stroke-width="0"/><text x="992" y="405" font-size="14" font-weight="normal" fill="#555" text-anchor="start">버튼</text><path d="M960.0 425.0 L960.0 440.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.0 440.0 L960.0 450.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M946.0 450.0 L974.0 450.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M951.0 456.0 L969.0 456.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M956.0 462.0 L964.0 462.0" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0 250.0 L920.0 440.0" stroke="#c62828" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0 440.0 L915.3 428.9 L924.7 428.9 Z" fill="#c62828"/><text x="912" y="480" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">≈73µA만 흐름</text><text x="660" y="530" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 풀업 저항이 핀을 3.3V 쪽으로 '당겨' 두므로 평소 HIGH.</text><text x="660" y="560" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• 버튼이 GND와 연결되면 LOW → 코드: digitalRead(18) == LOW</text><text x="660" y="594" font-size="15" font-weight="bold" fill="#c06000" text-anchor="start">• 풀업이 없으면(INPUT) 핀이 떠서(floating) 손만 대도</text><text x="660" y="622" font-size="15" font-weight="bold" fill="#c06000" text-anchor="start">  HIGH/LOW가 무작위로 바뀐다.</text><text x="660" y="656" font-size="15" font-weight="normal" fill="#222" text-anchor="start">• GPIO34~39는 내부 풀업이 없다 → 버튼에 쓰려면 외부 10kΩ.</text><text x="660" y="690" font-size="15" font-weight="normal" fill="#555" text-anchor="start">  (9주차 버튼은 GPIO18·19 사용)</text></svg>