<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="870" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">UART를 멀리 보내기 — TTL · RS-232 · RS-485, 그리고 CAN · 방식 선택 기준</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">UART는 '데이터 형식(프레임)'이고, RS-232·RS-485는 그 신호를 멀리 보내는 '전기 규격(물리 계층)'이다. CAN은 차동 2선 위의 메시지 버스.</text><rect x="40" y="110" width="560" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">① 단일 종단(Single-ended) vs 차동(Differential)</text><text x="70" y="175" font-size="14" font-weight="bold" fill="#2664bf" text-anchor="start">단일 종단(TTL UART, RS-232): 신호 − GND</text><path d="M80.0 197.0 L87.0 203.3 L94.0 206.0 L101.0 203.5 L108.0 197.3 L115.0 190.9 L122.0 188.0 L129.0 190.3 L136.0 242.5 L143.0 248.9 L150.0 252.0 L157.0 249.9 L164.0 243.8 L171.0 237.3 L178.0 234.1 L185.0 236.0 L192.0 195.9 L199.0 202.5 L206.0 205.9 L213.0 204.2 L220.0 198.4 L227.0 191.7 L234.0 188.1 L241.0 189.6 L248.0 195.4 L255.0 202.0 L262.0 205.8 L269.0 204.5 L276.0 198.9 L283.0 192.2 L290.0 188.2 L297.0 189.3 L304.0 240.8 L311.0 247.6 L318.0 251.7 L325.0 250.8 L332.0 245.4 L339.0 238.7 L346.0 234.4 L353.0 235.1 L360.0 194.3 L367.0 201.1 L374.0 205.5 L381.0 205.1 L388.0 200.0 L395.0 193.1 L402.0 188.5 L409.0 188.8 L416.0 239.8 L423.0 246.6 L430.0 251.4 L437.0 251.3 L444.0 246.5 L451.0 239.6 L458.0 234.8 L465.0 234.6 L472.0 239.3 L479.0 246.1 L486.0 251.1 L493.0 251.5 L500.0 247.0 L507.0 240.2 L514.0 235.0 L521.0 234.4" stroke="#2664bf" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="70" y="270" font-size="13" font-weight="normal" fill="#555" text-anchor="start">→ 잡음이 그대로 신호에 더해진다</text><text x="70" y="305" font-size="14" font-weight="bold" fill="#208657" text-anchor="start">차동(RS-485, CAN): A − B 두 선의 차이</text><path d="M80.0 322.0 L87.0 328.3 L94.0 331.0 L101.0 328.5 L108.0 322.3 L115.0 315.9 L122.0 313.0 L129.0 315.3 L136.0 367.5 L143.0 373.9 L150.0 377.0 L157.0 374.9 L164.0 368.8 L171.0 362.3 L178.0 359.1 L185.0 361.0 L192.0 320.9 L199.0 327.5 L206.0 330.9 L213.0 329.2 L220.0 323.4 L227.0 316.7 L234.0 313.1 L241.0 314.6 L248.0 320.4 L255.0 327.0 L262.0 330.8 L269.0 329.5 L276.0 323.9 L283.0 317.2 L290.0 313.2 L297.0 314.3 L304.0 365.8 L311.0 372.6 L318.0 376.7 L325.0 375.8 L332.0 370.4 L339.0 363.7 L346.0 359.4 L353.0 360.1 L360.0 319.3 L367.0 326.1 L374.0 330.5 L381.0 330.1 L388.0 325.0 L395.0 318.1 L402.0 313.5 L409.0 313.8 L416.0 364.8 L423.0 371.6 L430.0 376.4 L437.0 376.3 L444.0 371.5 L451.0 364.6 L458.0 359.8 L465.0 359.6 L472.0 364.3 L479.0 371.1 L486.0 376.1 L493.0 376.5 L500.0 372.0 L507.0 365.2 L514.0 360.0 L521.0 359.4" stroke="#208657" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><path d="M80.0 368.0 L87.0 374.3 L94.0 377.0 L101.0 374.5 L108.0 368.3 L115.0 361.9 L122.0 359.0 L129.0 361.3 L136.0 321.5 L143.0 327.9 L150.0 331.0 L157.0 328.9 L164.0 322.8 L171.0 316.3 L178.0 313.1 L185.0 315.0 L192.0 366.9 L199.0 373.5 L206.0 376.9 L213.0 375.2 L220.0 369.4 L227.0 362.7 L234.0 359.1 L241.0 360.6 L248.0 366.4 L255.0 373.0 L262.0 376.8 L269.0 375.5 L276.0 369.9 L283.0 363.2 L290.0 359.2 L297.0 360.3 L304.0 319.8 L311.0 326.6 L318.0 330.7 L325.0 329.8 L332.0 324.4 L339.0 317.7 L346.0 313.4 L353.0 314.1 L360.0 365.3 L367.0 372.1 L374.0 376.5 L381.0 376.1 L388.0 371.0 L395.0 364.1 L402.0 359.5 L409.0 359.8 L416.0 318.8 L423.0 325.6 L430.0 330.4 L437.0 330.3 L444.0 325.5 L451.0 318.6 L458.0 313.8 L465.0 313.6 L472.0 318.3 L479.0 325.1 L486.0 330.1 L493.0 330.5 L500.0 326.0 L507.0 319.2 L514.0 314.0 L521.0 313.4" stroke="#c06000" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="butt"/><text x="70" y="405" font-size="13" font-weight="normal" fill="#555" text-anchor="start">→ 두 선에 같은 잡음이 들어와도 A−B에서 상쇄(공통 모드 제거)</text><text x="70" y="428" font-size="13" font-weight="normal" fill="#555" text-anchor="start">   꼬임선(Twisted pair) + 양 끝 120Ω 종단 저항</text><rect x="620" y="110" width="580" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="640" y="144" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">② 물리 계층 비교</text><rect x="632" y="148" width="560" height="30" rx="4" fill="#eef2f7" stroke="none" stroke-width="0"/><text x="640" y="170" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start"></text><text x="700" y="170" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">TTL UART</text><text x="820" y="170" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">RS-232</text><text x="940" y="170" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">RS-485</text><text x="1070" y="170" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">CAN</text><text x="640" y="208" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">신호</text><text x="700" y="208" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">0/3.3V·5V</text><text x="820" y="208" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">±3~15V 역논리</text><text x="940" y="208" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">차동 A/B</text><text x="1070" y="208" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">차동 H/L</text><text x="640" y="246" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">구조</text><text x="700" y="246" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">1:1</text><text x="820" y="246" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">1:1</text><text x="940" y="246" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">다중(32대)</text><text x="1070" y="246" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">다중 마스터</text><text x="640" y="284" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">거리</text><text x="700" y="284" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">수 m</text><text x="820" y="284" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">약 15m</text><text x="940" y="284" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">약 1200m</text><text x="1070" y="284" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">40m@1M</text><text x="640" y="322" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">속도</text><text x="700" y="322" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">~Mbps</text><text x="820" y="322" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">~115kbps</text><text x="940" y="322" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">~10Mbps(단거리)</text><text x="1070" y="322" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">1M(FD 8M)</text><text x="640" y="360" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">칩</text><text x="700" y="360" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">직결</text><text x="820" y="360" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">MAX3232</text><text x="940" y="360" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">MAX485</text><text x="1070" y="360" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">SN65HVD230</text><text x="640" y="398" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="start">용도</text><text x="700" y="398" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">센서·디버그</text><text x="820" y="398" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">PLC·구형 장비</text><text x="940" y="398" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">Modbus·산업</text><text x="1070" y="398" font-size="13" font-weight="normal" fill="#1d2433" text-anchor="start">자동차·로봇</text><text x="640" y="432" font-size="12" font-weight="normal" fill="#555" text-anchor="start">ESP32: UART2+MAX3485(RS-485), 내장 TWAI+트랜시버(CAN)</text><rect x="40" y="460" width="1160" height="380" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="494" font-size="20" font-weight="bold" fill="#1d2433" text-anchor="start">③ 어떤 방식을 고를까 — 정답은 '데이터시트가 지원하는 것' + 아래 기준</text><rect x="70" y="526" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="552" font-size="15" font-weight="normal" fill="#222" text-anchor="start">속도가 최우선(화면·SD·고속 ADC)</text><path d="M640.0 546.0 L700.0 546.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 546.0 L688.9 550.7 L688.9 541.3 Z" fill="#333"/><rect x="710" y="526" width="130" height="40" rx="8" fill="#c06000" stroke="none" stroke-width="0"/><text x="775" y="552" font-size="16" font-weight="bold" fill="white" text-anchor="middle">SPI</text><rect x="70" y="576" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="602" font-size="15" font-weight="normal" fill="#222" text-anchor="start">핀을 아끼며 저속 센서 여러 개</text><path d="M640.0 596.0 L700.0 596.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 596.0 L688.9 600.7 L688.9 591.3 Z" fill="#333"/><rect x="710" y="576" width="130" height="40" rx="8" fill="#208657" stroke="none" stroke-width="0"/><text x="775" y="602" font-size="16" font-weight="bold" fill="white" text-anchor="middle">I2C</text><rect x="70" y="626" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="652" font-size="15" font-weight="normal" fill="#222" text-anchor="start">PC·모듈과 1:1, 디버그 출력</text><path d="M640.0 646.0 L700.0 646.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 646.0 L688.9 650.7 L688.9 641.3 Z" fill="#333"/><rect x="710" y="626" width="130" height="40" rx="8" fill="#2664bf" stroke="none" stroke-width="0"/><text x="775" y="652" font-size="16" font-weight="bold" fill="white" text-anchor="middle">UART</text><rect x="70" y="676" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="702" font-size="15" font-weight="normal" fill="#222" text-anchor="start">센서 여러 개를 긴 선 하나로(온도)</text><path d="M640.0 696.0 L700.0 696.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 696.0 L688.9 700.7 L688.9 691.3 Z" fill="#333"/><rect x="710" y="676" width="130" height="40" rx="8" fill="#7b4bb3" stroke="none" stroke-width="0"/><text x="775" y="702" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1-Wire</text><rect x="70" y="726" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="752" font-size="15" font-weight="normal" fill="#222" text-anchor="start">수십~수백 m, 산업 현장 다수 장치</text><path d="M640.0 746.0 L700.0 746.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 746.0 L688.9 750.7 L688.9 741.3 Z" fill="#333"/><rect x="710" y="726" width="130" height="40" rx="8" fill="#555" stroke="none" stroke-width="0"/><text x="775" y="752" font-size="16" font-weight="bold" fill="white" text-anchor="middle">RS-485</text><rect x="70" y="776" width="560" height="40" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/><text x="90" y="802" font-size="15" font-weight="normal" fill="#222" text-anchor="start">실시간·고신뢰 다중 노드(차량)</text><path d="M640.0 796.0 L700.0 796.0" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700.0 796.0 L688.9 800.7 L688.9 791.3 Z" fill="#333"/><rect x="710" y="776" width="130" height="40" rx="8" fill="#555" stroke="none" stroke-width="0"/><text x="775" y="802" font-size="16" font-weight="bold" fill="white" text-anchor="middle">CAN</text><text x="880" y="552" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• 실제 제품은 여러 방식을 섞어 쓴다</text><text x="880" y="582" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  (예: I2C 센서 + SPI 화면 + UART GPS)</text><text x="880" y="612" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• I2C로 큰 화면을 빠르게 갱신하려다</text><text x="880" y="642" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  속도 한계로 실패하는 경우가 흔하다</text><text x="880" y="672" font-size="14" font-weight="bold" fill="#222" text-anchor="start">• 거리가 늘면 속도를 낮추거나</text><text x="880" y="702" font-size="14" font-weight="normal" fill="#222" text-anchor="start">  차동 규격으로 바꾼다</text></svg>