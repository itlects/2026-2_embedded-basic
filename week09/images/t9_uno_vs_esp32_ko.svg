<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="700" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">Arduino UNO R3 → ESP32-DevKitC V4: 바뀌는 것</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">코드 문법(setup/loop, digitalWrite…)은 거의 같다. 바뀌는 것은 전압 · 핀 번호 · ADC 범위 · PWM 방식이다.</text><rect x="30" y="100" width="1180" height="50" rx="4" fill="#eef2f7" stroke="#dde2ea" stroke-width="1"/><text x="46" y="132" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">항목</text><text x="226" y="132" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">Arduino UNO R3</text><text x="526" y="132" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">ESP32-DevKitC V4</text><text x="866" y="132" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">실습에서 주의</text><rect x="30" y="154" width="1180" height="50" rx="4" fill="#ffffff" stroke="#dde2ea" stroke-width="1"/><text x="46" y="186" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">MCU / 클럭</text><text x="226" y="186" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">ATmega328P 8비트 16MHz</text><text x="526" y="186" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">ESP32 32비트 듀얼코어 최대 240MHz</text><text x="866" y="186" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">millis 기반 코드는 그대로</text><rect x="30" y="208" width="1180" height="50" rx="4" fill="#f8f9fb" stroke="#dde2ea" stroke-width="1"/><text x="46" y="240" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">메모리</text><text x="226" y="240" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">플래시 32KB · SRAM 2KB</text><text x="526" y="240" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">플래시 4MB(모듈) · SRAM 520KB</text><text x="866" y="240" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">큰 배열·문자열 여유</text><rect x="30" y="262" width="1180" height="50" rx="4" fill="#ffffff" stroke="#dde2ea" stroke-width="1"/><text x="46" y="294" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">논리 전압</text><text x="226" y="294" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">5V</text><text x="526" y="294" font-size="15" font-weight="normal" fill="#a40000" text-anchor="start">3.3V (5V 인가 금지)</text><text x="866" y="294" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">UNO 회로를 그대로 옮기지 않는다</text><rect x="30" y="316" width="1180" height="50" rx="4" fill="#f8f9fb" stroke="#dde2ea" stroke-width="1"/><text x="46" y="348" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">핀 이름</text><text x="226" y="348" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">D2, A0 … 보드 숫자</text><text x="526" y="348" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">IO18 → 코드 18 (GPIO 번호)</text><text x="866" y="348" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">J2/J3 순번과 다름</text><rect x="30" y="370" width="1180" height="50" rx="4" fill="#ffffff" stroke="#dde2ea" stroke-width="1"/><text x="46" y="402" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">ADC</text><text x="226" y="402" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">10비트 0~1023 · A0~A5</text><text x="526" y="402" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">12비트 0~4095 · ADC1/ADC2</text><text x="866" y="402" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">map 범위 4095로 수정</text><rect x="30" y="424" width="1180" height="50" rx="4" fill="#f8f9fb" stroke="#dde2ea" stroke-width="1"/><text x="46" y="456" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">PWM</text><text x="226" y="456" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">D3,5,6,9,10,11 고정</text><text x="526" y="456" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">LEDC: 출력 가능한 거의 모든 GPIO</text><text x="866" y="456" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">analogWrite / ledcAttach</text><rect x="30" y="478" width="1180" height="50" rx="4" fill="#ffffff" stroke="#dde2ea" stroke-width="1"/><text x="46" y="510" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">입력 전용 핀</text><text x="226" y="510" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">없음</text><text x="526" y="510" font-size="15" font-weight="normal" fill="#a40000" text-anchor="start">GPIO34~39 (풀업 없음)</text><text x="866" y="510" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">출력·버튼(풀업) 불가</text><rect x="30" y="532" width="1180" height="50" rx="4" fill="#f8f9fb" stroke="#dde2ea" stroke-width="1"/><text x="46" y="564" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">무선 통신</text><text x="226" y="564" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">없음(외장 모듈)</text><text x="526" y="564" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">Wi-Fi · Bluetooth 내장</text><text x="866" y="564" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">Wi-Fi 사용 시 ADC2 불가</text><rect x="30" y="586" width="1180" height="50" rx="4" fill="#ffffff" stroke="#dde2ea" stroke-width="1"/><text x="46" y="618" font-size="15" font-weight="bold" fill="#1d2433" text-anchor="start">업로드</text><text x="226" y="618" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">USB-시리얼 → 자동</text><text x="526" y="618" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">USB-UART → 자동(안 되면 BOOT 누름)</text><text x="866" y="618" font-size="15" font-weight="normal" fill="#1d2433" text-anchor="start">보드 'ESP32 Dev Module'</text></svg>