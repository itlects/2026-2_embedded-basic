<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="910" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">전원 연결과 배선 안전 — 전원을 켜기 전에</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">공식 문서: 전원은 ① Micro-USB(기본) ② 5V+GND 핀 ③ 3V3+GND 핀 중 '오직 하나'만 사용한다. 동시에 쓰면 보드·전원이 손상될 수 있다.</text><rect x="40" y="110" width="1160" height="230" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="144" font-size="18" font-weight="bold" fill="#222" text-anchor="start">보드 내부 전원 경로</text><rect x="70" y="180" width="200" height="70" rx="10" fill="#fff" stroke="#a40000" stroke-width="3"/><text x="170" y="222" font-size="16" font-weight="bold" fill="#a40000" text-anchor="middle">PC USB 5V</text><rect x="330" y="180" width="200" height="70" rx="10" fill="#fff" stroke="#a40000" stroke-width="3"/><text x="430" y="222" font-size="16" font-weight="bold" fill="#a40000" text-anchor="middle">보드 5V 라인</text><rect x="590" y="180" width="200" height="70" rx="10" fill="#fff" stroke="#555" stroke-width="3"/><text x="690" y="222" font-size="16" font-weight="bold" fill="#555" text-anchor="middle">3.3V LDO 레귤레이터</text><rect x="850" y="180" width="200" height="70" rx="10" fill="#fff" stroke="#d43b3b" stroke-width="3"/><text x="950" y="222" font-size="16" font-weight="bold" fill="#d43b3b" text-anchor="middle">3V3 라인</text><path d="M274.0 215.0 L326.0 215.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M326.0 215.0 L314.9 219.7 L314.9 210.3 Z" fill="#333"/><path d="M534.0 215.0 L586.0 215.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M586.0 215.0 L574.9 219.7 L574.9 210.3 Z" fill="#333"/><path d="M794.0 215.0 L846.0 215.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M846.0 215.0 L834.9 219.7 L834.9 210.3 Z" fill="#333"/><rect x="1080" y="180" width="100" height="70" rx="10" fill="#2f6aa8" stroke="#1d3f66" stroke-width="2"/><text x="1130" y="222" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ESP32</text><path d="M1050.0 215.0 L1076.0 215.0" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1076.0 215.0 L1064.9 219.7 L1064.9 210.3 Z" fill="#333"/><text x="430" y="280" font-size="14" font-weight="bold" fill="#a40000" text-anchor="middle">▼ 5V 핀 (J2-19)</text><text x="950" y="280" font-size="14" font-weight="bold" fill="#d43b3b" text-anchor="middle">▼ 3V3 핀 (J2-1) → 가변저항·센서</text><text x="60" y="318" font-size="15" font-weight="normal" fill="#333" text-anchor="start">GPIO는 3V3 라인 기준으로 동작한다 → GPIO 입력에는 0~3.3V만. 5V 핀은 전원 핀이며 GPIO 신호가 아니다.</text><rect x="40" y="360" width="570" height="500" rx="10" fill="#fff6f6" stroke="#e0a0a0" stroke-width="2"/><text x="60" y="396" font-size="20" font-weight="bold" fill="#c62828" text-anchor="start">✗ 하지 말 것</text><text x="70" y="436" font-size="16" font-weight="normal" fill="#222" text-anchor="start">1. 5V(UNO 출력·5V 센서·5V 핀)를 GPIO에 연결</text><text x="70" y="482" font-size="16" font-weight="normal" fill="#222" text-anchor="start">2. 3V3 또는 5V를 GND와 직접 연결(단락)</text><text x="70" y="528" font-size="16" font-weight="normal" fill="#222" text-anchor="start">3. USB를 꽂은 채 5V/3V3 핀에 외부 전원 추가</text><text x="70" y="574" font-size="16" font-weight="normal" fill="#222" text-anchor="start">4. 저항 없이 LED를 GPIO–GND에 연결</text><text x="70" y="620" font-size="16" font-weight="normal" fill="#222" text-anchor="start">5. GPIO34~39에 LED·부저 연결(입력 전용)</text><text x="70" y="666" font-size="16" font-weight="normal" fill="#222" text-anchor="start">6. GPIO6~11(플래시)·GPIO1/3(UART0) 사용</text><text x="70" y="712" font-size="16" font-weight="normal" fill="#222" text-anchor="start">7. 부팅 스트랩 GPIO0/2/5/12/15에 부품 연결</text><text x="70" y="758" font-size="16" font-weight="normal" fill="#222" text-anchor="start">8. USB 연결 상태에서 배선 변경</text><text x="70" y="804" font-size="16" font-weight="normal" fill="#222" text-anchor="start">9. 모터·릴레이·큰 부저를 GPIO로 직접 구동</text><rect x="630" y="360" width="570" height="500" rx="10" fill="#f3fbf5" stroke="#9fd0ae" stroke-width="2"/><text x="650" y="396" font-size="20" font-weight="bold" fill="#208657" text-anchor="start">✓ 확인 순서</text><text x="660" y="436" font-size="16" font-weight="normal" fill="#222" text-anchor="start">1. USB 분리 상태에서 배선</text><text x="660" y="482" font-size="16" font-weight="normal" fill="#222" text-anchor="start">2. 보드 GND ↔ 브레드보드 − 레일 (공통 GND)</text><text x="660" y="528" font-size="16" font-weight="normal" fill="#222" text-anchor="start">3. + 레일에는 3V3만 연결 (레일에 '3V3' 표시)</text><text x="660" y="574" font-size="16" font-weight="normal" fill="#222" text-anchor="start">4. LED 극성·저항 직렬 확인</text><text x="660" y="620" font-size="16" font-weight="normal" fill="#222" text-anchor="start">5. 버튼 대각선 다리 · 가변저항 가운데 = GPIO34</text><text x="660" y="666" font-size="16" font-weight="normal" fill="#222" text-anchor="start">6. 손가락으로 각 GPIO에서 GND까지 경로 따라가기</text><text x="660" y="712" font-size="16" font-weight="normal" fill="#222" text-anchor="start">7. USB 연결 → 보드 전원 LED 확인</text><text x="660" y="758" font-size="16" font-weight="normal" fill="#222" text-anchor="start">8. 포트 선택·업로드 → 시리얼 115200</text><text x="660" y="804" font-size="16" font-weight="normal" fill="#222" text-anchor="start">9. 이상(발열·냄새·LED 꺼짐) 시 즉시 USB 분리</text><text x="40" y="888" font-size="14" font-weight="bold" fill="#555" text-anchor="start">※ DevKitC는 폭이 넓어 브레드보드 하나에 꽂으면 한쪽 핀 옆 구멍이 거의 남지 않는다 → 보드는 밖에 두고 M-F 점퍼선으로 연결하거나 브레드보드 2개를 나란히 쓴다.</text></svg>