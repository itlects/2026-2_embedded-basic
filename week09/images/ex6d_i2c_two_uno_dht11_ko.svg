<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="900" fill="white"/><text x="40" y="50" font-size="30" font-weight="bold" fill="#1d2433" text-anchor="start">예제 6D·6E · I2C 보드 간 통신 — 슬레이브 UNO가 DHT11을 측정, 마스터 UNO가 요청</text><text x="40" y="82" font-size="17" font-weight="normal" fill="#444" text-anchor="start">I2C는 '같은 이름끼리'(SDA-SDA, SCL-SCL) + GND. 마스터가 클럭을 만들고, 슬레이브는 주소 0x08로 응답한다. 추가 I2C 부품이 필요 없다.</text><rect x="60" y="140" width="250" height="250" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="185.0" y="172" font-size="19" font-weight="bold" fill="white" text-anchor="middle">UNO 마스터 (6D)</text><rect x="288" y="212" width="16" height="16" rx="2" fill="#111"/><text x="280" y="225" font-size="15" font-weight="bold" fill="white" text-anchor="end">A4 SDA</text><rect x="288" y="267" width="16" height="16" rx="2" fill="#111"/><text x="280" y="280" font-size="15" font-weight="bold" fill="white" text-anchor="end">A5 SCL</text><rect x="288" y="322" width="16" height="16" rx="2" fill="#111"/><text x="280" y="335" font-size="15" font-weight="bold" fill="white" text-anchor="end">GND</text><rect x="830" y="140" width="250" height="370" rx="14" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="955" y="172" font-size="19" font-weight="bold" fill="white" text-anchor="middle">UNO 슬레이브 (6E)</text><text x="955" y="196" font-size="13" font-weight="normal" fill="#dce9f7" text-anchor="middle">Wire.begin(0x08)</text><rect x="836" y="212" width="16" height="16" rx="2" fill="#111"/><text x="860" y="225" font-size="15" font-weight="bold" fill="white" text-anchor="start">A4 SDA</text><path d="M304.0 220.0 L836.0 220.0" stroke="#208657" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="836" cy="220" r="4" fill="#208657" stroke="white" stroke-width="1.5"/><rect x="836" y="267" width="16" height="16" rx="2" fill="#111"/><text x="860" y="280" font-size="15" font-weight="bold" fill="white" text-anchor="start">A5 SCL</text><path d="M304.0 275.0 L836.0 275.0" stroke="#555" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="836" cy="275" r="4" fill="#555" stroke="white" stroke-width="1.5"/><rect x="836" y="322" width="16" height="16" rx="2" fill="#111"/><text x="860" y="335" font-size="15" font-weight="bold" fill="white" text-anchor="start">GND</text><path d="M304.0 330.0 L836.0 330.0" stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="836" cy="330" r="4" fill="#222" stroke="white" stroke-width="1.5"/><rect x="1058" y="392" width="16" height="16" rx="2" fill="#111"/><text x="1050" y="405" font-size="14" font-weight="bold" fill="white" text-anchor="end">D2</text><rect x="1058" y="432" width="16" height="16" rx="2" fill="#111"/><text x="1050" y="445" font-size="14" font-weight="bold" fill="white" text-anchor="end">5V</text><rect x="1058" y="472" width="16" height="16" rx="2" fill="#111"/><text x="1050" y="485" font-size="14" font-weight="bold" fill="white" text-anchor="end">D13 LED</text><circle cx="980" cy="480" r="0" fill="none" stroke="none" stroke-width="0"/><rect x="1110" y="230" width="110" height="130" rx="8" fill="#2a7fc4" stroke="#14507e" stroke-width="2"/><rect x="1122" y="244" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1140" y="244" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1158" y="244" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1176" y="244" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1194" y="244" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1122" y="262" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1140" y="262" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1158" y="262" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1176" y="262" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1194" y="262" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1122" y="280" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1140" y="280" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1158" y="280" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1176" y="280" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1194" y="280" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1122" y="298" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1140" y="298" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1158" y="298" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1176" y="298" width="12" height="12" rx="2" fill="#bfe0f7"/><rect x="1194" y="298" width="12" height="12" rx="2" fill="#bfe0f7"/><text x="1165" y="330" font-size="12" font-weight="bold" fill="white" text-anchor="middle">DHT11 모듈</text><text x="1135" y="354" font-size="13" font-weight="bold" fill="white" text-anchor="middle">S</text><path d="M1135.0 360.0 L1135.0 390.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1135" cy="394" r="6" fill="#d4af37" stroke="none" stroke-width="0"/><text x="1165" y="354" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+</text><path d="M1165.0 360.0 L1165.0 390.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1165" cy="394" r="6" fill="#d4af37" stroke="none" stroke-width="0"/><text x="1195" y="354" font-size="13" font-weight="bold" fill="white" text-anchor="middle">−</text><path d="M1195.0 360.0 L1195.0 390.0" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1195" cy="394" r="6" fill="#d4af37" stroke="none" stroke-width="0"/><path d="M1074.0 400.0 L1135.0 400.0 L1135.0 394.0" stroke="#7b4bb3" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1074.0 440.0 L1165.0 440.0 L1165.0 394.0" stroke="#d43b3b" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1195.0 394.0 L1195.0 440.0" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1195" y="460" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">GND</text><text x="955" y="530" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">D13 = 보드 내장 LED (온도 경보 표시)</text><text x="570" y="210" font-size="13" font-weight="bold" fill="#208657" text-anchor="middle">SDA: 데이터(양방향)</text><text x="570" y="265" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">SCL: 마스터가 클럭 생성</text><text x="570" y="380" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">UNO Wire가 내부 풀업을 켠다(짧은 배선이면 동작). 길면 4.7kΩ 외부 풀업</text><rect x="40" y="540" width="1160" height="330" rx="10" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="574" font-size="20" font-weight="bold" fill="#208657" text-anchor="start">통신 순서 (2초마다)</text><text x="80" y="600" font-size="14" font-weight="bold" fill="#222" text-anchor="start">단계</text><text x="170" y="600" font-size="14" font-weight="bold" fill="#208657" text-anchor="start">마스터 6D</text><text x="560" y="600" font-size="14" font-weight="bold" fill="#555" text-anchor="start">버스</text><text x="860" y="600" font-size="14" font-weight="bold" fill="#208657" text-anchor="start">슬레이브 6E</text><text x="80" y="645" font-size="14" font-weight="bold" fill="#222" text-anchor="start">① 읽기</text><text x="170" y="645" font-size="13" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">Wire.requestFrom(0x08, 4)</text><text x="560" y="645" font-size="13" font-weight="normal" fill="#333" text-anchor="start">START · 0x08+R · ACK</text><text x="860" y="645" font-size="13" font-weight="normal" fill="#222" text-anchor="start">onRequest() → Wire.write(packet, 4)</text><text x="80" y="691" font-size="14" font-weight="bold" fill="#222" text-anchor="start"></text><text x="170" y="691" font-size="13" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">Wire.read() ×4</text><text x="560" y="691" font-size="13" font-weight="normal" fill="#333" text-anchor="start">[상태][온도][습도][체크섬] · STOP</text><text x="860" y="691" font-size="13" font-weight="normal" fill="#222" text-anchor="start">packet은 loop에서 2초마다 DHT11로 갱신</text><text x="80" y="737" font-size="14" font-weight="bold" fill="#222" text-anchor="start">② 쓰기</text><text x="170" y="737" font-size="13" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">beginTransmission(0x08); write(1/0)</text><text x="560" y="737" font-size="13" font-weight="normal" fill="#333" text-anchor="start">START · 0x08+W · ACK · 명령 · ACK</text><text x="860" y="737" font-size="13" font-weight="normal" fill="#222" text-anchor="start">onReceive(n) → LED 명령 저장</text><text x="80" y="783" font-size="14" font-weight="bold" fill="#222" text-anchor="start"></text><text x="170" y="783" font-size="13" font-weight="normal" font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#1d2433" text-anchor="start" xml:space="preserve">endTransmission() == 0 → ACK</text><text x="560" y="783" font-size="13" font-weight="normal" fill="#333" text-anchor="start">STOP</text><text x="860" y="783" font-size="13" font-weight="normal" fill="#222" text-anchor="start">loop에서 D13 LED ON/OFF</text><text x="80" y="845" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">⚠ ESP32를 마스터로 쓰려면 UNO 쪽 5V 풀업 때문에 I2C 양방향 레벨 시프터가 필요하다. 이 실습은 UNO 2대 권장.</text></svg>