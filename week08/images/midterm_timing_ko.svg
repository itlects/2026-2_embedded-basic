xt><rect x="250" y="700" width="62.5" height="36" rx="4" fill="#7b4bb3"/><text x="281.25" y="724" font-size="15" font-weight="bold" fill="white" text-anchor="middle">도</text><text x="281.25" y="754" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">262Hz</text><rect x="312.5" y="700" width="10.0" height="36" fill="#eceef1"/><rect x="322.5" y="700" width="62.5" height="36" rx="4" fill="#7b4bb3"/><text x="353.75" y="724" font-size="15" font-weight="bold" fill="white" text-anchor="middle">레</text><text x="353.75" y="754" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">294Hz</text><rect x="385.0" y="700" width="10.0" height="36" fill="#eceef1"/><rect x="395.0" y="700" width="62.5" height="36" rx="4" fill="#7b4bb3"/><text x="426.25" y="724" font-size="15" font-weight="bold" fill="white" text-anchor="middle">미</text><text x="426.25" y="754" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">330Hz</text><rect x="457.5" y="700" width="10.0" height="36" fill="#eceef1"/><rect x="467.5" y="700" width="62.5" height="36" rx="4" fill="#7b4bb3"/><text x="498.75" y="724" font-size="15" font-weight="bold" fill="white" text-anchor="middle">파</text><text x="498.75" y="754" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">349Hz</text><rect x="530.0" y="700" width="10.0" height="36" fill="#eceef1"/><rect x="540.0" y="700" width="62.5" height="36" rx="4" fill="#7b4bb3"/><text x="571.25" y="724" font-size="15" font-weight="bold" fill="white" text-anchor="middle">솔</text><text x="571.25" y="754" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">392Hz</text><rect x="602.5" y="700" width="10.0" height="36" fill="#eceef1"/><text x="624.5" y="724" font-size="15" font-weight="bold" fill="#333" text-anchor="start">→ 소리 정지, 모든 LED 꺼짐, STOP</text><text x="238" y="724" font-size="15" font-weight="normal" fill="#222" text-anchor="end">부저</text><text x="250" y="782" font-size="14" font-weight="normal" fill="#555" text-anchor="start">음 길이 200~300ms(그림은 250ms) · 음 사이 무음 30~50ms(그림은 40ms) · 4음 이상이면 곡은 자유</text><text x="40" y="822" font-size="15" font-weight="bold" fill="#c62828" text-anchor="start">※ 같은 버튼(1~3)을 다시 누르면 그 칸에서 일시정지(불빛 유지) → 한 번 더 누르면 이어서 진행.  다른 버튼은 언제든 즉시 전환.</text></svg>