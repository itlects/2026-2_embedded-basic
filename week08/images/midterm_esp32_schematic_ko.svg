nd">GPIO18</text><path d="M270 335 L520 335" stroke="#2664bf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520" y="323" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565" y="341" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610 335 L700 335" stroke="#2664bf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 319 L700 351 L732 335 Z" fill="#2664bf" stroke="#222" stroke-width="2"/><path d="M732 319 L732 351" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712 313 L724 301" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722 315 L734 303" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="690" y="315" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="745" y="317" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="780" y="341" font-size="16" font-weight="bold" fill="#2664bf" text-anchor="start">LED3  (긴 다리가 +)</text><path d="M732 335 L760 335 L760 357 L1120 357" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="250" y="396" width="18" height="18" rx="2" fill="#111"/><text x="242" y="411" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO19</text><path d="M270 405 L520 405" stroke="#e07b16" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520" y="393" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565" y="411" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610 405 L700 405" stroke="#e07b16" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 389 L700 421 L732 405 Z" fill="#e07b16" stroke="#222" stroke-width="2"/><path d="M732 389 L732 421" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712 383 L724 371" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722 385 L734 373" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="690" y="385" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="745" y="387" font-size="16" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="780" y="411" font-size="16" font-weight="bold" fill="#e07b16" text-anchor="start">LED4  (긴 다리가 +)</text><path d="M732 405 L760 405 L760 427 L1120 427" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="500" font-size="18" font-weight="bold" fill="#333" text-anchor="start">입력 — 버튼 (GPIO ↔ 버튼 ↔ GND, 내부 풀업 INPUT_PULLUP)</text><rect x="250" y="536" width="18" height="18" rx="2" fill="#111"/><text x="242" y="551" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO21</text><path d="M270 545 L560 545" stroke="#b8322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560" cy="545" r="5" fill="#b8322f"/><path d="M560 545 L600 527" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="545" r="5" fill="#222"/><path d="M620 545 L1120 545" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="537" font-size="16" font-weight="bold" fill="#b8322f" text-anchor="start">버튼1  (누르면 LOW)</text><rect x="250" y="588" width="18" height="18" rx="2" fill="#111"/><text x="242" y="603" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO22</text><path d="M270 597 L560 597" stroke="#1b6e48" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560" cy="597" r="5" fill="#1b6e48"/><path d="M560 597 L600 579" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="597" r="5" fill="#222"/><path d="M620 597 L1120 597" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="589" font-size="16" font-weight="bold" fill="#1b6e48" text-anchor="start">버튼2  (누르면 LOW)</text><rect x="250" y="640" width="18" height="18" rx="2" fill="#111"/><text x="242" y="655" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO23</text><path d="M270 649 L560 649" stroke="#1f529c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560" cy="649" r="5" fill="#1f529c"/><path d="M560 649 L600 631" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="649" r="5" fill="#222"/><path d="M620 649 L1120 649" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="641" font-size="16" font-weight="bold" fill="#1f529c" text-anchor="start">버튼3  (누르면 LOW)</text><rect x="250" y="692" width="18" height="18" rx="2" fill="#111"/><text x="242" y="707" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO25</text><path d="M270 701 L560 701" stroke="#a85a0c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560" cy="701" r="5" fill="#a85a0c"/><path d="M560 701 L600 683" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="701" r="5" fill="#222"/><path d="M620 701 L1120 701" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="693" font-size="16" font-weight="bold" fill="#a85a0c" text-anchor="start">버튼4  (누르면 LOW)</text><rect x="880" y="470" width="300" height="0" fill="none"/><rect x="250" y="751" width="18" height="18" rx="2" fill="#111"/><text x="242" y="766" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO26</text><path d="M270 760 L700 760" stroke="#7b4bb3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="730" cy="760" r="26" fill="#2b2b2b" stroke="#000" stroke-width="2"/><text x="712" y="758" font-size="15" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><path d="M756 760 L1120 760" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="780" y="750" font-size="16" font-weight="bold" fill="#7b4bb3" text-anchor="start">수동 부저 (+ 표시가 신호 쪽)</text><path d="M1120 217 L1120 820 L260 820" stroke="#222" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1120" cy="217" r="5" fill="#222"/><circle cx="1120" cy="287" r="5" fill="#222"/><circle cx="1120" cy="357" r="5" fill="#222"/><circle cx="1120" cy="427" r="5" fill="#222"/><circle cx="1120" cy="545" r="5" fill="#222"/><circle cx="1120" cy="597" r="5" fill="#222"/><circle cx="1120" cy="649" r="5" fill="#222"/><circle cx="1120" cy="701" r="5" fill="#222"/><circle cx="1120" cy="760" r="5" fill="#222"/><rect x="250" y="811" width="18" height="18" rx="2" fill="#111"/><text x="242" y="826" font-size="17" font-weight="bold" fill="white" text-anchor="end">GND</text><text x="1110" y="852" font-size="17" font-weight="bold" fill="#222" text-anchor="end">공통 GND</text><text x="40" y="885" font-size="15" font-weight="normal" fill="#555" text-anchor="start">버튼은 외부 저항 없이 내부 풀업을 사용한다(평소 HIGH, 누르면 LOW).  LED마다 저항을 하나씩 반드시 직렬로 연결한다.</text></svg>