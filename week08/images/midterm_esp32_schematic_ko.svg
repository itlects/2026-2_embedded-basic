<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="900" fill="white"/><text x="40" y="48" font-size="30" font-weight="bold" fill="#222" text-anchor="start">ESP32 DevKitC V4 — 중간고사 회로 연결도</text><text x="40" y="80" font-size="17" font-weight="normal" fill="#444" text-anchor="start">LED·버튼·부저가 각각 어느 핀에 어떻게 연결되는지 보여 주는 개략도이다. 모든 GND는 하나로 연결된다.</text><rect x="40" y="110" width="230" height="738" rx="16" fill="#2f6aa8" stroke="#1d3f66" stroke-width="3"/><text x="155.0" y="148" font-size="21" font-weight="bold" fill="white" text-anchor="middle">ESP32 DevKitC V4</text><text x="330" y="150" font-size="18" font-weight="bold" fill="#333" text-anchor="start">출력 — LED (GPIO → 저항 → LED + … LED − → GND)</text><rect x="250" y="186" width="18" height="18" rx="2" fill="#111"/><text x="242" y="201" font-size="17" font-weight="bold" fill="white" text-anchor="end">GPIO16</text><path d="M270 195 L520 195" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520" y="183" width="90" height="24" rx="4" fill="#fff5da" stroke="#8a5818" stroke-width="2"/><text x="565" y="201" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">220~330Ω</text><path d="M610 195 L700 195" stroke="#d43b3b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 179 L700 211 L732 195 Z" fill="#d43b3b" stroke="#222" stroke-width="2"/><path d="M732 179 L732 211" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M712 173 L724 161" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M722 175 L734 163" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="690" y="175" font-size="15" font-weight="bold" fill="#c62828" text-anchor="end">+</text