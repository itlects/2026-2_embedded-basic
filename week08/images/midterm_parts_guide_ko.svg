d" stroke-linecap="round" stroke-dasharray="6 4"/><text x="775" y="340" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">1–2, 3–4는 항상 연결(점선)</text><text x="775" y="362" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">누르면 위·아래가 연결된다</text><text x="775" y="386" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">→ 대각선 1번·4번 다리 사용</text><circle cx="1075" cy="230" r="48" fill="#2b2b2b" stroke="#000" stroke-width="2"/><circle cx="1075" cy="230" r="8" fill="#555"/><text x="1049" y="216" font-size="22" font-weight="bold" fill="#ff6b6b" text-anchor="middle">+</text><path d="M1061 278 L1061 330" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M1089 278 L1089 330" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1055" y="355" font-size="18" font-weight="bold" fill="#c62828" text-anchor="end">+</text><text x="1095" y="355" font-size="18" font-weight="bold" fill="#333" text-anchor="start">−</text><text x="1075" y="380" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">밑면에 기판이 보이면 수동 부저</text><text x="1075" y="400" font-size="13" font-weight="normal" fill="#555" text-anchor="middle">(스티커 붙은 밀봉형은 능동)</text><rect x="40" y="450" width="1170" height="220" rx="12" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="60" y="484" font-size="20" font-weight="bold" fill="#222" text-anchor="start">브레드보드 내부 연결</text><rect x="110" y="510" width="560" height="140" rx="8" fill="#f4f1e8" stroke="#cfc6ad" stroke-width="2"/><rect x="140" y="522" width="6" height="6" fill="#6b6658"/><rect x="161" y="522" width="6" height="6" fill="#6b6658"/><rect x="182" y="522" width="6" height="6" fill="#6b6658"/><rect x="203" y="522" width="6" height="6" fill="#6b6658"/><rect x="224" y="522" width="6" height="6" fill="#6b6658"/><rect x="245" y="522" width="6" height="6" fill="#6b6658"/><rect x="266" y="522" width="6" height="6