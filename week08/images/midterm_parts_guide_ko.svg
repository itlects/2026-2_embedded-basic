<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect width="1240" height="700" fill="white"/><text x="40" y="48" font-size="30" font-weight="bold" fill="#222" text-anchor="start">부품 확인 — 극성과 내부 연결</text><text x="40" y="80" font-size="17" font-weight="normal" fill="#444" text-anchor="start">배선 전에 각 부품의 방향을 확인한다. 극성을 반대로 꽂으면 LED가 켜지지 않거나 부저가 울리지 않는다.</text><rect x="40" y="110" width="270" height="300" rx="12" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="175" y="144" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">LED</text><rect x="340" y="110" width="270" height="300" rx="12" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="475" y="144" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">저항 220~330Ω</text><rect x="640" y="110" width="270" height="300" rx="12" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="775" y="144" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">4핀 택트 스위치</text><rect x="940" y="110" width="270" height="300" rx="12" fill="#fafafa" stroke="#c9ced6" stroke-width="2"/><text x="1075" y="144" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">수동 부저</text><path d="M153 240 L153 200 A22 22 0 0 1 197 200 L197 240 Z" fill="#d43b3b" fill-opacity="0.85" stroke="#333" stroke-width="2"/><rect x="149" y="240" width="52" height="7" fill="#d43b3b" stroke="#333"/><path d="M165 247 L165 365" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M185 247 L185 335" stroke="#999" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="157" y="390" font-size="16" font-weight="bold" fill="#c62828" text-anchor="end">긴 다리 = +</text><text x="193" y="360" font-size="16" font-weight="bold" fill="#333" text-anchor="start">짧은 다리 = −</text><text x="205" y="230" font-size="13" font-weigh